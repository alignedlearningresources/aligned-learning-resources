<body><a class="back" href="../index.html">← Back to Number</a><header><div class="brand">Canadian Math Practice</div><div class="meta">Ontario • Grade 6</div></header><div class="wrap"><div class="crumb">Grade 6 › Number › Divisibility Rules</div><h1>Divisibility Rules</h1><p class="lead">Use divisibility tests to determine whether natural numbers divide evenly.</p><section class="card"><div class="top"><strong>Divisibility Rules Practice</strong><span>Question <b id="n">1</b>/10 • Score <b id="score">0</b></span></div><div class="progress"><div class="fill" id="fill"></div></div><div class="q" id="q"></div><div class="options" id="opts"></div><div class="feedback" id="fb"></div><div class="why" id="why"></div><button class="next" id="next" onclick="nextQ()" style="display:none">Next Question</button></section></div>
<script>
let i=0,score=0,answered=false;
const D=[{"q":"Which number is divisible by 2?","a":"146","o":["135","146","217","329"],"w":"A number divisible by 2 has an even ones digit."},{"q":"Which number is divisible by 5?","a":"375","o":["372","374","375","378"],"w":"Numbers divisible by 5 end in 0 or 5."},{"q":"Which number is divisible by 10?","a":"4,230","o":["4,203","4,213","4,230","4,235"],"w":"Numbers divisible by 10 end in 0."},{"q":"Which number is divisible by 3?","a":"624","o":["611","617","624","631"],"w":"6 + 2 + 4 = 12, and 12 is divisible by 3."},{"q":"Which number is divisible by 9?","a":"729","o":["718","724","729","734"],"w":"7 + 2 + 9 = 18, and 18 is divisible by 9."},{"q":"Which number is divisible by 4?","a":"1,316","o":["1,314","1,316","1,318","1,322"],"w":"The last two digits are 16, which is divisible by 4."},{"q":"Which number is divisible by 6?","a":"438","o":["425","432","438","445"],"w":"438 is even and its digit sum is 15, so it is divisible by 2 and 3."},{"q":"Which number is divisible by 8?","a":"1,024","o":["1,018","1,022","1,024","1,026"],"w":"The last three digits represent 24, which is divisible by 8."},{"q":"Can 234 counters be shared equally among 9 groups?","a":"Yes, because 2 + 3 + 4 = 9.","o":["Yes, because 234 is even.","Yes, because 2 + 3 + 4 = 9.","No, because 234 does not end in 9.","No, because 234 is greater than 90."],"w":"The digit sum is 9, so 234 is divisible by 9."},{"q":"Which statement is true about 3,240?","a":"It is divisible by 2, 3, 5, 6, 8, 9, and 10.","o":["It is divisible only by 2 and 5.","It is divisible by 2, 3, 5, 6, 8, 9, and 10.","It is not divisible by 9.","It is divisible by 4 but not by 8."],"w":"3,240 satisfies each listed divisibility test."}];
const n=document.getElementById("n"),sc=document.getElementById("score"),fill=document.getElementById("fill"),q=document.getElementById("q"),opts=document.getElementById("opts"),fb=document.getElementById("fb"),why=document.getElementById("why"),next=document.getElementById("next");
function render(){answered=false;let x=D[i];n.textContent=i+1;sc.textContent=score;fill.style.width=((i+1)*10)+"%";q.textContent=x.q;fb.textContent="";why.textContent="";next.style.display="none";opts.innerHTML=[...x.o].sort(()=>Math.random()-.5).map(v=>`<button class="opt" data-v="${v}" onclick="pick(this)">${v}</button>`).join("")}
function pick(el){if(answered)return;answered=true;document.querySelectorAll(".opt").forEach(b=>b.disabled=true);let x=D[i];if(el.dataset.v===x.a){score++;sc.textContent=score;fb.textContent="✓ Correct!"}else fb.textContent="✗ Not quite. Correct answer: "+x.a;why.textContent=x.w;next.textContent=i===9?"See Result":"Next Question";next.style.display="inline-block"}
function nextQ(){if(i<9){i++;render()}else{q.textContent="Practice complete!";opts.innerHTML="";fb.textContent=`Your score: ${score}/10`;why.textContent=score>=8?"Strong integer reasoning.":"Try again and use a number line: numbers farther right are greater, and numbers farther left are less.";next.style.display="none"}}render();</script></body></html>
