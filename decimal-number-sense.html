<body><a class="back" href="../index.html">← Back to Number</a><header><div class="brand">Canadian Math Practice</div><div class="meta">Ontario • Grade 6</div></header><div class="wrap"><div class="crumb">Grade 6 › Number › Decimal Number Sense</div><h1>Decimal Number Sense</h1><p class="lead">Read, represent, compare, and order decimal numbers up to thousandths.</p><section class="card"><div class="top"><strong>Integer Practice</strong><span>Question <b id="n">1</b>/10 • Score <b id="score">0</b></span></div><div class="progress"><div class="fill" id="fill"></div></div><div class="q" id="q"></div><div class="options" id="opts"></div><div class="feedback" id="fb"></div><div class="why" id="why"></div><button class="next" id="next" onclick="nextQ()" style="display:none">Next Question</button></section></div>
<script>
let i=0,score=0,answered=false;
const D=[{"q":"In 4.372, what is the value of the digit 7?","a":"0.07","o":["0.7","0.07","0.007","7"],"w":"The 7 is in the hundredths place, so its value is 0.07."},{"q":"Which decimal is written as “six and forty-two thousandths”?","a":"6.042","o":["6.42","6.042","6.402","6.0042"],"w":"Forty-two thousandths is 0.042, so the number is 6.042."},{"q":"Which expanded form represents 8.305?","a":"8 + 0.3 + 0.005","o":["8 + 0.3 + 0.05","8 + 0.03 + 0.005","8 + 0.3 + 0.005","8 + 0.305 + 0.05"],"w":"8.305 has 8 ones, 3 tenths, 0 hundredths, and 5 thousandths."},{"q":"Choose the correct symbol: 5.407 ___ 5.47","a":"<","o":["<",">","="],"w":"Write 5.47 as 5.470. Since 407 thousandths is less than 470 thousandths, 5.407 < 5.47."},{"q":"Which number is greatest?","a":"12.58","o":["12.508","12.58","12.085","12.5"],"w":"Write the decimals to thousandths: 12.508, 12.580, 12.085, 12.500. The greatest is 12.58."},{"q":"Order from least to greatest: 3.09, 3.009, 3.9, 3.099","a":"3.009, 3.09, 3.099, 3.9","o":["3.009, 3.09, 3.099, 3.9","3.09, 3.009, 3.099, 3.9","3.9, 3.099, 3.09, 3.009","3.009, 3.099, 3.09, 3.9"],"w":"Compare 3.009, 3.090, 3.099, and 3.900."},{"q":"Which decimal is between 7.214 and 7.22?","a":"7.218","o":["7.204","7.212","7.218","7.224"],"w":"7.218 is greater than 7.214 and less than 7.220."},{"q":"A measurement is 2.375 m. Which statement is true?","a":"The 5 represents five thousandths of a metre.","o":["The 5 represents five tenths of a metre.","The 5 represents five hundredths of a metre.","The 5 represents five thousandths of a metre.","The 5 represents five metres."],"w":"In 2.375, the 5 is in the thousandths place."},{"q":"Which list is ordered from greatest to least?","a":"0.82, 0.802, 0.28, 0.208","o":["0.82, 0.802, 0.28, 0.208","0.802, 0.82, 0.28, 0.208","0.82, 0.28, 0.802, 0.208","0.208, 0.28, 0.802, 0.82"],"w":"Using thousandths: 0.820 > 0.802 > 0.280 > 0.208."},{"q":"A number has 4 ones, 6 tenths, 0 hundredths, and 9 thousandths. What is the number?","a":"4.609","o":["4.069","4.609","4.69","46.009"],"w":"4 + 0.6 + 0.009 = 4.609."}];
const n=document.getElementById("n"),sc=document.getElementById("score"),fill=document.getElementById("fill"),q=document.getElementById("q"),opts=document.getElementById("opts"),fb=document.getElementById("fb"),why=document.getElementById("why"),next=document.getElementById("next");
function render(){answered=false;let x=D[i];n.textContent=i+1;sc.textContent=score;fill.style.width=((i+1)*10)+"%";q.textContent=x.q;fb.textContent="";why.textContent="";next.style.display="none";opts.innerHTML=[...x.o].sort(()=>Math.random()-.5).map(v=>`<button class="opt" data-v="${v}" onclick="pick(this)">${v}</button>`).join("")}
function pick(el){if(answered)return;answered=true;document.querySelectorAll(".opt").forEach(b=>b.disabled=true);let x=D[i];if(el.dataset.v===x.a){score++;sc.textContent=score;fb.textContent="✓ Correct!"}else fb.textContent="✗ Not quite. Correct answer: "+x.a;why.textContent=x.w;next.textContent=i===9?"See Result":"Next Question";next.style.display="inline-block"}
function nextQ(){if(i<9){i++;render()}else{q.textContent="Practice complete!";opts.innerHTML="";fb.textContent=`Your score: ${score}/10`;why.textContent=score>=8?"Strong integer reasoning.":"Try again and use a number line: numbers farther right are greater, and numbers farther left are less.";next.style.display="none"}}render();</script></body></html>
