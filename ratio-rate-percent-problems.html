<title>Ratio, Rate & Percent Problems | Ontario Grade 6 Math</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fa;color:#172033}.back{display:inline-block;margin:16px 5% 0;text-decoration:none;font-weight:700;color:#172033}header{padding:18px 5%;background:#fff;border-bottom:1px solid #e2e7ee;display:flex;justify-content:space-between}.brand{font-weight:800;font-size:22px}.meta{color:#667085}.wrap{max-width:1000px;margin:auto;padding:42px 5% 70px}.crumb{color:#667085;font-size:14px}h1{font-size:42px;margin:12px 0 8px}.lead{font-size:18px;color:#667085}.card{background:#fff;border:1px solid #e1e6ed;border-radius:16px;padding:28px;margin-top:28px}.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:#667085}.progress{height:8px;background:#e8ecf2;border-radius:99px;margin:15px 0 30px;overflow:hidden}.fill{height:100%;background:#172033}.q{font-size:27px;font-weight:800;line-height:1.45;margin:18px 0 22px}.options{display:grid;gap:10px;max-width:820px}.opt{background:#fff;border:1px solid #cfd6df;border-radius:10px;padding:14px;text-align:left;font-size:17px;font-weight:700;cursor:pointer;color:#172033}.feedback{font-weight:800;margin-top:18px}.why{color:#667085;line-height:1.55;margin-top:7px}.next{margin-top:18px;background:#172033;color:#fff;border:0;border-radius:9px;padding:11px 15px;font-weight:800;cursor:pointer}@media(max-width:600px){h1{font-size:34px}.q{font-size:22px}header{flex-direction:column;gap:5px}}</style></head>
<body><a class="back" href="../index.html">← Back to Number</a><header><div class="brand">Canadian Math Practice</div><div class="meta">Ontario • Grade 6</div></header><div class="wrap"><div class="crumb">Grade 6 › Number › Ratio, Rate & Percent Problems</div><h1>Ratio, Rate & Percent Problems</h1><p class="lead">Choose and apply ratio, rate, or percent reasoning in multi-step real-world problems.</p><section class="card"><div class="top"><strong>Problem Solving Practice</strong><span>Question <b id="n">1</b>/10 • Score <b id="score">0</b></span></div><div class="progress"><div class="fill" id="fill"></div></div><div class="q" id="q"></div><div class="options" id="opts"></div><div class="feedback" id="fb"></div><div class="why" id="why"></div><button class="next" id="next" onclick="nextQ()" style="display:none">Next Question</button></section></div>
<script>
let i=0,score=0,answered=false;
const D=[
{q:"A fruit drink uses juice and water in a ratio of 1:3. If 4 cups of juice are used, how many cups of water are needed?",a:"12 cups",o:["7 cups","8 cups","12 cups","16 cups"],w:"The ratio scale factor is 4, so 3×4=12 cups of water."},
{q:"A cyclist travels 42 km in 2 hours. At the same rate, how far will the cyclist travel in 5 hours?",a:"105 km",o:["84 km","100 km","105 km","210 km"],w:"42÷2=21 km/h. Then 21×5=105 km."},
{q:"A $40 game is discounted by 20%. What is the discount amount?",a:"$8",o:["$4","$8","$20","$32"],w:"10% of $40 is $4, so 20% is $8."},
{q:"A class has boys and girls in a ratio of 2:3. There are 30 students altogether. How many are girls?",a:"18",o:["10","12","18","20"],w:"There are 5 ratio parts. 30÷5=6 per part. Girls are 3 parts: 3×6=18."},
{q:"A 6-pack of yogurt costs $7.50. At the same unit price, what would 10 yogurts cost?",a:"$12.50",o:["$10.50","$12.00","$12.50","$15.00"],w:"$7.50÷6=$1.25 each. Ten cost 10×$1.25=$12.50."},
{q:"A school has 240 students. The ratio of students who walk to school to those who do not is 1:3. What percent of the students walk to school?",a:"25%",o:["20%","25%","33%","75%"],w:"1:3 means 1 out of 4 total parts walk. 1/4=25%."},
{q:"Store A sells 5 notebooks for $8. Store B sells 8 notebooks for $12. Which is the better buy?",a:"Store B",o:["Store A","Store B","They cost the same per notebook.","Cannot be determined."],w:"Store A: $8÷5=$1.60 each. Store B: $12÷8=$1.50 each. Store B is cheaper per notebook."},
{q:"A club has 80 members. 35% are Grade 6 students. Of those Grade 6 students, half joined the art group. How many Grade 6 students joined the art group?",a:"14",o:["12","14","28","40"],w:"35% of 80 is 28. Half of 28 is 14."},
{q:"A recipe uses flour and oats in a ratio of 5:2. A baker uses 15 cups of flour. Flour costs $0.80 per cup and oats cost $1.10 per cup. What is the total cost of the flour and oats?",a:"$18.60",o:["$15.30","$17.50","$18.60","$22.50"],w:"15 cups of flour means a scale factor of 3, so oats=6 cups. Flour costs $12.00 and oats cost $6.60, for $18.60 total."},
{q:"A store advertises: 'Buy 4 bottles for $10, then save 20% on the total.' Another store sells the same bottles for $1.95 each. Which option costs less for 4 bottles?",a:"The second store costs less by $0.20.",o:["The first store costs less by $0.20.","The second store costs less by $0.20.","Both options cost $8.00.","The second store costs less by $2.20."],w:"First store: 20% off $10 gives $8.00. Second store: 4×$1.95=$7.80. The second store costs $0.20 less."}
];
const n=document.getElementById("n"),sc=document.getElementById("score"),fill=document.getElementById("fill"),q=document.getElementById("q"),opts=document.getElementById("opts"),fb=document.getElementById("fb"),why=document.getElementById("why"),next=document.getElementById("next");
function render(){answered=false;let x=D[i];n.textContent=i+1;sc.textContent=score;fill.style.width=((i+1)*10)+"%";q.textContent=x.q;fb.textContent="";why.textContent="";next.style.display="none";opts.innerHTML=[...x.o].sort(()=>Math.random()-.5).map(v=>`<button class="opt" data-v="${v}" onclick="pick(this)">${v}</button>`).join("")}
function pick(el){if(answered)return;answered=true;document.querySelectorAll(".opt").forEach(b=>b.disabled=true);let x=D[i];if(el.dataset.v===x.a){score++;sc.textContent=score;fb.textContent="✓ Correct!"}else fb.textContent="✗ Not quite. Correct answer: "+x.a;why.textContent=x.w;next.textContent=i===9?"See Result":"Next Question";next.style.display="inline-block"}
function nextQ(){if(i<9){i++;render()}else{q.textContent="Practice complete!";opts.innerHTML="";fb.textContent=`Your score: ${score}/10`;why.textContent=score>=8?"Strong multi-step problem solving.":"Try again and decide first whether the situation involves a ratio, a unit rate, a percent, or more than one of them.";next.style.display="none"}}render();</script></body></html>
