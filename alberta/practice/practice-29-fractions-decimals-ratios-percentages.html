<h1 style="font-size:40px;color:var(--navy);margin:18px 0 8px">Practice 29 — Fractions, Decimals, Ratios &amp; Percentages</h1><p style="color:var(--muted);font-size:17px;margin:0 0 24px">15-question Alberta Grade 6 Number practice with immediate feedback.</p>
<section class="quiz-card"><div class="quiz-meta"><strong>15 Questions</strong><span>Question <b id="num">1</b>/<b id="total"></b> · Score <b id="score">0</b></span></div><div class="progress"><div id="bar"></div></div><div class="question" id="question"></div><div class="options" id="options"></div><div class="feedback" id="feedback"></div><button class="next" id="next">Next Question</button></section></main>
<script>
const DATA=[{"q": "Which decimal represents 3/10?", "o": ["0.03", "0.3", "3.0", "0.13"], "a": "B"}, {"q": "Which fraction represents 0.6?", "o": ["1/6", "6/100", "6/10", "10/6"], "a": "C"}, {"q": "Which percentage represents 0.25?", "o": ["2.5%", "25%", "0.25%", "250%"], "a": "B"}, {"q": "Which decimal represents 45%?", "o": ["0.45", "4.5", "0.045", "45.0"], "a": "A"}, {"q": "A box contains 4 red counters and 6 blue counters. Which fraction represents the number of red counters compared with the total number of counters?", "o": ["4/6", "6/10", "4/10", "6/4"], "a": "C"}, {"q": "In a class, 3 out of every 5 students bring lunch from home. Which set represents the same relationship?", "o": ["3/5, 0.3, 30%", "3/5, 0.6, 60%", "3/5, 0.5, 50%", "3/5, 0.8, 80%"], "a": "B"}, {"q": "Which set contains three equivalent representations?", "o": ["1/4, 0.4, 40%", "3/5, 0.5, 50%", "3/4, 0.75, 75%", "2/5, 0.2, 20%"], "a": "C"}, {"q": "A survey shows that 8 of 20 students chose soccer. Which decimal and percentage represent this part-to-whole relationship?", "o": ["0.8 and 80%", "0.2 and 20%", "0.4 and 40%", "0.08 and 8%"], "a": "C"}, {"q": "A bag contains 7 yellow beads and 3 green beads. Which set correctly represents green beads compared with all beads?", "o": ["3:7, 3/7, 30%", "3:10, 3/10, 30%", "7:10, 7/10, 30%", "3:10, 3/10, 70%"], "a": "B"}, {"q": "A grid has 100 equal squares. 35 squares are shaded. Which set represents the shaded part?", "o": ["35/100, 0.35, 35%", "35/100, 0.035, 35%", "35/100, 0.35, 3.5%", "65/100, 0.65, 65%"], "a": "A"}, {"q": "A team won 9 of its 12 games. Which set correctly represents the games won compared with all games?", "o": ["9:12, 0.25, 25%", "3:4, 0.50, 50%", "9:12, 0.75, 75%", "9:3, 0.75, 75%"], "a": "C"}, {"q": "A student says, \"The ratio 2:5 can always be written as 40%.\" What information is needed before interpreting the ratio as a percentage?", "o": ["Whether 2 and 5 are even numbers", "Whether the ratio can be simplified", "Whether 2 represents a part and 5 represents the whole", "Whether 5 is greater than 2"], "a": "C"}, {"q": "A jar contains 6 red, 9 blue, and 5 green marbles. What percentage of all the marbles are blue?", "o": ["9%", "20%", "45%", "55%"], "a": "C"}, {"q": "A jar contains 12 red counters and 8 blue counters. Which statement correctly describes the red counters as a part of the whole?", "o": ["12:8 = 3/2 = 150%", "8:20 = 2/5 = 40%", "12:20 = 3/5 = 0.6 = 6%", "12:20 = 3/5 = 0.6 = 60%"], "a": "D"}, {"q": "A club has 24 members. 18 members attended a meeting. Which statement correctly represents the attendance?", "o": ["18:24 = 0.25 = 25%", "18:6 = 0.75 = 75%", "6:24 = 0.75 = 75%", "18:24 = 3/4 = 0.75 = 75%"], "a": "D"}];let i=0,score=0,answered=false;const num=document.getElementById('num'),total=document.getElementById('total'),scoreEl=document.getElementById('score'),bar=document.getElementById('bar'),q=document.getElementById('question'),opts=document.getElementById('options'),fb=document.getElementById('feedback'),next=document.getElementById('next');total.textContent=DATA.length;
function render(){answered=false;const x=DATA[i];num.textContent=i+1;scoreEl.textContent=score;bar.style.width=((i+1)/DATA.length*100)+'%';q.textContent=x.q;fb.textContent='';next.style.display='none';opts.innerHTML='';x.o.forEach((v,j)=>{const L=String.fromCharCode(65+j),b=document.createElement('button');b.className='choice';b.dataset.letter=L;b.textContent=L+'. '+v;b.onclick=()=>pick(b,x);opts.appendChild(b)})}
function pick(el,x){if(answered)return;answered=true;document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;if(b.dataset.letter===x.a)b.classList.add('correct')});if(el.dataset.letter===x.a){score++;scoreEl.textContent=score;fb.textContent='✓ Correct!'}else{el.classList.add('wrong');fb.textContent='Correct answer: '+x.a}next.textContent=i===DATA.length-1?'See Result':'Next Question';next.style.display='inline-block'}
next.onclick=()=>{if(i<DATA.length-1){i++;render()}else{q.innerHTML='<h2>Practice complete!</h2><p>Your score: <strong>'+score+'/'+DATA.length+'</strong></p>';opts.innerHTML='';fb.textContent='';next.style.display='none';bar.style.width='100%'}};render();
</script></body></html>
