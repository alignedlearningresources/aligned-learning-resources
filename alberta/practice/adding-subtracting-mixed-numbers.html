<body><a class="back" href="../index.html">← Back to Number</a><header><div class="brand">Canadian Math Practice</div><div class="meta">Alberta • Grade 6</div></header><div class="wrap"><div class="crumb">Grade 6 › Number › Adding & Subtracting Mixed Numbers</div><h1>Adding & Subtracting Mixed Numbers</h1><p class="lead">Add and subtract mixed numbers, including questions that require regrouping.</p><section class="card"><div class="top"><strong>Mixed Number Operations</strong><span>Question <b id="n">1</b>/10 • Score <b id="score">0</b></span></div><div class="progress"><div class="fill" id="fill"></div></div><div class="q" id="q"></div><div class="options" id="opts"></div><div class="feedback" id="fb"></div><div class="why" id="why"></div><button class="next" id="next" onclick="nextQ()" style="display:none">Next Question</button></section></div>
<script>
let i=0,score=0,answered=false;
const D=[
{q:"What is 2 1/5 + 3 2/5?",a:"5 3/5",o:["5 3/5","5 2/5","6 3/5","5 3/10"],w:"Add the whole numbers and the like fractions: 2+3=5 and 1/5+2/5=3/5."},
{q:"What is 6 3/8 − 2 1/8?",a:"4 1/4",o:["4 1/4","4 2/8","3 1/4","4 1/8"],w:"6−2=4 and 3/8−1/8=2/8=1/4."},
{q:"What is 1 1/2 + 2 1/4?",a:"3 3/4",o:["3 2/6","3 3/4","4 1/4","3 1/2"],w:"1/2=2/4. Then 2/4+1/4=3/4, and 1+2=3."},
{q:"What is 5 5/6 − 2 1/3?",a:"3 1/2",o:["3 1/2","3 2/3","2 1/2","3 4/6"],w:"1/3=2/6. Then 5/6−2/6=3/6=1/2, and 5−2=3."},
{q:"What is 3 3/4 + 2 2/3?",a:"6 5/12",o:["5 5/7","5 11/12","6 5/12","6 1/12"],w:"3/4=9/12 and 2/3=8/12. Their sum is 17/12=1 5/12, so the total is 6 5/12."},
{q:"What is 7 1/4 − 3 2/3?",a:"3 7/12",o:["3 5/12","3 7/12","4 7/12","4 5/12"],w:"Regroup 7 1/4 as 6 15/12. Since 3 2/3=3 8/12, the difference is 3 7/12."},
{q:"Which estimate is most reasonable for 4 7/8 + 3 1/6?",a:"About 8",o:["About 6","About 7","About 8","About 10"],w:"4 7/8 is close to 5 and 3 1/6 is close to 3, so the sum is about 8."},
{q:"A trail is 6 1/2 km long. Priya has walked 2 3/4 km. How much farther does she need to walk?",a:"3 3/4 km",o:["3 1/4 km","3 3/4 km","4 1/4 km","4 3/4 km"],w:"6 1/2=6 2/4. Regroup to 5 6/4, then subtract 2 3/4 to get 3 3/4 km."},
{q:"A recipe uses 1 2/3 cups of oats and 2 3/4 cups of flour. How many cups are used altogether?",a:"4 5/12 cups",o:["3 5/7 cups","4 1/12 cups","4 5/12 cups","4 7/12 cups"],w:"2/3=8/12 and 3/4=9/12. The fractional sum is 17/12=1 5/12, giving 4 5/12 cups altogether."},
{q:"Sam says 8 1/5 − 3 3/5 = 5 2/5. Which statement is correct?",a:"Sam is incorrect; the difference is 4 3/5.",o:["Sam is correct.","Sam is incorrect; the difference is 4 3/5.","Sam is incorrect; the difference is 5 3/5.","Sam is incorrect; the difference is 4 2/5."],w:"Regroup 8 1/5 as 7 6/5. Then 7 6/5−3 3/5=4 3/5."}
];
const n=document.getElementById("n"),sc=document.getElementById("score"),fill=document.getElementById("fill"),q=document.getElementById("q"),opts=document.getElementById("opts"),fb=document.getElementById("fb"),why=document.getElementById("why"),next=document.getElementById("next");
function render(){answered=false;let x=D[i];n.textContent=i+1;sc.textContent=score;fill.style.width=((i+1)*10)+"%";q.textContent=x.q;fb.textContent="";why.textContent="";next.style.display="none";opts.innerHTML=[...x.o].sort(()=>Math.random()-.5).map(v=>`<button class="opt" data-v="${v}" onclick="pick(this)">${v}</button>`).join("")}
function pick(el){if(answered)return;answered=true;document.querySelectorAll(".opt").forEach(b=>b.disabled=true);let x=D[i];if(el.dataset.v===x.a){score++;sc.textContent=score;fb.textContent="✓ Correct!"}else fb.textContent="✗ Not quite. Correct answer: "+x.a;why.textContent=x.w;next.textContent=i===9?"See Result":"Next Question";next.style.display="inline-block"}
function nextQ(){if(i<9){i++;render()}else{q.textContent="Practice complete!";opts.innerHTML="";fb.textContent=`Your score: ${score}/10`;why.textContent=score>=8?"Strong work with mixed-number operations.":"Try again and watch for questions where you need a common denominator or regroup one whole.";next.style.display="none"}}render();</script></body></html>
