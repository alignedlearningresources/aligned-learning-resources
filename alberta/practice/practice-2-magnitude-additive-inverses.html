<main class="quiz-shell"><div class="quiz-top"><a class="backlink" href="../index.html#number">← Back to Number</a><span class="eyebrow">NUMBER • PRACTICE 2</span></div><h1 style="font-size:40px;color:var(--navy);margin:18px 0 8px">Practice 2 — Magnitude &amp; Additive Inverses</h1><p style="color:var(--muted);font-size:17px;margin:0 0 24px">15-question Alberta Grade 6 Number practice with immediate feedback.</p><section class="quiz-card"><div class="quiz-meta"><strong>15 Questions</strong><span>Question <b id="num">1</b>/<b id="total"></b> · Score <b id="score">0</b></span></div><div class="progress"><div id="bar"></div></div><div class="question" id="question"></div><div class="options" id="options"></div><div class="feedback" id="feedback"></div><button class="next" id="next">Next Question</button></section></main>
<script>const DATA=[{"q": "What is the magnitude of −8?", "o": ["−8", "0", "8", "16"], "a": "C"}, {"q": "Which number has a magnitude of 12 and is to the left of 0 on a number line?", "o": ["−12", "0", "+6", "+12"], "a": "A"}, {"q": "Which pair has the same magnitude?", "o": ["−9 and +6", "−7 and +7", "0 and +5", "−4 and +8"], "a": "B"}, {"q": "What is the additive inverse of +15?", "o": ["−30", "−15", "0", "+15"], "a": "B"}, {"q": "What is the additive inverse of −23?", "o": ["−46", "−23", "0", "+23"], "a": "D"}, {"q": "Which statement about −14 and +14 is correct?", "o": ["They have different magnitudes and the same sign.", "They have the same magnitude and are additive inverses.", "They are both positive.", "Their sum is 28."], "a": "B"}, {"q": "Points P and Q are the same distance from 0 but on opposite sides of 0. If P = −11, what is Q?", "o": ["−22", "−11", "0", "+11"], "a": "D"}, {"q": "Which expression shows a number added to its additive inverse?", "o": ["9 + 9", "−9 + (−9)", "9 + (−9)", "−9 + 0"], "a": "C"}, {"q": "Which equation is true?", "o": ["−18 + 18 = 0", "−18 + 18 = −36", "−18 + 18 = 18", "−18 + 18 = 36"], "a": "A"}, {"q": "A submarine is 32 m below sea level and a drone is 32 m above sea level. Which statement is correct?", "o": ["Both positions are represented by +32.", "Both positions are represented by −32.", "The positions have equal magnitudes and opposite signs.", "The submarine has the greater magnitude."], "a": "C"}, {"q": "Complete the equation: −27 + □ = 0", "o": ["−54", "−27", "0", "+27"], "a": "D"}, {"q": "Four students describe −16. Who is incorrect?", "o": ["Ava: \"Its magnitude is −16.\"", "Ben: \"Its additive inverse is +16.\"", "Chloe: \"It is 16 units from 0.\"", "Dylan: \"−16 and +16 have the same magnitude.\""], "a": "A"}, {"q": "A point is 19 units from 0 on a number line. What must be true?", "o": ["It is +19.", "It is −19.", "It could be −19 or +19.", "It is 0."], "a": "C"}, {"q": "Consider the pairs: I. −6 and +6 II. −10 and −10 III. +21 and −21 IV. 0 and 0. Which pairs consist of a number and its additive inverse?", "o": ["I only", "I and III", "I, III, and IV", "All four"], "a": "C"}, {"q": "A student says −24 and +24 have the same magnitude. What else is true?", "o": ["They are equal.", "They are additive inverses.", "They are both negative.", "Their sum is 48."], "a": "B"}];let i=0,score=0,answered=false;const num=document.getElementById('num'),total=document.getElementById('total'),scoreEl=document.getElementById('score'),bar=document.getElementById('bar'),q=document.getElementById('question'),opts=document.getElementById('options'),fb=document.getElementById('feedback'),next=document.getElementById('next');total.textContent=DATA.length;function render(){answered=false;const x=DATA[i];num.textContent=i+1;scoreEl.textContent=score;bar.style.width=((i+1)/DATA.length*100)+'%';q.textContent=x.q;fb.textContent='';next.style.display='none';opts.innerHTML='';x.o.forEach((v,j)=>{const L=String.fromCharCode(65+j),b=document.createElement('button');b.className='choice';b.dataset.letter=L;b.textContent=L+'. '+v;b.onclick=()=>pick(b,x);opts.appendChild(b)})}function pick(el,x){if(answered)return;answered=true;document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;if(b.dataset.letter===x.a)b.classList.add('correct')});if(el.dataset.letter===x.a){score++;scoreEl.textContent=score;fb.textContent='✓ Correct!'}else{el.classList.add('wrong');fb.textContent='Correct answer: '+x.a}next.textContent=i===DATA.length-1?'See Result':'Next Question';next.style.display='inline-block'}next.onclick=()=>{if(i<DATA.length-1){i++;render()}else{q.innerHTML='<h2>Practice complete!</h2><p>Your score: <strong>'+score+'/'+DATA.length+'</strong></p>';opts.innerHTML='';fb.textContent='';next.style.display='none';bar.style.width='100%'}};render();</script></body></html>
