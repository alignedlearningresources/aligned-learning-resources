<section class="quiz-card"><div class="quiz-meta"><strong>15 Questions</strong><span>Question <b id="num">1</b>/<b id="total"></b> · Score <b id="score">0</b></span></div><div class="progress"><div id="bar"></div></div><div class="question" id="question"></div><div class="options" id="options"></div><div class="feedback" id="feedback"></div><button class="next" id="next">Next Question</button></section></main>
<script>
const DATA=[{"q": "Calculate 7/5 + 3/5 in simplest form.", "o": ["1 2/5", "2", "2 1/5", "1 4/5"], "a": "B"}, {"q": "Calculate 11/4 − 3/4 in simplest form.", "o": ["1", "1 1/2", "2 1/4", "2"], "a": "D"}, {"q": "Calculate 1 2/7 + 3/7.", "o": ["1 5/7", "1 3/7", "2 5/7", "1 6/7"], "a": "A"}, {"q": "Calculate 3 5/8 − 2/8.", "o": ["2 3/8", "3 7/8", "3 3/8", "1 3/8"], "a": "C"}, {"q": "Calculate 2 1/4 + 1 2/4 in simplest form.", "o": ["3 1/2", "3 3/4", "4 1/4", "4 3/4"], "a": "B"}, {"q": "Calculate 4 5/6 − 2 1/6 in simplest form.", "o": ["2 1/3", "3 2/3", "2 1/2", "2 2/3"], "a": "D"}, {"q": "Calculate 1 3/4 + 2 2/3 in simplest form.", "o": ["4 5/12", "3 5/7", "4 1/12", "3 5/12"], "a": "A"}, {"q": "Calculate 5 1/3 − 2 3/4 in simplest form.", "o": ["2 5/12", "3 5/12", "2 7/12", "3 7/12"], "a": "C"}, {"q": "Calculate 7/6 + 5/4 as a mixed number in simplest form.", "o": ["2 1/12", "2 5/12", "2 7/12", "1 11/12"], "a": "B"}, {"q": "A student calculates 2 1/3 + 1 1/4 and writes 3 2/7. What error did the student make?", "o": ["Should subtract fractional parts.", "Mixed numbers cannot be added directly.", "Whole numbers should be decimals.", "Added numerators and denominators instead of finding a common denominator."], "a": "D"}, {"q": "For 6 1/5 − 3 4/5, which method correctly begins the subtraction?", "o": ["Rewrite 6 1/5 as 5 6/5, then subtract.", "Rewrite 3 4/5 as 2 9/5.", "Subtract 4−1 and 6−3.", "Change both denominators to 10."], "a": "A"}, {"q": "A board is 4 1/2 m long. A 1 3/4 m piece is cut off. How much remains?", "o": ["2 1/4", "3 1/4", "2 3/4", "3 3/4"], "a": "C"}, {"q": "A baker uses 1 5/6 kg flour in the morning and 2 3/4 kg in the afternoon. How much altogether?", "o": ["3 7/12", "4 7/12", "4 1/12", "4 2/3"], "a": "B"}, {"q": "Maya says 4 1/6 − 2 3/4 has no answer because she cannot subtract 3/4 from 1/6. What should she do?", "o": ["Change subtraction to addition.", "Ignore fractional parts.", "Subtract the smaller mixed number from the larger fractional part only.", "Find a common denominator and regroup one whole from 4 before subtracting."], "a": "D"}, {"q": "A tank contains 6 1/2 L. First 2 3/4 L is removed, then 1 2/3 L is added. How much is in the tank now?", "o": ["5 5/12", "4 5/12", "5 1/12", "6 1/12"], "a": "A"}];let i=0,score=0,answered=false;const num=document.getElementById('num'),total=document.getElementById('total'),scoreEl=document.getElementById('score'),bar=document.getElementById('bar'),q=document.getElementById('question'),opts=document.getElementById('options'),fb=document.getElementById('feedback'),next=document.getElementById('next');total.textContent=DATA.length;
function render(){answered=false;const x=DATA[i];num.textContent=i+1;scoreEl.textContent=score;bar.style.width=((i+1)/DATA.length*100)+'%';q.textContent=x.q;fb.textContent='';next.style.display='none';opts.innerHTML='';x.o.forEach((v,j)=>{const L=String.fromCharCode(65+j),b=document.createElement('button');b.className='choice';b.dataset.letter=L;b.textContent=L+'. '+v;b.onclick=()=>pick(b,x);opts.appendChild(b)})}
function pick(el,x){if(answered)return;answered=true;document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;if(b.dataset.letter===x.a)b.classList.add('correct')});if(el.dataset.letter===x.a){score++;scoreEl.textContent=score;fb.textContent='✓ Correct!'}else{el.classList.add('wrong');fb.textContent='Correct answer: '+x.a}next.textContent=i===DATA.length-1?'See Result':'Next Question';next.style.display='inline-block'}
next.onclick=()=>{if(i<DATA.length-1){i++;render()}else{q.innerHTML='<h2>Practice complete!</h2><p>Your score: <strong>'+score+'/'+DATA.length+'</strong></p>';opts.innerHTML='';fb.textContent='';next.style.display='none';bar.style.width='100%'}};render();
</script></body></html>
