<section class="quiz-card"><div class="quiz-meta"><strong>15 Questions</strong><span>Question <b id="num">1</b>/<b id="total"></b> · Score <b id="score">0</b></span></div><div class="progress"><div id="bar"></div></div><div class="question" id="question"></div><div class="options" id="options"></div><div class="feedback" id="feedback"></div><button class="next" id="next">Next Question</button></section></main>
<script>
const DATA=[{"q": "Liam walked 2/5 km in the morning and 1/5 km in the afternoon. How far did he walk altogether?", "o": ["1/5 km", "2/5 km", "3/5 km", "3/10 km"], "a": "C"}, {"q": "A container held 7/8 L of juice. Maya used 3/8 L. How much remains?", "o": ["1/2 L", "3/8 L", "5/8 L", "1/4 L"], "a": "A"}, {"q": "Noah read 1/3 of a book on Monday and 1/6 on Tuesday. How much did he read in total?", "o": ["2/9", "2/6", "5/6", "1/2"], "a": "D"}, {"q": "A ribbon was 5/6 m long. 1/4 m was cut off. How much remains?", "o": ["2/3 m", "7/12 m", "4/10 m", "3/8 m"], "a": "B"}, {"q": "A recipe uses 3/4 cup oats and 2/3 cup flour. How much is that altogether?", "o": ["1 1/12 cups", "1 7/12 cups", "1 5/12 cups", "1 2/3 cups"], "a": "C"}, {"q": "A tank held 3 1/2 L. 1 3/4 L was used. How much remains?", "o": ["1 1/4 L", "2 1/4 L", "2 3/4 L", "1 3/4 L"], "a": "D"}, {"q": "Sofia walked 1 2/3 km and then 2 3/4 km. How far did she walk altogether?", "o": ["4 5/12 km", "3 5/12 km", "4 1/12 km", "4 7/12 km"], "a": "A"}, {"q": "A roll of ribbon was 6 1/4 m long. 2 5/6 m was used. How much is left?", "o": ["3 1/12 m", "4 5/12 m", "3 5/12 m", "3 7/12 m"], "a": "C"}, {"q": "Ava walked 2 5/6 km and Ben walked 1 3/4 km. Which expression finds how much farther Ava walked?", "o": ["2 5/6 + 1 3/4", "2 5/6 − 1 3/4", "2 5/6 × 1 3/4", "1 3/4 − 2 5/6"], "a": "B"}, {"q": "A bucket held 4 2/3 L. 1 3/4 L was poured out. Ethan estimates that about 3 L remains. Which reasoning supports his estimate?", "o": ["4 2/3 ≈ 5 and 1 3/4 ≈ 2, so 5 − 2 ≈ 3", "4 2/3 ≈ 4 and 1 3/4 ≈ 3, so 4 − 3 ≈ 3", "4 2/3 ≈ 6 and 1 3/4 ≈ 2, so 6 − 2 ≈ 3", "4 2/3 ≈ 5 and 1 3/4 ≈ 1, so 5 − 1 ≈ 3"], "a": "A"}, {"q": "A trail is 5 1/2 km long. Priya walked 2 2/3 km and says 2 5/6 km is left. Is she correct?", "o": ["No, 2 1/6 km is left.", "No, 3 1/6 km is left.", "Yes, because the fractions can be added.", "Yes, because 5 1/2 − 2 2/3 = 2 5/6."], "a": "D"}, {"q": "A jug held 5 1/4 L. 1 2/3 L was poured out, then 3/4 L was added. How much is in the jug now?", "o": ["3 1/3 L", "4 1/3 L", "4 1/12 L", "4 7/12 L"], "a": "B"}, {"q": "A board was 7 1/2 m long. 2 3/4 m and 1 5/6 m were used. How much remains?", "o": ["2 11/12 m", "2 7/12 m", "3 1/12 m", "3 5/12 m"], "a": "A"}, {"q": "A 6 L container is used for two amounts: 2 3/4 L and 1 2/3 L. Ava says 1 7/12 L remains, Ben says 2 5/12 L, and Kai says 3 1/12 L. Who is correct?", "o": ["Ben", "Kai", "Ava", "None"], "a": "C"}, {"q": "A cyclist plans to travel 10 km. The cyclist travels 3 3/4 km and then 2 5/6 km. How much farther must the cyclist travel?", "o": ["3 1/12 km", "3 5/12 km", "4 1/12 km", "4 7/12 km"], "a": "B"}];let i=0,score=0,answered=false;const num=document.getElementById('num'),total=document.getElementById('total'),scoreEl=document.getElementById('score'),bar=document.getElementById('bar'),q=document.getElementById('question'),opts=document.getElementById('options'),fb=document.getElementById('feedback'),next=document.getElementById('next');total.textContent=DATA.length;
function render(){answered=false;const x=DATA[i];num.textContent=i+1;scoreEl.textContent=score;bar.style.width=((i+1)/DATA.length*100)+'%';q.textContent=x.q;fb.textContent='';next.style.display='none';opts.innerHTML='';x.o.forEach((v,j)=>{const L=String.fromCharCode(65+j),b=document.createElement('button');b.className='choice';b.dataset.letter=L;b.textContent=L+'. '+v;b.onclick=()=>pick(b,x);opts.appendChild(b)})}
function pick(el,x){if(answered)return;answered=true;document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;if(b.dataset.letter===x.a)b.classList.add('correct')});if(el.dataset.letter===x.a){score++;scoreEl.textContent=score;fb.textContent='✓ Correct!'}else{el.classList.add('wrong');fb.textContent='Correct answer: '+x.a}next.textContent=i===DATA.length-1?'See Result':'Next Question';next.style.display='inline-block'}
next.onclick=()=>{if(i<DATA.length-1){i++;render()}else{q.innerHTML='<h2>Practice complete!</h2><p>Your score: <strong>'+score+'/'+DATA.length+'</strong></p>';opts.innerHTML='';fb.textContent='';next.style.display='none';bar.style.width='100%'}};render();
</script></body></html>
