<body><a class="back" href="../index.html">← Back to Number</a><header><div class="brand">Canadian Math Practice</div><div class="meta">Alberta • Grade 6</div></header><div class="wrap"><div class="crumb">Grade 6 › Number › Decimal Multiplication</div><h1>Decimal Multiplication</h1><p class="lead">Multiply decimals and assess whether products are reasonable.</p><section class="card"><div class="top"><strong>Decimal Multiplication Practice</strong><span>Question <b id="n">1</b>/10 • Score <b id="score">0</b></span></div><div class="progress"><div class="fill" id="fill"></div></div><div class="q" id="q"></div><div class="options" id="opts"></div><div class="feedback" id="fb"></div><div class="why" id="why"></div><button class="next" id="next" onclick="nextQ()" style="display:none">Next Question</button></section></div>
<script>
let i=0,score=0,answered=false;
const D=[{"q":"What is 24 × 0.3?","a":"7.2","o":["0.72","7.2","72","80"],"w":"24 × 3 tenths = 72 tenths = 7.2."},{"q":"What is 135 × 0.4?","a":"54","o":["5.4","40.5","54","540"],"w":"135 × 4 tenths = 54."},{"q":"What is 208 × 0.6?","a":"124.8","o":["12.48","124.8","128.6","1,248"],"w":"208 × 0.6 = 124.8."},{"q":"What is 3.5 × 8?","a":"28","o":["2.8","28","35","280"],"w":"35 tenths × 8 = 280 tenths = 28."},{"q":"What is 0.75 × 12?","a":"9","o":["0.9","6","9","90"],"w":"75 hundredths × 12 = 900 hundredths = 9."},{"q":"A ribbon costs $0.80 per metre. What is the cost of 125 m?","a":"$100","o":["$10","$80","$100","$1,000"],"w":"125 × 0.8 = 100."},{"q":"Which estimate best checks 49 × 0.21?","a":"About 10","o":["About 1","About 5","About 10","About 100"],"w":"50 × 0.2 ≈ 10."},{"q":"What is 6.25 × 4?","a":"25","o":["2.5","10.25","25","250"],"w":"6.25 × 4 = 25."},{"q":"A 0.45 kg package is copied 20 times. What is the total mass?","a":"9 kg","o":["0.9 kg","4.5 kg","9 kg","90 kg"],"w":"0.45 × 20 = 9."},{"q":"Why is 32 × 0.5 less than 32?","a":"Multiplying by one-half finds half of 32.","o":["Decimals always make answers smaller.","Multiplying by one-half finds half of 32.","32 is an odd number.","0.5 means add 5."],"w":"32 × 0.5 = 16."}];
const n=document.getElementById("n"),sc=document.getElementById("score"),fill=document.getElementById("fill"),q=document.getElementById("q"),opts=document.getElementById("opts"),fb=document.getElementById("fb"),why=document.getElementById("why"),next=document.getElementById("next");
function render(){answered=false;let x=D[i];n.textContent=i+1;sc.textContent=score;fill.style.width=(((i+1)/10)*100)+"%";q.textContent=x.q;fb.textContent="";why.textContent="";next.style.display="none";opts.innerHTML=[...x.o].sort(()=>Math.random()-.5).map(v=>`<button class="opt" data-v="${v}" onclick="pick(this)">${v}</button>`).join("")}
function pick(el){if(answered)return;answered=true;document.querySelectorAll(".opt").forEach(b=>b.disabled=true);let x=D[i];if(el.dataset.v===x.a){score++;sc.textContent=score;fb.textContent="✓ Correct!"}else fb.textContent="✗ Not quite. Correct answer: "+x.a;why.textContent=x.w;next.textContent=i===9?"See Result":"Next Question";next.style.display="inline-block"}
function nextQ(){if(i<9){i++;render()}else{q.textContent="Practice complete!";opts.innerHTML="";fb.textContent=`Your score: ${score}/10`;why.textContent=score>=8?"Strong work.":"Review the explanations and try this skill again.";next.style.display="none"}}render();</script></body></html>
