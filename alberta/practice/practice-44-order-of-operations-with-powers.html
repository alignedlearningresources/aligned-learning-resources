<main class="quiz-shell"><div class="quiz-top"><a class="backlink" href="../index.html">← Back to Alberta</a><span class="eyebrow">ALGEBRA • PRACTICE 44</span></div><h1 style="font-size:40px;color:var(--navy);margin:18px 0 8px">Practice 44 — Order of Operations with Powers</h1><p style="color:var(--muted);font-size:17px;margin:0 0 24px">15-question Alberta Grade 6 practice with immediate feedback.</p><section class="quiz-card"><div class="quiz-meta"><strong>15 Questions</strong><span>Question <b id="num">1</b>/<b id="total"></b> · Score <b id="score">0</b></span></div><div class="progress"><div id="bar"></div></div><div class="question" id="question"></div><div class="options" id="options"></div><div class="feedback" id="feedback"></div><button class="next" id="next">Next Question</button></section></main>
<script>
const DATA=[{"q": "3²", "o": ["6", "9", "8", "12"], "a": "B"}, {"q": "2³+5", "o": ["10", "11", "13", "15"], "a": "C"}, {"q": "First in 6+2³×4?", "o": ["6+2", "2³", "3×4", "6+8"], "a": "B"}, {"q": "20−3²", "o": ["11", "17", "23", "289"], "a": "A"}, {"q": "5×2²+3", "o": ["13", "20", "23", "43"], "a": "C"}, {"q": "(9−5)²", "o": ["8", "16", "36", "76"], "a": "B"}, {"q": "36÷2²+5", "o": ["9", "11", "14", "23"], "a": "C"}, {"q": "Value 27?", "o": ["3²+3", "2³×3", "4²+9", "3²×3"], "a": "D"}, {"q": "Correct sequence for 4×(7−3)²?", "o": ["subtract,power,multiply", "power,subtract,multiply", "multiply,subtract,power", "subtract,multiply,power"], "a": "A"}, {"q": "50−2×4²", "o": ["32", "34", "192", "18"], "a": "D"}, {"q": "A=(5+1)², B=5+1².", "o": ["A 30 greater", "B 30 greater", "both36", "A 6 greater"], "a": "A"}, {"q": "Noah does 3×(10−6)² as 3×4=12 then 12². Error?", "o": ["add10+6", "evaluate power before ×3", "divide3", "square3"], "a": "B"}, {"q": "Greatest?", "o": ["2³+12", "3²+10", "5×2²", "(7−2)²"], "a": "D"}, {"q": "Student says 2×(8−5)²=36. Error?", "o": ["add8+5", "square2", "divide3² by2", "multiplied2 by3 before power"], "a": "D"}, {"q": "Same value as 3×(6−2)²+4?", "o": ["40", "48", "52", "64"], "a": "C"}];let i=0,score=0,answered=false;const num=document.getElementById('num'),total=document.getElementById('total'),scoreEl=document.getElementById('score'),bar=document.getElementById('bar'),q=document.getElementById('question'),opts=document.getElementById('options'),fb=document.getElementById('feedback'),next=document.getElementById('next');total.textContent=DATA.length;
function render(){answered=false;const x=DATA[i];num.textContent=i+1;scoreEl.textContent=score;bar.style.width=((i+1)/DATA.length*100)+'%';q.textContent=x.q;fb.textContent='';next.style.display='none';opts.innerHTML='';x.o.forEach((v,j)=>{const L=String.fromCharCode(65+j),b=document.createElement('button');b.className='choice';b.dataset.letter=L;b.textContent=L+'. '+v;b.onclick=()=>pick(b,x);opts.appendChild(b)})}
function pick(el,x){if(answered)return;answered=true;document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;if(b.dataset.letter===x.a)b.classList.add('correct')});if(el.dataset.letter===x.a){score++;scoreEl.textContent=score;fb.textContent='✓ Correct!'}else{el.classList.add('wrong');fb.textContent='Correct answer: '+x.a}next.textContent=i===DATA.length-1?'See Result':'Next Question';next.style.display='inline-block'}
next.onclick=()=>{if(i<DATA.length-1){i++;render()}else{q.innerHTML='<h2>Practice complete!</h2><p>Your score: <strong>'+score+'/'+DATA.length+'</strong></p>';opts.innerHTML='';fb.textContent='';next.style.display='none';bar.style.width='100%'}};render();
</script></body></html>
