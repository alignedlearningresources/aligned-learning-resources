<main class="quiz-shell"><div class="quiz-top"><a class="backlink" href="../index.html#number">← Back to Number</a><span class="eyebrow">NUMBER • PRACTICE 1</span></div><h1 style="font-size:40px;color:var(--navy);margin:18px 0 8px">Practice 1 — Positive &amp; Negative Numbers in Context</h1><p style="color:var(--muted);font-size:17px;margin:0 0 24px">15-question Alberta Grade 6 Number practice with immediate feedback.</p><section class="quiz-card"><div class="quiz-meta"><strong>15 Questions</strong><span>Question <b id="num">1</b>/<b id="total"></b> · Score <b id="score">0</b></span></div><div class="progress"><div id="bar"></div></div><div class="question" id="question"></div><div class="options" id="options"></div><div class="feedback" id="feedback"></div><button class="next" id="next">Next Question</button></section></main>
<script>const DATA=[{"q": "At 7 a.m., the temperature is 6°C below zero. Which integer represents the temperature?", "o": ["−6", "0", "+6", "+60"], "a": "A"}, {"q": "Which situation is best represented by +18?", "o": ["A debt of $18", "18 m below sea level", "A temperature 18°C above zero", "A loss of 18 points"], "a": "C"}, {"q": "A diver is 24 m below sea level. Which integer represents the diver's elevation?", "o": ["+24", "−24", "0", "−42"], "a": "B"}, {"q": "Which statement about 0 is correct?", "o": ["It is positive.", "It is negative.", "It is both positive and negative.", "It is neither positive nor negative."], "a": "D"}, {"q": "Maya's bank account is $35 overdrawn. Which integer represents her balance relative to $0?", "o": ["−35", "−5", "+35", "+350"], "a": "A"}, {"q": "The elevations of four points are P: +85 m, Q: −12 m, R: 0 m, S: +27 m. Which point is below sea level?", "o": ["P", "Q", "R", "S"], "a": "B"}, {"q": "Point K is 9 units to the left of 0 on a number line. Which number is at K?", "o": ["−9", "−1", "+9", "+90"], "a": "A"}, {"q": "On a vertical number line, where is −7 located?", "o": ["7 units above 0", "7 units below 0", "At 0", "7 units to the right of 0"], "a": "B"}, {"q": "Which pair of situations could be represented by +40 and −40, respectively?", "o": ["40 m above sea level and 40 m below sea level", "Owing $40 and earning $40", "40 m below sea level and 40 m above sea level", "−40°C and 0°C"], "a": "A"}, {"q": "The ground floor of a building is 0. Underground floors are represented by negative integers. Which integer represents a parking level 3 floors below ground?", "o": ["−3", "0", "+3", "+30"], "a": "A"}, {"q": "Which situation would NOT normally be represented by a negative number?", "o": ["A debt of $75", "An elevation 16 m below sea level", "A temperature 9°C below zero", "A deposit of $50"], "a": "D"}, {"q": "Four temperatures are A: −11°C, B: +3°C, C: 0°C, D: −5°C. Which statement is true?", "o": ["A and B are negative.", "C is positive.", "A and D are negative.", "D is positive."], "a": "C"}, {"q": "A weather report says the temperature is 4 degrees below zero. A student writes +4°C. What is the error?", "o": ["It should be −4°C because below zero is negative.", "It should be 0°C.", "It should be −8°C.", "There is no error."], "a": "A"}, {"q": "Point P is below 0 on a number line. Point Q is the same distance above 0. If P = −13, what is Q?", "o": ["−26", "−13", "0", "+13"], "a": "D"}, {"q": "Consider these statements about −28: I. A debt of $28 II. An elevation 28 m below sea level III. A temperature 28°C above zero Which correctly use −28?", "o": ["I only", "II only", "I and II only", "All three"], "a": "C"}];let i=0,score=0,answered=false;const num=document.getElementById('num'),total=document.getElementById('total'),scoreEl=document.getElementById('score'),bar=document.getElementById('bar'),q=document.getElementById('question'),opts=document.getElementById('options'),fb=document.getElementById('feedback'),next=document.getElementById('next');total.textContent=DATA.length;function render(){answered=false;const x=DATA[i];num.textContent=i+1;scoreEl.textContent=score;bar.style.width=((i+1)/DATA.length*100)+'%';q.textContent=x.q;fb.textContent='';next.style.display='none';opts.innerHTML='';x.o.forEach((v,j)=>{const L=String.fromCharCode(65+j),b=document.createElement('button');b.className='choice';b.dataset.letter=L;b.textContent=L+'. '+v;b.onclick=()=>pick(b,x);opts.appendChild(b)})}function pick(el,x){if(answered)return;answered=true;document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;if(b.dataset.letter===x.a)b.classList.add('correct')});if(el.dataset.letter===x.a){score++;scoreEl.textContent=score;fb.textContent='✓ Correct!'}else{el.classList.add('wrong');fb.textContent='Correct answer: '+x.a}next.textContent=i===DATA.length-1?'See Result':'Next Question';next.style.display='inline-block'}next.onclick=()=>{if(i<DATA.length-1){i++;render()}else{q.innerHTML='<h2>Practice complete!</h2><p>Your score: <strong>'+score+'/'+DATA.length+'</strong></p>';opts.innerHTML='';fb.textContent='';next.style.display='none';bar.style.width='100%'}};render();</script></body></html>
