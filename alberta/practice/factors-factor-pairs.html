<title>Factors & Factor Pairs | Alberta Grade 6 Math</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fa;color:#172033}.back{display:inline-block;margin:16px 5% 0;text-decoration:none;font-weight:700;color:#172033}header{padding:18px 5%;background:#fff;border-bottom:1px solid #e2e7ee;display:flex;justify-content:space-between}.brand{font-weight:800;font-size:22px}.meta{color:#667085}.wrap{max-width:1000px;margin:auto;padding:42px 5% 70px}.crumb{color:#667085;font-size:14px}h1{font-size:42px;margin:12px 0 8px}.lead{font-size:18px;color:#667085}.card{background:#fff;border:1px solid #e1e6ed;border-radius:16px;padding:28px;margin-top:28px}.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:#667085}.progress{height:8px;background:#e8ecf2;border-radius:99px;margin:15px 0 30px;overflow:hidden}.fill{height:100%;background:#172033}.q{font-size:28px;font-weight:800;line-height:1.4;margin:18px 0 22px}.options{display:grid;gap:10px;max-width:800px}.opt{background:#fff;border:1px solid #cfd6df;border-radius:10px;padding:14px;text-align:left;font-size:16px;font-weight:700;cursor:pointer;color:#172033}.feedback{font-weight:800;margin-top:18px}.why{color:#667085;line-height:1.5;margin-top:7px}.next{margin-top:18px;background:#172033;color:#fff;border:0;border-radius:9px;padding:11px 15px;font-weight:800;cursor:pointer}@media(max-width:600px){h1{font-size:34px}.q{font-size:23px}header{flex-direction:column;gap:5px}}</style></head>
<body><a class="back" href="../index.html">← Back to Number</a><header><div class="brand">Canadian Math Practice</div><div class="meta">Alberta • Grade 6</div></header><div class="wrap"><div class="crumb">Grade 6 › Number › Factors & Factor Pairs</div><h1>Factors & Factor Pairs</h1><p class="lead">Identify factors, complete factor pairs, and reason about factor relationships.</p><section class="card"><div class="top"><strong>Factors Practice</strong><span>Question <b id="n">1</b>/10 • Score <b id="score">0</b></span></div><div class="progress"><div class="fill" id="fill"></div></div><div class="q" id="q"></div><div class="options" id="opts"></div><div class="feedback" id="fb"></div><div class="why" id="why"></div><button class="next" id="next" onclick="nextQ()" style="display:none">Next Question</button></section></div>
<script>
let i=0,score=0,answered=false;
const D=[
{q:"Which number is a factor of 12?",a:"3",o:["3","5","7","8"],w:"12 ÷ 3 = 4 with no remainder, so 3 is a factor of 12."},
{q:"Complete the factor pair for 18: 3 × ___ = 18",a:"6",o:["3","5","6","9"],w:"3 × 6 = 18, so 3 and 6 are a factor pair."},
{q:"Which pair is a factor pair of 24?",a:"4 and 6",o:["4 and 6","3 and 7","5 and 6","2 and 10"],w:"4 × 6 = 24."},
{q:"Which list contains all the factors of 20?",a:"1, 2, 4, 5, 10, 20",o:["1, 2, 4, 5, 10, 20","1, 2, 5, 10, 20","1, 2, 4, 8, 10, 20","2, 4, 5, 10"],w:"The factor pairs of 20 are 1×20, 2×10, and 4×5."},
{q:"Which number is NOT a factor of 36?",a:"8",o:["4","6","8","9"],w:"36 is divisible by 4, 6, and 9, but 36 ÷ 8 is not a whole number."},
{q:"How many factors does 28 have?",a:"6",o:["4","5","6","8"],w:"The factors are 1, 2, 4, 7, 14, and 28. There are 6."},
{q:"Which number has exactly three factors?",a:"49",o:["24","30","36","49"],w:"49 has exactly 1, 7, and 49 as factors."},
{q:"A teacher has 48 counters and wants equal rows with no counters left over. Which number of rows is NOT possible?",a:"5",o:["3","4","5","6"],w:"48 is divisible by 3, 4, and 6, but not by 5."},
{q:"A number has factor pairs 1×42, 2×21, 3×14, and 6×7. Which statement is true?",a:"The number has 8 factors.",o:["The number has 4 factors.","The number has 6 factors.","The number has 8 factors.","The number has 10 factors."],w:"The pairs give eight distinct factors: 1, 2, 3, 6, 7, 14, 21, and 42."},
{q:"Which statement must be true if 6 is a factor of a whole number n?",a:"n is divisible by both 2 and 3.",o:["n is divisible by both 2 and 3.","n must be a multiple of 12.","n must be odd.","n has exactly six factors."],w:"If 6 divides n evenly, then 2 and 3 also divide n evenly."}
];
const n=document.getElementById("n"),sc=document.getElementById("score"),fill=document.getElementById("fill"),q=document.getElementById("q"),opts=document.getElementById("opts"),fb=document.getElementById("fb"),why=document.getElementById("why"),next=document.getElementById("next");
function render(){answered=false;let x=D[i];n.textContent=i+1;sc.textContent=score;fill.style.width=((i+1)*10)+"%";q.textContent=x.q;fb.textContent="";why.textContent="";next.style.display="none";opts.innerHTML=[...x.o].sort(()=>Math.random()-.5).map(v=>`<button class="opt" data-v="${v}" onclick="pick(this)">${v}</button>`).join("")}
function pick(el){if(answered)return;answered=true;document.querySelectorAll(".opt").forEach(b=>b.disabled=true);let x=D[i];if(el.dataset.v===x.a){score++;sc.textContent=score;fb.textContent="✓ Correct!"}else fb.textContent="✗ Not quite. Correct answer: "+x.a;why.textContent=x.w;next.textContent=i===9?"See Result":"Next Question";next.style.display="inline-block"}
function nextQ(){if(i<9){i++;render()}else{q.textContent="Practice complete!";opts.innerHTML="";fb.textContent=`Your score: ${score}/10`;why.textContent=score>=8?"Strong factor reasoning.":"Try again and use multiplication pairs or exact division to test factors.";next.style.display="none"}}render();</script></body></html>
