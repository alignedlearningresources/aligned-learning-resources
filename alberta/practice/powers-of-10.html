<body><a class="back" href="../index.html">← Back to Number</a><header><div class="brand">Canadian Math Practice</div><div class="meta">Alberta • Grade 6</div></header><div class="wrap"><div class="crumb">Grade 6 › Number › Powers &amp; Exponents</div><h1>Powers &amp; Exponents</h1><p class="lead">Interpret and evaluate powers and use powers in numerical expressions.</p><section class="card"><div class="top"><strong>Powers & Exponents Practice</strong><span>Question <b id="n">1</b>/10 • Score <b id="score">0</b></span></div><div class="progress"><div class="fill" id="fill"></div></div><div class="q" id="q"></div><div class="options" id="opts"></div><div class="feedback" id="fb"></div><div class="why" id="why"></div><button class="next" id="next" onclick="nextQ()" style="display:none">Next Question</button></section></div>
<script>
let i=0,score=0,answered=false;
const D=[{"q":"What does 4³ mean?","a":"4 × 4 × 4","o":["4 + 4 + 4","3 × 4","4 × 4 × 4","4 × 3 × 3"],"w":"The exponent 3 means use 4 as a factor three times."},{"q":"What is 2⁵?","a":"32","o":["10","16","25","32"],"w":"2 × 2 × 2 × 2 × 2 = 32."},{"q":"In 7², what is the base?","a":"7","o":["2","7","14","49"],"w":"The base is the repeated factor: 7."},{"q":"In 5⁴, what does the exponent tell you?","a":"Use 5 as a factor 4 times.","o":["Add 5 four times.","Multiply 5 by 4.","Use 5 as a factor 4 times.","Use 4 as a factor 5 times."],"w":"An exponent tells how many times the base is used as a factor."},{"q":"Which has the greatest value?","a":"3⁴","o":["2⁵","3³","3⁴","5²"],"w":"Values are 32, 27, 81, and 25."},{"q":"What is 10⁴?","a":"10,000","o":["40","1,000","10,000","100,000"],"w":"10⁴ = 10 × 10 × 10 × 10 = 10,000."},{"q":"Evaluate 3² + 4 × 2.","a":"17","o":["14","17","20","26"],"w":"Evaluate the power first: 9 + 8 = 17."},{"q":"Evaluate 2 × 5² − 6.","a":"44","o":["19","38","44","94"],"w":"5² = 25; then 2 × 25 − 6 = 44."},{"q":"Which expression equals 64?","a":"2⁶","o":["2⁵","2⁶","4²","8¹"],"w":"2⁶ = 64."},{"q":"A student writes 6³ = 18. Which correction is correct?","a":"6³ = 216 because 6 × 6 × 6 = 216.","o":["6³ = 36 because 6 × 6 = 36.","6³ = 216 because 6 × 6 × 6 = 216.","6³ = 9 because 6 + 3 = 9.","6³ = 63 because the digits join together."],"w":"An exponent represents repeated multiplication, not multiplication by the exponent."}];
const n=document.getElementById("n"),sc=document.getElementById("score"),fill=document.getElementById("fill"),q=document.getElementById("q"),opts=document.getElementById("opts"),fb=document.getElementById("fb"),why=document.getElementById("why"),next=document.getElementById("next");
function render(){answered=false;let x=D[i];n.textContent=i+1;sc.textContent=score;fill.style.width=((i+1)*10)+"%";q.textContent=x.q;fb.textContent="";why.textContent="";next.style.display="none";opts.innerHTML=[...x.o].sort(()=>Math.random()-.5).map(v=>`<button class="opt" data-v="${v}" onclick="pick(this)">${v}</button>`).join("")}
function pick(el){if(answered)return;answered=true;document.querySelectorAll(".opt").forEach(b=>b.disabled=true);let x=D[i];if(el.dataset.v===x.a){score++;sc.textContent=score;fb.textContent="✓ Correct!"}else fb.textContent="✗ Not quite. Correct answer: "+x.a;why.textContent=x.w;next.textContent=i===9?"See Result":"Next Question";next.style.display="inline-block"}
function nextQ(){if(i<9){i++;render()}else{q.textContent="Practice complete!";opts.innerHTML="";fb.textContent=`Your score: ${score}/10`;why.textContent=score>=8?"Strong work with powers and exponents.":"Review the explanations and try the set again.";next.style.display="none"}}render();</script></body></html>
