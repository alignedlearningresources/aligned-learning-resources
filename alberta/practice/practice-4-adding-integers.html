<main class="quiz-shell"><div class="quiz-top"><a class="backlink" href="../index.html#number">← Back to Number</a><span class="eyebrow">NUMBER • PRACTICE 4</span></div><h1 style="font-size:40px;color:var(--navy);margin:18px 0 8px">Practice 4 — Adding Integers</h1><p style="color:var(--muted);font-size:17px;margin:0 0 24px">15-question Alberta Grade 6 Number practice with immediate feedback.</p><section class="quiz-card"><div class="quiz-meta"><strong>15 Questions</strong><span>Question <b id="num">1</b>/<b id="total"></b> · Score <b id="score">0</b></span></div><div class="progress"><div id="bar"></div></div><div class="question" id="question"></div><div class="options" id="options"></div><div class="feedback" id="feedback"></div><button class="next" id="next">Next Question</button></section></main>
<script>const DATA=[{"q": "6 + 9 = ?", "o": ["3", "15", "−15", "−3"], "a": "B"}, {"q": "−7 + (−5) = ?", "o": ["−12", "−2", "2", "12"], "a": "A"}, {"q": "8 + (−3) = ?", "o": ["−11", "−5", "5", "11"], "a": "C"}, {"q": "−11 + 6 = ?", "o": ["−17", "−5", "5", "17"], "a": "B"}, {"q": "Which equation has a sum of 0?", "o": ["9 + 9", "−9 + (−9)", "9 + (−9)", "−9 + 0"], "a": "C"}, {"q": "Complete: −14 + □ = −20", "o": ["−6", "6", "−34", "34"], "a": "A"}, {"q": "Which statement is true?", "o": ["−8 + (−4) = −4", "−8 + 4 = −12", "8 + (−4) = 4", "8 + 4 = −12"], "a": "C"}, {"q": "A student says −13 + 8 = 5. What is the error?", "o": ["The answer should be −21.", "The answer should be −5 because 13 has the greater magnitude and is negative.", "The answer should be 21.", "There is no error."], "a": "B"}, {"q": "−16 + 7 + 4 = ?", "o": ["−27", "−13", "−5", "5"], "a": "C"}, {"q": "Which expression has the greatest value?", "o": ["−8 + 3", "6 + (−4)", "−2 + (−5)", "−9 + 6"], "a": "B"}, {"q": "The temperature is −6°C and rises 9°C. What is the new temperature?", "o": ["−15°C", "−3°C", "3°C", "15°C"], "a": "C"}, {"q": "A diver is at −12 m and moves 7 m upward. Which equation represents the new position?", "o": ["−12 + (−7) = −19", "−12 + 7 = −5", "12 + (−7) = 5", "12 + 7 = 19"], "a": "B"}, {"q": "A player's score changes by −8, +12, and −3 points. What is the total change?", "o": ["−23", "−1", "+1", "+7"], "a": "C"}, {"q": "Complete: −18 + N = −7", "o": ["−25", "−11", "11", "25"], "a": "C"}, {"q": "A student claims that adding integers with different signs always gives a negative sum. Which is a counterexample?", "o": ["−10 + 4 = −6", "−8 + 3 = −5", "−5 + 12 = 7", "−9 + 2 = −7"], "a": "C"}];let i=0,score=0,answered=false;const num=document.getElementById('num'),total=document.getElementById('total'),scoreEl=document.getElementById('score'),bar=document.getElementById('bar'),q=document.getElementById('question'),opts=document.getElementById('options'),fb=document.getElementById('feedback'),next=document.getElementById('next');total.textContent=DATA.length;function render(){answered=false;const x=DATA[i];num.textContent=i+1;scoreEl.textContent=score;bar.style.width=((i+1)/DATA.length*100)+'%';q.textContent=x.q;fb.textContent='';next.style.display='none';opts.innerHTML='';x.o.forEach((v,j)=>{const L=String.fromCharCode(65+j),b=document.createElement('button');b.className='choice';b.dataset.letter=L;b.textContent=L+'. '+v;b.onclick=()=>pick(b,x);opts.appendChild(b)})}function pick(el,x){if(answered)return;answered=true;document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;if(b.dataset.letter===x.a)b.classList.add('correct')});if(el.dataset.letter===x.a){score++;scoreEl.textContent=score;fb.textContent='✓ Correct!'}else{el.classList.add('wrong');fb.textContent='Correct answer: '+x.a}next.textContent=i===DATA.length-1?'See Result':'Next Question';next.style.display='inline-block'}next.onclick=()=>{if(i<DATA.length-1){i++;render()}else{q.innerHTML='<h2>Practice complete!</h2><p>Your score: <strong>'+score+'/'+DATA.length+'</strong></p>';opts.innerHTML='';fb.textContent='';next.style.display='none';bar.style.width='100%'}};render();</script></body></html>
