<main class="quiz-shell"><div class="quiz-top"><a class="backlink" href="../index.html">← Back to Alberta</a><span class="eyebrow">PATTERNS • PRACTICE 39</span></div><h1 style="font-size:40px;color:var(--navy);margin:18px 0 8px">Practice 39 — Function Rules &amp; Tables of Values</h1><p style="color:var(--muted);font-size:17px;margin:0 0 24px">15-question Alberta Grade 6 practice with immediate feedback.</p><section class="quiz-card"><div class="quiz-meta"><strong>15 Questions</strong><span>Question <b id="num">1</b>/<b id="total"></b> · Score <b id="score">0</b></span></div><div class="progress"><div id="bar"></div></div><div class="question" id="question"></div><div class="options" id="options"></div><div class="feedback" id="feedback"></div><button class="next" id="next">Next Question</button></section></main>
<script>
const DATA=[{"q": "Table1→4,2→8,3→12,4→16. Rule?", "o": ["y=x+4", "y=4x", "y=x−4", "y=x÷4"], "a": "B"}, {"q": "Which table y=x+6?", "o": ["1→7,2→8,3→9", "1→6,2→12,3→18", "1→5,2→6,3→7", "1→7,2→14,3→21"], "a": "A"}, {"q": "y=5x; x=6?", "o": ["11", "25", "30", "35"], "a": "C"}, {"q": "y=x−4; x=12?", "o": ["6", "8", "12", "16"], "a": "B"}, {"q": "Table2→6,4→12,6→18,8→24. Rule?", "o": ["x+4", "2x", "3x", "x+6"], "a": "C"}, {"q": "y=2x+3; x=4?", "o": ["8", "9", "11", "14"], "a": "C"}, {"q": "Table1→6,2→8,3→10,4→12. Rule?", "o": ["2x+4", "4x+2", "6x", "x+5"], "a": "A"}, {"q": "y=4x−1. Which pair?", "o": ["(2,6)", "(2,7)", "(2,8)", "(2,9)"], "a": "B"}, {"q": "Table3→11,5→15,7→19,9→?. Correct rule/value?", "o": ["x+8;17", "2x+5;23", "3x+2;29", "2x+5;21"], "a": "B"}, {"q": "Multiply x by3 then add2. Equation?", "o": ["y=3x+2", "y=3(x+2)", "y=x+5", "y=2x+3"], "a": "A"}, {"q": "Table2→9,4→15,6→21,8→27. Rule?", "o": ["3x+3", "3x", "x+7", "2x+5"], "a": "A"}, {"q": "C=4h+3; h=5 cost?", "o": ["$20", "$23", "$27", "$35"], "a": "B"}, {"q": "y=5x+2 table:1→7,2→12,3→17,4→21. Incorrect?", "o": ["(1,7)", "(2,12)", "(3,17)", "(4,21)"], "a": "D"}, {"q": "y=4x+6; y=34, x?", "o": ["6", "7", "8", "10"], "a": "B"}, {"q": "C=3d+5. Correct table?", "o": ["1→8,2→11,3→14", "1→5,2→8,3→11", "1→3,2→6,3→9", "1→9,2→12,3→15"], "a": "A"}];let i=0,score=0,answered=false;const num=document.getElementById('num'),total=document.getElementById('total'),scoreEl=document.getElementById('score'),bar=document.getElementById('bar'),q=document.getElementById('question'),opts=document.getElementById('options'),fb=document.getElementById('feedback'),next=document.getElementById('next');total.textContent=DATA.length;
function render(){answered=false;const x=DATA[i];num.textContent=i+1;scoreEl.textContent=score;bar.style.width=((i+1)/DATA.length*100)+'%';q.textContent=x.q;fb.textContent='';next.style.display='none';opts.innerHTML='';x.o.forEach((v,j)=>{const L=String.fromCharCode(65+j),b=document.createElement('button');b.className='choice';b.dataset.letter=L;b.textContent=L+'. '+v;b.onclick=()=>pick(b,x);opts.appendChild(b)})}
function pick(el,x){if(answered)return;answered=true;document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;if(b.dataset.letter===x.a)b.classList.add('correct')});if(el.dataset.letter===x.a){score++;scoreEl.textContent=score;fb.textContent='✓ Correct!'}else{el.classList.add('wrong');fb.textContent='Correct answer: '+x.a}next.textContent=i===DATA.length-1?'See Result':'Next Question';next.style.display='inline-block'}
next.onclick=()=>{if(i<DATA.length-1){i++;render()}else{q.innerHTML='<h2>Practice complete!</h2><p>Your score: <strong>'+score+'/'+DATA.length+'</strong></p>';opts.innerHTML='';fb.textContent='';next.style.display='none';bar.style.width='100%'}};render();
</script></body></html>
