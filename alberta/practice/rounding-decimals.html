*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fa;color:#172033}.back{display:inline-block;margin:16px 5% 0;text-decoration:none;font-weight:700;color:#172033}header{padding:18px 5%;background:#fff;border-bottom:1px solid #e2e7ee;display:flex;justify-content:space-between}.brand{font-weight:800;font-size:22px}.meta{color:#667085}.wrap{max-width:1000px;margin:auto;padding:42px 5% 70px}.crumb{color:#667085;font-size:14px}h1{font-size:42px;margin:12px 0 8px}.lead{font-size:18px;color:#667085}.card{background:#fff;border:1px solid #e1e6ed;border-radius:16px;padding:28px;margin-top:28px}.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:#667085}.progress{height:8px;background:#e8ecf2;border-radius:99px;margin:15px 0 30px;overflow:hidden}.fill{height:100%;background:#172033}.q{font-size:28px;font-weight:800;line-height:1.4;margin:18px 0 22px}.options{display:grid;gap:10px;max-width:760px}.opt{background:#fff;border:1px solid #cfd6df;border-radius:10px;padding:14px;text-align:left;font-size:16px;font-weight:700;cursor:pointer;color:#172033}.feedback{font-weight:800;margin-top:18px}.why{color:#667085;line-height:1.5;margin-top:7px}.next{margin-top:18px;background:#172033;color:#fff;border:0;border-radius:9px;padding:11px 15px;font-weight:800;cursor:pointer}@media(max-width:600px){h1{font-size:34px}.q{font-size:23px}header{flex-direction:column;gap:5px}}</style></head>
<body><a class="back" href="../index.html">← Back to Number</a><header><div class="brand">Canadian Math Practice</div><div class="meta">Alberta • Grade 6</div></header><div class="wrap"><div class="crumb">Grade 6 › Number › Rounding Decimals</div><h1>Rounding Decimals</h1><p class="lead">Round decimals to whole numbers, tenths, and hundredths with increasing difficulty.</p><section class="card"><div class="top"><strong>Rounding Decimals Practice</strong><span>Question <b id="n">1</b>/10 • Score <b id="score">0</b></span></div><div class="progress"><div class="fill" id="fill"></div></div><div class="q" id="q"></div><div class="options" id="opts"></div><div class="feedback" id="fb"></div><div class="why" id="why"></div><button class="next" id="next" onclick="nextQ()" style="display:none">Next Question</button></section></div>
<script>
let i=0,score=0,answered=false;
const D=[
{q:"Round 4.6 to the nearest whole number.",a:"5",o:["4","5","4.5","4.7"],w:"The tenths digit is 6, so 4.6 rounds up to 5."},
{q:"Round 7.23 to the nearest tenth.",a:"7.2",o:["7.1","7.2","7.3","7.23"],w:"The hundredths digit is 3, so the tenths digit stays the same."},
{q:"Round 12.68 to the nearest tenth.",a:"12.7",o:["12.6","12.7","12.8","13.0"],w:"The hundredths digit is 8, so 12.68 rounds up to 12.7."},
{q:"Round 5.347 to the nearest hundredth.",a:"5.35",o:["5.34","5.35","5.30","5.40"],w:"The thousandths digit is 7, so the hundredths digit rounds up."},
{q:"Round 26.49 to the nearest whole number.",a:"26",o:["25","26","27","26.5"],w:"The tenths digit is 4, so 26.49 rounds down to 26."},
{q:"Round 48.951 to the nearest hundredth.",a:"48.95",o:["48.90","48.95","48.96","49.00"],w:"The thousandths digit is 1, so the hundredths digit stays 5."},
{q:"Round 103.076 to the nearest tenth.",a:"103.1",o:["103.0","103.1","103.07","103.08"],w:"The hundredths digit is 7, so the tenths digit 0 rounds up to 1."},
{q:"Which number rounds to 62.4 to the nearest tenth?",a:"62.36",o:["62.34","62.36","62.45","62.46"],w:"62.36 rounds to 62.4 because the hundredths digit is 6. The other choices round to different tenths."},
{q:"A runner completed a race in 18.746 seconds. What is the time rounded to the nearest hundredth?",a:"18.75 seconds",o:["18.74 seconds","18.75 seconds","18.70 seconds","18.80 seconds"],w:"The thousandths digit is 6, so 18.746 rounds to 18.75."},
{q:"A measurement is 299.95 cm. What is it rounded to the nearest tenth?",a:"300.0 cm",o:["299.9 cm","300.0 cm","299.95 cm","300.5 cm"],w:"The hundredths digit is 5, so 299.95 rounds up from 299.9 to 300.0 to the nearest tenth."}
];
const n=document.getElementById("n"),sc=document.getElementById("score"),fill=document.getElementById("fill"),q=document.getElementById("q"),opts=document.getElementById("opts"),fb=document.getElementById("fb"),why=document.getElementById("why"),next=document.getElementById("next");
function render(){answered=false;let x=D[i];n.textContent=i+1;sc.textContent=score;fill.style.width=(((i+1)/10)*100)+"%";q.textContent=x.q;fb.textContent="";why.textContent="";next.style.display="none";opts.innerHTML=[...x.o].sort(()=>Math.random()-.5).map(v=>`<button class="opt" data-v="${v}" onclick="pick(this)">${v}</button>`).join("")}
function pick(el){if(answered)return;answered=true;document.querySelectorAll(".opt").forEach(b=>b.disabled=true);let x=D[i];if(el.dataset.v===x.a){score++;sc.textContent=score;fb.textContent="✓ Correct!"}else fb.textContent="✗ Not quite. Correct answer: "+x.a;why.textContent=x.w;next.textContent=i===9?"See Result":"Next Question";next.style.display="inline-block"}
function nextQ(){if(i<9){i++;render()}else{q.textContent="Practice complete!";opts.innerHTML="";fb.textContent=`Your score: ${score}/10`;why.textContent=score>=8?"Strong work.":"Try again and look at the digit immediately to the right of the rounding place.";next.style.display="none"}}render();</script></body></html>
