<script>
let i=0,score=0,answered=false;
const D=[{"q":"What is 18.47 + 6.305?","a":"24.775","o":["24.775","24.705","25.775","247.75"],"w":"Align decimal points before adding."},{"q":"What is 52.6 − 17.845?","a":"34.755","o":["34.755","35.755","34.845","347.55"],"w":"Write 52.600, then subtract."},{"q":"What is 9.008 + 0.92?","a":"9.928","o":["9.928","9.100","9.028","99.28"],"w":"0.92 = 0.920."},{"q":"What is 40 − 6.375?","a":"33.625","o":["33.625","34.625","33.375","336.25"],"w":"Write 40.000, then subtract."},{"q":"A book costs $12.75 and a game costs $8.49. What is the total?","a":"$21.24","o":["$20.24","$21.24","$21.14","$22.24"],"w":"12.75 + 8.49 = 21.24."},{"q":"A tank held 25.5 L. After 7.86 L was used, how much remained?","a":"17.64 L","o":["17.64 L","18.64 L","17.74 L","176.4 L"],"w":"25.50 − 7.86 = 17.64."},{"q":"Which estimate best checks 48.72 + 31.19?","a":"About 80","o":["About 60","About 70","About 80","About 90"],"w":"49 + 31 is about 80."},{"q":"What is 3.456 + 12.08 + 0.7?","a":"16.236","o":["15.536","16.236","16.936","162.36"],"w":"Align all decimal points."},{"q":"What is 100.0 − 49.999?","a":"50.001","o":["49.001","50.001","50.101","51.001"],"w":"100.000 − 49.999 = 50.001."},{"q":"Mina says 6.4 + 0.85 = 6.125. What error did she make?","a":"She did not align the decimal places.","o":["She added too many zeros.","She did not align the decimal places.","She should multiply instead.","There is no error."],"w":"6.40 + 0.85 = 7.25."}];
