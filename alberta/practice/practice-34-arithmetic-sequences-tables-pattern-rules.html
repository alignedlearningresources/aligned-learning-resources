<script>
const DATA=[{"q": "6,10,14,18,22,... rule?", "o": ["+2", "+4", "×2", "×4"], "a": "B"}, {"q": "Which sequence follows add 6?", "o": ["4,10,16,22", "4,8,12,16", "6,12,24,48", "24,18,12,8"], "a": "A"}, {"q": "35,30,25,20,15,... rule?", "o": ["+5", "−10", "−5", "÷5"], "a": "C"}, {"q": "Table positions 1–3 → 8,13,18; position4?", "o": ["20", "21", "22", "23"], "a": "D"}, {"q": "Table 7,11,15,19: terms change by?", "o": ["+4", "+7", "×4", "−4"], "a": "A"}, {"q": "Which table decreases by3?", "o": ["20,17,14,11", "20,16,12,8", "20,23,26,29", "20,10,5,2.5"], "a": "A"}, {"q": "11,18,25,32; position5?", "o": ["37", "38", "39", "40"], "a": "C"}, {"q": "Begins50, decreases6: first four?", "o": ["50,44,38,32", "50,46,42,38", "50,56,62,68", "50,40,30,20"], "a": "A"}, {"q": "Table positions1–5 →5,12,19,26,33. True?", "o": ["+5", "+7", "term=5×position", "+12"], "a": "B"}, {"q": "Which follows subtract8?", "o": ["42,34,26,18", "42,36,30,24", "42,50,58,66", "42,21,10.5,5.25"], "a": "A"}, {"q": "Sequence should +6: 14,20,26,31,38. Incorrect term?", "o": ["20", "26", "31", "38"], "a": "C"}, {"q": "First term9, increases8. Position6?", "o": ["41", "49", "51", "57"], "a": "B"}, {"q": "16,22,28,34,40: Maya says +6; Noah says ×6.", "o": ["Maya only", "Noah only", "Both", "Neither"], "a": "A"}, {"q": "Table 60,53,46,39,32. Position8?", "o": ["18", "11", "4", "25"], "a": "B"}, {"q": "Trail markers 3,8,13,18,... correct pattern and position7?", "o": ["+3;21", "+5;33", "+5;35", "×5;35"], "a": "B"}];let i=0,score=0,answered=false;const num=document.getElementById('num'),total=document.getElementById('total'),scoreEl=document.getElementById('score'),bar=document.getElementById('bar'),q=document.getElementById('question'),opts=document.getElementById('options'),fb=document.getElementById('feedback'),next=document.getElementById('next');total.textContent=DATA.length;
function render(){answered=false;const x=DATA[i];num.textContent=i+1;scoreEl.textContent=score;bar.style.width=((i+1)/DATA.length*100)+'%';q.textContent=x.q;fb.textContent='';next.style.display='none';opts.innerHTML='';x.o.forEach((v,j)=>{const L=String.fromCharCode(65+j),b=document.createElement('button');b.className='choice';b.dataset.letter=L;b.textContent=L+'. '+v;b.onclick=()=>pick(b,x);opts.appendChild(b)})}
function pick(el,x){if(answered)return;answered=true;document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;if(b.dataset.letter===x.a)b.classList.add('correct')});if(el.dataset.letter===x.a){score++;scoreEl.textContent=score;fb.textContent='✓ Correct!'}else{el.classList.add('wrong');fb.textContent='Correct answer: '+x.a}next.textContent=i===DATA.length-1?'See Result':'Next Question';next.style.display='inline-block'}
next.onclick=()=>{if(i<DATA.length-1){i++;render()}else{q.innerHTML='<h2>Practice complete!</h2><p>Your score: <strong>'+score+'/'+DATA.length+'</strong></p>';opts.innerHTML='';fb.textContent='';next.style.display='none';bar.style.width='100%'}};render();
</script></body></html>
