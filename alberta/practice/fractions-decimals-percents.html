{q:"Which value is greatest?",a:"0.72",o:["7/10","68%","0.72","2/3"],w:"7/10=0.70, 68%=0.68, 0.72=0.72, and 2/3â‰ˆ0.667. Therefore 0.72 is greatest."},
{q:"Order from least to greatest: 45%, 1/2, 0.6",a:"45%, 1/2, 0.6",o:["45%, 1/2, 0.6","1/2, 45%, 0.6","0.6, 1/2, 45%","45%, 0.6, 1/2"],w:"45%=0.45, 1/2=0.50, and 0.6=0.60."},
{q:"In a survey, 3/5 of 40 students chose option A. What percent of the students chose option A?",a:"60%",o:["40%","50%","60%","75%"],w:"3/5 = 0.6 = 60%. This represents 24 of the 40 students."},
{q:"A store marks an item as 0.3 of its original price off. Which percent discount is this?",a:"30%",o:["3%","13%","30%","70%"],w:"0.3 = 30/100 = 30%."},
{q:"Noah says 4/5, 0.8, and 8% are equivalent. Which statement is correct?",a:"Noah is incorrect because 0.8 equals 80%, not 8%.",o:["Noah is correct.","Noah is incorrect because 4/5 equals 40%.","Noah is incorrect because 0.8 equals 80%, not 8%.","Noah is incorrect because 8% equals 0.8."],w:"4/5=0.8=80%. But 8%=0.08, so 8% is not equivalent to the other two values."}
