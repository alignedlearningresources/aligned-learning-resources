<body><a class="back" href="../index.html">← Back to Number</a><header><div class="brand">Canadian Math Practice</div><div class="meta">Alberta • Grade 6</div></header><div class="wrap"><div class="crumb">Grade 6 › Number › Number Problem Solving</div><h1>Number Problem Solving</h1><p class="lead">Choose operations, estimate, and solve multi-step Grade 6 number problems.</p><section class="card"><div class="top"><strong>Number Problem Solving Practice</strong><span>Question <b id="n">1</b>/10 • Score <b id="score">0</b></span></div><div class="progress"><div class="fill" id="fill"></div></div><div class="q" id="q"></div><div class="options" id="opts"></div><div class="feedback" id="fb"></div><div class="why" id="why"></div><button class="next" id="next" onclick="nextQ()" style="display:none">Next Question</button></section></div>
<script>
let i=0,score=0,answered=false;
const D=[{"q":"A school buys 24 boxes of 36 markers. How many markers?","a":"864","o":["60","144","864","8,640"],"w":"24×36=864."},{"q":"A 9.6-L container fills 8 equal bottles. Each bottle?","a":"1.2 L","o":["0.12 L","1.2 L","1.6 L","12 L"],"w":"9.6÷8=1.2."},{"q":"A trail is 2 1/3 km plus 3/4 km. Total?","a":"3 1/12 km","o":["2 4/7 km","2 11/12 km","3 1/12 km","3 7/12 km"],"w":"2 4/12 + 9/12 = 3 1/12."},{"q":"Temperature is −6°C and rises 11°C. New temperature?","a":"5°C","o":["−17°C","−5°C","5°C","17°C"],"w":"−6+11=5."},{"q":"A recipe uses 3/5 cup oats for each of 10 batches. Total?","a":"6 cups","o":["3 cups","5 cups","6 cups","10 cups"],"w":"10×3/5=6."},{"q":"A store has 1,250 items and packs 48 per carton. How many full cartons and items left?","a":"26 cartons, 2 left","o":["25 cartons, 50 left","26 cartons, 2 left","26 cartons, 8 left","27 cartons, 2 left"],"w":"48×26=1248, leaving 2."},{"q":"A class ratio is 3 red folders to 5 blue. If there are 12 red, blue?","a":"20","o":["15","18","20","24"],"w":"Scale 3:5 by 4."},{"q":"A bill is $48.75 plus $16.89. Estimate first, then exact total.","a":"About $66; $65.64","o":["About $55; $65.64","About $66; $65.64","About $66; $64.64","About $70; $66.64"],"w":"49+17≈66; exact sum is 65.64."},{"q":"Which operation is most useful to find how many 0.5-m pieces can be cut from 18 m?","a":"Division","o":["Addition","Subtraction","Multiplication","Division"],"w":"18÷0.5 finds the number of equal pieces."},{"q":"A student gets 302 for 7,248 ÷ 24. Is it reasonable?","a":"Yes; 24×300 is about 7,200.","o":["Yes; 24×300 is about 7,200.","No; the quotient should be about 30.","No; division always makes a number larger.","Cannot be checked by estimation."],"w":"7,248÷24=302, close to 7,200÷24=300."}];
const n=document.getElementById("n"),sc=document.getElementById("score"),fill=document.getElementById("fill"),q=document.getElementById("q"),opts=document.getElementById("opts"),fb=document.getElementById("fb"),why=document.getElementById("why"),next=document.getElementById("next");
function render(){answered=false;let x=D[i];n.textContent=i+1;sc.textContent=score;fill.style.width=(((i+1)/10)*100)+"%";q.textContent=x.q;fb.textContent="";why.textContent="";next.style.display="none";opts.innerHTML=[...x.o].sort(()=>Math.random()-.5).map(v=>`<button class="opt" data-v="${v}" onclick="pick(this)">${v}</button>`).join("")}
function pick(el){if(answered)return;answered=true;document.querySelectorAll(".opt").forEach(b=>b.disabled=true);let x=D[i];if(el.dataset.v===x.a){score++;sc.textContent=score;fb.textContent="✓ Correct!"}else fb.textContent="✗ Not quite. Correct answer: "+x.a;why.textContent=x.w;next.textContent=i===9?"See Result":"Next Question";next.style.display="inline-block"}
function nextQ(){if(i<9){i++;render()}else{q.textContent="Practice complete!";opts.innerHTML="";fb.textContent=`Your score: ${score}/10`;why.textContent=score>=8?"Strong work.":"Review the explanations and try this skill again.";next.style.display="none"}}render();</script></body></html>
