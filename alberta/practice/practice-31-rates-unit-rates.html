<h1 style="font-size:40px;color:var(--navy);margin:18px 0 8px">Practice 31 — Rates &amp; Unit Rates</h1><p style="color:var(--muted);font-size:17px;margin:0 0 24px">15-question Alberta Grade 6 Number practice with immediate feedback.</p>
<section class="quiz-card"><div class="quiz-meta"><strong>15 Questions</strong><span>Question <b id="num">1</b>/<b id="total"></b> · Score <b id="score">0</b></span></div><div class="progress"><div id="bar"></div></div><div class="question" id="question"></div><div class="options" id="options"></div><div class="feedback" id="feedback"></div><button class="next" id="next">Next Question</button></section></main>
<script>
const DATA=[{"q": "A cyclist travels 24 km in 3 hours. What is the unit rate?", "o": ["6 km/h", "8 km/h", "12 km/h", "21 km/h"], "a": "B"}, {"q": "A package contains 20 pencils for $5. What is the unit price per pencil?", "o": ["$4.00", "$1.00", "$0.25", "$0.20"], "a": "C"}, {"q": "A machine fills 36 bottles in 4 minutes. How many bottles does it fill per minute?", "o": ["9", "8", "32", "40"], "a": "A"}, {"q": "Which rate is a unit rate?", "o": ["12 km per 3 hours", "10 apples for $5", "18 pages in 2 minutes", "7 km per 1 hour"], "a": "D"}, {"q": "A car travels 270 km in 3 hours at a constant speed. What is its speed?", "o": ["80 km/h", "90 km/h", "91 km/h", "810 km/h"], "a": "B"}, {"q": "A 6-pack of notebooks costs $15. What is the cost per notebook?", "o": ["$2.00", "$2.25", "$2.50", "$9.00"], "a": "C"}, {"q": "Which has the lower unit price? - Package A: 4 markers for $6 - Package B: 6 markers for $8.40", "o": ["Package A, because $1.50 < $1.60", "Package B, because $1.40 < $1.50", "Package A, because 4 < 6", "Package B, because $8.40 > $6.00"], "a": "B"}, {"q": "Maya reads 42 pages in 6 minutes at a constant rate. At the same rate, how many pages will she read in 10 minutes?", "o": ["60", "65", "70", "72"], "a": "C"}, {"q": "A runner travels 18 km in 2 hours. A cyclist travels 40 km in 5 hours. Who travels faster?", "o": ["The runner, by 1 km/h", "The cyclist, by 1 km/h", "They travel at the same speed.", "The runner, by 4 km/h"], "a": "A"}, {"q": "Store A sells 8 juice boxes for $12. Store B sells 10 juice boxes for $14. Which statement is correct?", "o": ["Store A is cheaper at $1.20 each.", "Both stores charge $1.50 each.", "Store B is cheaper at $1.25 each.", "Store B is cheaper at $1.40 each."], "a": "D"}, {"q": "A tap fills 15 L in 3 minutes. At the same rate, how much water will it fill in 8 minutes?", "o": ["24 L", "30 L", "40 L", "45 L"], "a": "C"}, {"q": "Noah says, “A car travelling 150 km in 3 hours is faster than a car travelling 120 km in 2 hours because 150 is greater than 120.” Which statement best explains Noah's error?", "o": ["Distance cannot be used to describe speed.", "He should add the distance and time.", "Both cars travel at 50 km/h.", "He must compare the distance travelled per hour; the second car is faster."], "a": "D"}, {"q": "Printer A prints 48 pages in 6 minutes. Printer B prints 63 pages in 7 minutes. Which statement is correct?", "o": ["Printer A is faster by 2 pages/min.", "They print at the same rate.", "Printer B is faster by 1 page/min.", "Printer B is faster by 3 pages/min."], "a": "C"}, {"q": "A grocery store offers 3 kg of apples for $8.40 or 5 kg for $13.50. Which option has the lower cost per kilogram, and by how much?", "o": ["3 kg option by $0.10/kg", "5 kg option by $0.10/kg", "3 kg option by $0.20/kg", "5 kg option by $0.20/kg"], "a": "B"}, {"q": "Bus A travels 168 km in 3 hours. Bus B travels 290 km in 5 hours. Which statement is correct?", "o": ["Bus A is faster because it travels 56 km/h.", "They travel at the same speed because both travel more than 50 km each hour.", "Bus B is faster by 10 km/h.", "Bus B is faster by 2 km/h."], "a": "D"}];let i=0,score=0,answered=false;const num=document.getElementById('num'),total=document.getElementById('total'),scoreEl=document.getElementById('score'),bar=document.getElementById('bar'),q=document.getElementById('question'),opts=document.getElementById('options'),fb=document.getElementById('feedback'),next=document.getElementById('next');total.textContent=DATA.length;
function render(){answered=false;const x=DATA[i];num.textContent=i+1;scoreEl.textContent=score;bar.style.width=((i+1)/DATA.length*100)+'%';q.textContent=x.q;fb.textContent='';next.style.display='none';opts.innerHTML='';x.o.forEach((v,j)=>{const L=String.fromCharCode(65+j),b=document.createElement('button');b.className='choice';b.dataset.letter=L;b.textContent=L+'. '+v;b.onclick=()=>pick(b,x);opts.appendChild(b)})}
function pick(el,x){if(answered)return;answered=true;document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;if(b.dataset.letter===x.a)b.classList.add('correct')});if(el.dataset.letter===x.a){score++;scoreEl.textContent=score;fb.textContent='✓ Correct!'}else{el.classList.add('wrong');fb.textContent='Correct answer: '+x.a}next.textContent=i===DATA.length-1?'See Result':'Next Question';next.style.display='inline-block'}
next.onclick=()=>{if(i<DATA.length-1){i++;render()}else{q.innerHTML='<h2>Practice complete!</h2><p>Your score: <strong>'+score+'/'+DATA.length+'</strong></p>';opts.innerHTML='';fb.textContent='';next.style.display='none';bar.style.width='100%'}};render();
</script></body></html>
