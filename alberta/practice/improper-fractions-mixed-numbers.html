<body><a class="back" href="../index.html">← Back to Number</a><header><div class="brand">Canadian Math Practice</div><div class="meta">Alberta • Grade 6</div></header><div class="wrap"><div class="crumb">Grade 6 › Number › Improper Fractions & Mixed Numbers</div><h1>Improper Fractions & Mixed Numbers</h1><p class="lead">Convert, compare, and reason with improper fractions and mixed numbers.</p><section class="card"><div class="top"><strong>Mixed Numbers Practice</strong><span>Question <b id="n">1</b>/10 • Score <b id="score">0</b></span></div><div class="progress"><div class="fill" id="fill"></div></div><div class="q" id="q"></div><div class="options" id="opts"></div><div class="feedback" id="fb"></div><div class="why" id="why"></div><button class="next" id="next" onclick="nextQ()" style="display:none">Next Question</button></section></div>
<script>
let i=0,score=0,answered=false;
const D=[
{q:"Which fraction is an improper fraction?",a:"7/4",o:["2/5","3/8","7/4","4/9"],w:"In 7/4, the numerator is greater than the denominator, so the fraction is improper."},
{q:"Write 5/2 as a mixed number.",a:"2 1/2",o:["1 2/5","2 1/2","2 2/5","3 1/2"],w:"5 ÷ 2 = 2 remainder 1, so 5/2 = 2 1/2."},
{q:"Write 1 3/4 as an improper fraction.",a:"7/4",o:["4/7","6/4","7/4","8/4"],w:"1 whole is 4/4. Then 4/4 + 3/4 = 7/4."},
{q:"Write 11/3 as a mixed number.",a:"3 2/3",o:["2 3/3","3 1/3","3 2/3","4 2/3"],w:"11 ÷ 3 = 3 remainder 2, giving 3 2/3."},
{q:"Write 4 2/5 as an improper fraction.",a:"22/5",o:["18/5","20/5","22/5","24/5"],w:"4 × 5 + 2 = 22, so 4 2/5 = 22/5."},
{q:"Which value is greater?",a:"13/4",o:["3 1/5","13/4","They are equal.","Cannot be determined."],w:"13/4 = 3 1/4. Since 1/4 > 1/5, 3 1/4 is greater than 3 1/5."},
{q:"Which statement is true?",a:"17/5 = 3 2/5",o:["17/5 = 2 3/5","17/5 = 3 2/5","17/5 = 3 4/5","17/5 = 4 2/5"],w:"17 ÷ 5 = 3 remainder 2, so 17/5 = 3 2/5."},
{q:"Order from least to greatest: 7/3, 2 1/2, 11/4",a:"7/3, 2 1/2, 11/4",o:["7/3, 2 1/2, 11/4","2 1/2, 7/3, 11/4","11/4, 2 1/2, 7/3","7/3, 11/4, 2 1/2"],w:"7/3 = 2 1/3, 2 1/2 = 2.5, and 11/4 = 2 3/4. Therefore 2 1/3 < 2 1/2 < 2 3/4."},
{q:"A recipe uses 9/4 cups of flour. Which mixed number represents the same amount?",a:"2 1/4 cups",o:["1 3/4 cups","2 1/4 cups","2 3/4 cups","3 1/4 cups"],w:"9 ÷ 4 = 2 remainder 1, so 9/4 = 2 1/4."},
{q:"Nora says 3 2/7 = 23/7. Is she correct?",a:"Yes. 3 × 7 + 2 = 23.",o:["Yes. 3 × 7 + 2 = 23.","No. It should be 21/7.","No. It should be 17/7.","No. It should be 9/7."],w:"To convert 3 2/7, multiply 3 × 7 = 21 and add 2. That gives 23/7, so Nora is correct."}
];
const n=document.getElementById("n"),sc=document.getElementById("score"),fill=document.getElementById("fill"),q=document.getElementById("q"),opts=document.getElementById("opts"),fb=document.getElementById("fb"),why=document.getElementById("why"),next=document.getElementById("next");
function render(){answered=false;let x=D[i];n.textContent=i+1;sc.textContent=score;fill.style.width=((i+1)*10)+"%";q.textContent=x.q;fb.textContent="";why.textContent="";next.style.display="none";opts.innerHTML=[...x.o].sort(()=>Math.random()-.5).map(v=>`<button class="opt" data-v="${v}" onclick="pick(this)">${v}</button>`).join("")}
function pick(el){if(answered)return;answered=true;document.querySelectorAll(".opt").forEach(b=>b.disabled=true);let x=D[i];if(el.dataset.v===x.a){score++;sc.textContent=score;fb.textContent="✓ Correct!"}else fb.textContent="✗ Not quite. Correct answer: "+x.a;why.textContent=x.w;next.textContent=i===9?"See Result":"Next Question";next.style.display="inline-block"}
function nextQ(){if(i<9){i++;render()}else{q.textContent="Practice complete!";opts.innerHTML="";fb.textContent=`Your score: ${score}/10`;why.textContent=score>=8?"Strong work with mixed numbers and improper fractions.":"Try again and connect each whole to the number of denominator-sized parts it contains.";next.style.display="none"}}render();</script></body></html>
