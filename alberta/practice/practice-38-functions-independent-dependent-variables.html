<script>
const DATA=[{"q":"A plant's height is recorded each week. Which variable is independent?","o":["type of ruler","plant height","week number","final height only"],"a":"C"},{"q":"A cyclist's distance travelled changes with time. Which variable is dependent?","o":["time","starting point","distance travelled","unit label"],"a":"C"},{"q":"A table shows number of notebooks purchased and total cost. Which variable should be in the first column?","o":["difference in cost","store name","total cost","number of notebooks"],"a":"D"},{"q":"An employee earns more money as hours worked increase. Which statement is correct?","o":["Neither quantity changes.","Earnings depend on hours worked.","Hours worked depend on earnings.","Both are independent."],"a":"B"},{"q":"Water temperature is measured as a drink cools over time. Which pair correctly identifies the variables?","o":["independent: time; dependent: temperature","both independent","both dependent","independent: temperature; dependent: time"],"a":"A"},{"q":"A table has x-values 1,2,3,4 and y-values 5,10,15,20. Which statement is supported?","o":["The y-values must all be equal.","Each x has exactly one y-value.","The table cannot represent a function.","x depends on y by definition."],"a":"B"},{"q":"Fuel used is recorded as distance travelled increases. What should be the dependent variable?","o":["fuel used","vehicle name","distance travelled","starting fuel only"],"a":"A"},{"q":"A ride ticket costs a fixed amount per ticket. If x is number of tickets and y is total cost, what does the x-coordinate represent?","o":["total cost","number of tickets","ticket price","change in cost"],"a":"B"},{"q":"A table shows boxes → apples as 1→6, 2→12, 3→18, 4→24. A student says apples are independent because the numbers are larger. What is the best correction?","o":["Apples are dependent because their total changes with the number of boxes.","The table is not a function.","Both variables are independent.","Apples are independent because 24 is largest."],"a":"A"},{"q":"A gym charges by number of classes. Points (1,8),(2,16),(3,24),(4,32) represent classes and cost. Which statement is correct?","o":["Cost is the independent variable.","The points do not represent a function.","Both coordinates represent cost.","Classes are the independent variable and cost is dependent."],"a":"D"}];let i=0,score=0,answered=false;const num=document.getElementById('num'),total=document.getElementById('total'),scoreEl=document.getElementById('score'),bar=document.getElementById('bar'),q=document.getElementById('question'),opts=document.getElementById('options'),fb=document.getElementById('feedback'),next=document.getElementById('next');total.textContent=DATA.length;const countEl=document.getElementById('count');if(countEl)countEl.textContent=DATA.length;
function render(){answered=false;const x=DATA[i];num.textContent=i+1;scoreEl.textContent=score;bar.style.width=((i+1)/DATA.length*100)+'%';q.textContent=x.q;fb.textContent='';next.style.display='none';opts.innerHTML='';x.o.forEach((v,j)=>{const L=String.fromCharCode(65+j),b=document.createElement('button');b.className='choice';b.dataset.letter=L;b.textContent=L+'. '+v;b.onclick=()=>pick(b,x);opts.appendChild(b)})}
function pick(el,x){if(answered)return;answered=true;document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;if(b.dataset.letter===x.a)b.classList.add('correct')});if(el.dataset.letter===x.a){score++;scoreEl.textContent=score;fb.textContent='✓ Correct!'}else{el.classList.add('wrong');fb.textContent='Correct answer: '+x.a}next.textContent=i===DATA.length-1?'See Result':'Next Question';next.style.display='inline-block'}
next.onclick=()=>{if(i<DATA.length-1){i++;render()}else{q.innerHTML='<h2>Practice complete!</h2><p>Your score: <strong>'+score+'/'+DATA.length+'</strong></p>';opts.innerHTML='';fb.textContent='';next.style.display='none';bar.style.width='100%'}};render();
</script></body></html>
