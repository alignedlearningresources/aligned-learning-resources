<script>
const DATA=[{"q": "Plant height measured each week. Independent?", "o": ["height", "weeks", "type", "height gained"], "a": "B"}, {"q": "Cyclist distance changes with time. Dependent?", "o": ["time", "bicycle", "distance", "starting point"], "a": "C"}, {"q": "Notebook table number→total cost. Independent?", "o": ["number notebooks", "total cost", "cost/notebook", "savings"], "a": "A"}, {"q": "Hours worked→money earned. Dependent?", "o": ["hours", "workers", "money", "days"], "a": "C"}, {"q": "Water temperature as it cools over time. Correct?", "o": ["temperature independent", "time dependent", "time independent, temp dependent", "both independent"], "a": "C"}, {"q": "Function table x:1,2,3,4; y:5,10,15,20. Correct?", "o": ["x dependent", "x independent,y dependent", "both dependent", "both independent"], "a": "B"}, {"q": "Fuel used changes as distance increases.", "o": ["fuel independent/distance dependent", "distance independent/fuel dependent", "car independent/distance dependent", "fuel independent/car dependent"], "a": "B"}, {"q": "Ride-ticket total cost depends on tickets. x-coordinate?", "o": ["total cost", "cost one ticket", "number tickets", "change"], "a": "C"}, {"q": "Boxes→apples table1→6,2→12,3→18,4→24. Student says apples independent because larger. Best correction?", "o": ["larger always dependent", "boxes depend on apples", "variable type determined by which quantity controls other, not size", "both independent"], "a": "C"}, {"q": "Gym classes→cost points(1,8),(2,16),(3,24),(4,32). Correct?", "o": ["cost independent because y", "classes dependent", "classes independent,cost dependent", "both dependent"], "a": "C"}];let i=0,score=0,answered=false;const num=document.getElementById('num'),total=document.getElementById('total'),scoreEl=document.getElementById('score'),bar=document.getElementById('bar'),q=document.getElementById('question'),opts=document.getElementById('options'),fb=document.getElementById('feedback'),next=document.getElementById('next');total.textContent=DATA.length;
function render(){answered=false;const x=DATA[i];num.textContent=i+1;scoreEl.textContent=score;bar.style.width=((i+1)/DATA.length*100)+'%';q.textContent=x.q;fb.textContent='';next.style.display='none';opts.innerHTML='';x.o.forEach((v,j)=>{const L=String.fromCharCode(65+j),b=document.createElement('button');b.className='choice';b.dataset.letter=L;b.textContent=L+'. '+v;b.onclick=()=>pick(b,x);opts.appendChild(b)})}
