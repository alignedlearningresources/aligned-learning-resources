<style>
.quiz-shell{max-width:900px;margin:0 auto;padding:34px 24px 80px}

.backlink{text-decoration:none;color:var(--blue);font-weight:800}
.quiz-card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:28px;box-shadow:0 8px 30px rgba(18,35,63,.06)}

</style>
</head>
<body>
<header class="site-header"><nav class="nav"><a class="brand" href="../../index.html">Aligned Learning Resources</a><div class="navlinks"><a href="../../index.html">Home</a><a href="../index.html">Alberta</a><a href="../../ontario/index.html">Ontario</a></div></nav></header>
<main class="quiz-shell">
<div class="quiz-top"><a class="backlink" href="../index.html">← Back to Alberta Grade 6</a><span class="eyebrow">GEOMETRY • PRACTICE 96</span></div>
<h1 style="font-size:40px;color:var(--navy);margin:8px 0 8px">Practice 96 — Symmetry in Nature &amp; Indigenous Designs</h1>
<p style="font-size:17px;color:var(--muted);line-height:1.6;margin:0 0 24px">Recognize reflection and rotational symmetry in nature and in geometric design contexts.</p>
<section class="quiz-card">
<div class="quiz-meta"><strong>Practice</strong><span>Question <b id="num">1</b>/<b id="total"></b> · Score <b id="score">0</b></span></div>
<div class="progress"><div id="bar"></div></div>
<div class="question" id="question"></div>
<div class="options" id="options"></div>
<div class="feedback" id="feedback"></div>
<button class="next" id="next">Next Question</button>
</section>
</main>
<script>
const DATA=[{"q": "A butterfly’s left and right wings have matching shapes and markings. Which type of symmetry does this most closely model?", "o": ["Translation", "Reflection symmetry", "Central symmetry", "No symmetry"], "a": "B"}, {"q": "A flower has 6 evenly spaced identical petals around its centre. Turning the flower 60° makes it appear in the same position. What is the order of rotational symmetry?", "o": ["3", "4", "6", "12"], "a": "C"}, {"q": "Symmetry can be observed in which of the following?", "o": ["Only regular polygons", "Only human-made objects", "Both nature and human-made designs", "Only objects with straight sides"], "a": "C"}, {"q": "A Métis floral beadwork design has matching elements on opposite sides of a vertical line. Which symmetry is being described?", "o": ["Reflection symmetry", "Translation only", "Enlargement", "No symmetry"], "a": "A"}, {"q": "A design on a woven basket repeats around a centre. Rotating the design about that centre maps sections exactly onto other sections. Which type of symmetry is shown?", "o": ["Reflection only", "Rotation symmetry", "Translation only", "No symmetry"], "a": "B"}, {"q": "A student investigates the geometric design of a wampum belt and finds that one section can be reflected across a line to match another section. What has the student identified?", "o": ["Reflection symmetry", "A change in size", "A translation with no symmetry", "An irregular shape"], "a": "A"}, {"q": "A quilt design contains a geometric star. Several sections of the star map exactly onto one another when the design is turned about its centre. Which observation provides the best evidence of rotational symmetry?", "o": ["The design contains several colours.", "The star is larger than the surrounding shapes.", "A rotation less than 360° maps the design exactly onto itself.", "The design contains straight lines."], "a": "C"}, {"q": "Maya says: “If a design repeats, it must have reflection symmetry.” Which response is correct?", "o": ["Maya is correct because all repeating designs have reflection symmetry.", "Maya is incorrect because a design may have rotational symmetry without reflection symmetry.", "Maya is correct only for designs found in nature.", "Maya is incorrect because repeating designs can never have symmetry."], "a": "B"}, {"q": "Students are examining symmetry in architecture. A front-facing geometric representation of a structure has matching left and right sides across a vertical line. Which statement is best supported?", "o": ["The representation shows reflection symmetry across the vertical line.", "The representation must have rotational symmetry of order 4.", "The structure cannot contain any other symmetry.", "Every architectural structure has the same symmetry."], "a": "A"}, {"q": "A student studies three designs:\nDesign P maps onto itself after reflection across a line.\nDesign Q maps onto itself after a 120° rotation.\nDesign R does not map onto itself after any tested reflection or rotation less than 360°.\nWhich conclusion is correct?", "o": ["Only R shows symmetry.", "P shows rotation symmetry and Q shows reflection symmetry.", "P shows reflection symmetry, Q shows rotation symmetry, and R shows neither of these symmetries.", "All three must have reflection symmetry."], "a": "C"}];
let i=0, score=0, answered=false;
const num=document.getElementById('num'), total=document.getElementById('total'), scoreEl=document.getElementById('score'),
bar=document.getElementById('bar'), q=document.getElementById('question'), opts=document.getElementById('options'),
fb=document.getElementById('feedback'), next=document.getElementById('next');
total.textContent=DATA.length;
function render(){
  answered=false; const x=DATA[i]; num.textContent=i+1; scoreEl.textContent=score;
  bar.style.width=((i+1)/DATA.length*100)+'%'; q.textContent=x.q; fb.textContent=''; next.style.display='none';
  opts.innerHTML='';
  x.o.forEach((v,idx)=>{
    const letter=String.fromCharCode(65+idx);
    const b=document.createElement('button'); b.className='choice'; b.dataset.letter=letter;
    b.textContent=letter+'. '+v; b.onclick=()=>pick(b,x); opts.appendChild(b);
  });
}
function pick(el,x){
  if(answered)return; answered=true;
  document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;if(b.dataset.letter===x.a)b.classList.add('correct')});
  if(el.dataset.letter===x.a){score++;scoreEl.textContent=score;fb.textContent='✓ Correct!';}
  else{el.classList.add('wrong');fb.textContent='Correct answer: '+x.a;}
  next.textContent=i===DATA.length-1?'See Result':'Next Question';next.style.display='inline-block';
}
next.onclick=()=>{if(i<DATA.length-1){i++;render()}else{
  q.innerHTML='<div class="result"><h2>Practice complete!</h2><p>Your score: <strong>'+score+'/'+DATA.length+'</strong></p></div>';
  opts.innerHTML='';fb.textContent='';next.style.display='none';bar.style.width='100%';
}};
render();
</script>
</body></html>
