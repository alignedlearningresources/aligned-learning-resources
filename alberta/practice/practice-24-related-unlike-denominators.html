<script>
const DATA=[{"q": "Calculate 1/4 + 2/8.", "o": ["3/8", "1/2", "3/12", "5/8"], "a": "B"}, {"q": "Calculate 5/6 − 1/3.", "o": ["2/3", "4/3", "4/6", "1/2"], "a": "D"}, {"q": "Calculate 2/5 + 3/10.", "o": ["7/10", "1/2", "5/15", "1 1/10"], "a": "A"}, {"q": "Calculate 7/8 − 1/4 in simplest form.", "o": ["3/8", "1/2", "5/8", "7/12"], "a": "C"}, {"q": "Calculate 2/3 + 1/4.", "o": ["3/7", "11/12", "3/12", "5/6"], "a": "B"}, {"q": "Calculate 5/6 − 1/4 in simplest form.", "o": ["4/12", "2/3", "1/2", "7/12"], "a": "D"}, {"q": "Calculate 3/5 + 7/10 as a mixed number in simplest form.", "o": ["1 3/10", "1 1/10", "1 2/5", "13/15"], "a": "A"}, {"q": "Calculate 7/9 − 1/6 in simplest form.", "o": ["5/18", "11/18", "2/3", "6/15"], "a": "B"}, {"q": "What is the least common denominator for 5/12 + 1/8?", "o": ["16", "20", "36", "24"], "a": "D"}, {"q": "A student calculates 2/3 + 1/4 = 3/7. Which statement best explains the error?", "o": ["The student should subtract because denominators differ.", "Fractions with different denominators cannot be added.", "The student added numerators and denominators instead of first expressing the fractions with a common denominator.", "The student should multiply the fractions."], "a": "C"}, {"q": "Calculate 5/8 + 7/12 as a mixed number in simplest form.", "o": ["1 1/24", "1 7/24", "1 11/24", "1 5/24"], "a": "D"}, {"q": "A recipe uses 2/3 cup oats and 3/8 cup seeds. How many cups altogether?", "o": ["1 1/24", "1 3/24", "1 5/24", "1 7/24"], "a": "A"}, {"q": "A container holds 2 1/4 L of juice. 5/6 L is poured out. How much remains?", "o": ["1 1/12", "1 5/12", "1 7/12", "1 11/12"], "a": "B"}, {"q": "Mia uses denominator 12 and Noah uses denominator 24 to solve 3/4 + 5/6. Which statement is correct?", "o": ["Both denominators can be used correctly, but 12 usually requires simpler calculations.", "Only Mia can be correct because 12 is the least common denominator.", "Only Noah can be correct because a larger denominator is more accurate.", "Neither denominator can be used."], "a": "A"}, {"q": "Counterexample to \"when adding two positive fractions, the sum must be less than 1 if both fractions are less than 1\":", "o": ["1/4+1/3=7/12", "2/5+1/4=13/20", "3/8+2/5=31/40", "5/6+3/4=1 7/12"], "a": "D"}];let i=0,score=0,answered=false;const num=document.getElementById('num'),total=document.getElementById('total'),scoreEl=document.getElementById('score'),bar=document.getElementById('bar'),q=document.getElementById('question'),opts=document.getElementById('options'),fb=document.getElementById('feedback'),next=document.getElementById('next');total.textContent=DATA.length;
function render(){answered=false;const x=DATA[i];num.textContent=i+1;scoreEl.textContent=score;bar.style.width=((i+1)/DATA.length*100)+'%';q.textContent=x.q;fb.textContent='';next.style.display='none';opts.innerHTML='';x.o.forEach((v,j)=>{const L=String.fromCharCode(65+j),b=document.createElement('button');b.className='choice';b.dataset.letter=L;b.textContent=L+'. '+v;b.onclick=()=>pick(b,x);opts.appendChild(b)})}
function pick(el,x){if(answered)return;answered=true;document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;if(b.dataset.letter===x.a)b.classList.add('correct')});if(el.dataset.letter===x.a){score++;scoreEl.textContent=score;fb.textContent='✓ Correct!'}else{el.classList.add('wrong');fb.textContent='Correct answer: '+x.a}next.textContent=i===DATA.length-1?'See Result':'Next Question';next.style.display='inline-block'}
next.onclick=()=>{if(i<DATA.length-1){i++;render()}else{q.innerHTML='<h2>Practice complete!</h2><p>Your score: <strong>'+score+'/'+DATA.length+'</strong></p>';opts.innerHTML='';fb.textContent='';next.style.display='none';bar.style.width='100%'}};render();
</script></body></html>
