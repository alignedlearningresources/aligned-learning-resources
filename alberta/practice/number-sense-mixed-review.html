<body><a class="back" href="../index.html">← Back to Number</a><header><div class="brand">Canadian Math Practice</div><div class="meta">Alberta • Grade 6</div></header><div class="wrap"><div class="crumb">Grade 6 › Number › Alberta Number Mixed Review</div><h1>Alberta Number Mixed Review</h1><p class="lead">30 cumulative questions focused on Alberta Grade 6 Number outcomes.</p><section class="card"><div class="top"><strong>Alberta Number Mixed Review</strong><span>Question <b id="n">1</b>/30 • Score <b id="score">0</b></span></div><div class="progress"><div class="fill" id="fill"></div></div><div class="q" id="q"></div><div class="options" id="opts"></div><div class="feedback" id="fb"></div><div class="why" id="why"></div><button class="next" id="next" onclick="nextQ()" style="display:none">Next Question</button></section></div>
<script>
let i=0,score=0,answered=false;
const D=[{"q":"Which number is divisible by 3?","a":"4,536","o":["4,525","4,536","4,541","4,552"],"w":"4+5+3+6=18, which is divisible by 3."},{"q":"What is the prime factorization of 84?","a":"2² × 3 × 7","o":["2 × 42","2² × 3 × 7","4 × 21","2 × 3 × 14"],"w":"84 = 2 × 2 × 3 × 7."},{"q":"What is 3⁴?","a":"81","o":["12","27","64","81"],"w":"3 × 3 × 3 × 3 = 81."},{"q":"Evaluate 2³ + 6 × 4.","a":"32","o":["28","30","32","56"],"w":"2³=8; then 8+24=32."},{"q":"What is 608,405 − 279,968?","a":"328,437","o":["327,437","328,437","338,437","388,437"],"w":"Use the standard subtraction algorithm."},{"q":"What is 2,406 × 35?","a":"84,210","o":["72,180","82,210","84,210","842,100"],"w":"2,406×30 + 2,406×5 = 84,210."},{"q":"What is 8,064 ÷ 32?","a":"252","o":["242","252","262","272"],"w":"32 × 252 = 8,064."},{"q":"What is 36.508 + 9.794?","a":"46.302","o":["45.302","46.302","46.312","463.02"],"w":"Align decimal points and add."},{"q":"What is 54.2 − 17.856?","a":"36.344","o":["36.244","36.344","37.344","363.44"],"w":"54.200 − 17.856 = 36.344."},{"q":"What is 128 × 0.7?","a":"89.6","o":["8.96","89.6","128.7","896"],"w":"128 × 0.7 = 89.6."},{"q":"What is 96 ÷ 0.8?","a":"120","o":["12","76.8","120","1,200"],"w":"96 ÷ 0.8 = 120."},{"q":"What is 5.46 ÷ 7?","a":"0.78","o":["0.078","0.78","7.8","78"],"w":"5.46 ÷ 7 = 0.78."},{"q":"Which fraction is equivalent to 3/4?","a":"9/12","o":["6/10","8/12","9/12","12/15"],"w":"Multiply numerator and denominator by 3."},{"q":"Which is greater?","a":"5/6","o":["3/4","5/6","They are equal","Cannot tell"],"w":"3/4=9/12 and 5/6=10/12."},{"q":"Convert 11/4 to a mixed number.","a":"2 3/4","o":["2 1/4","2 3/4","3 1/4","4 2/3"],"w":"11 ÷ 4 = 2 remainder 3."},{"q":"What is 2/3 + 3/5?","a":"1 4/15","o":["5/8","1 1/15","1 4/15","1 5/8"],"w":"10/15 + 9/15 = 19/15 = 1 4/15."},{"q":"What is 1 3/4 − 2/5?","a":"1 7/20","o":["1 1/20","1 7/20","1 9/20","1 13/20"],"w":"1 15/20 − 8/20 = 1 7/20."},{"q":"What is 6 × 5/8?","a":"3 3/4","o":["2 3/4","3 1/4","3 3/4","4 1/4"],"w":"30/8 = 15/4 = 3 3/4."},{"q":"What is −8 + 13?","a":"5","o":["−21","−5","5","21"],"w":"13−8=5, positive because 13 has greater magnitude."},{"q":"What is −11 + (−7)?","a":"−18","o":["−18","−4","4","18"],"w":"Add magnitudes and keep the negative sign."},{"q":"Which pair are additive inverses?","a":"−16 and 16","o":["−16 and −16","−16 and 0","−16 and 16","16 and 32"],"w":"Additive inverses have equal magnitude and opposite signs."},{"q":"Which is the correct order from least to greatest?","a":"−9, −2, 0, 4","o":["−2, −9, 0, 4","−9, −2, 0, 4","0, −2, −9, 4","4, 0, −2, −9"],"w":"More negative integers lie farther left on the number line."},{"q":"There are 6 red and 9 blue tiles. What is the simplified ratio red:blue?","a":"2:3","o":["2:3","3:2","6:15","9:6"],"w":"6:9 simplifies to 2:3."},{"q":"A ratio is 4:7. If the first quantity is 12, what is the second?","a":"21","o":["15","18","21","28"],"w":"Multiply both terms by 3: 4:7 → 12:21."},{"q":"Which decimal equals 45%?","a":"0.45","o":["0.045","0.45","4.5","45"],"w":"45%=45/100=0.45."},{"q":"Which fraction equals 60%?","a":"3/5","o":["2/5","3/5","3/4","6/5"],"w":"60/100 simplifies to 3/5."},{"q":"A 100-square grid has 72 shaded squares. What percent is shaded?","a":"72%","o":["28%","72%","100%","172%"],"w":"72 out of 100 is 72%."},{"q":"Which estimate best checks 3,986 × 21?","a":"About 80,000","o":["About 8,000","About 40,000","About 80,000","About 800,000"],"w":"4,000 × 20 ≈ 80,000."},{"q":"A 7.2-L jug fills 8 equal bottles. How much is in each bottle?","a":"0.9 L","o":["0.09 L","0.8 L","0.9 L","9 L"],"w":"7.2 ÷ 8 = 0.9."},{"q":"A class needs 3/5 m of string for each of 15 projects. How much string is needed?","a":"9 m","o":["3 m","5 m","9 m","25 m"],"w":"15 × 3/5 = 9 m."}];
const n=document.getElementById("n"),sc=document.getElementById("score"),fill=document.getElementById("fill"),q=document.getElementById("q"),opts=document.getElementById("opts"),fb=document.getElementById("fb"),why=document.getElementById("why"),next=document.getElementById("next");
function render(){answered=false;let x=D[i];n.textContent=i+1;sc.textContent=score;fill.style.width=(((i+1)/30)*100)+"%";q.textContent=x.q;fb.textContent="";why.textContent="";next.style.display="none";opts.innerHTML=[...x.o].sort(()=>Math.random()-.5).map(v=>`<button class="opt" data-v="${v}" onclick="pick(this)">${v}</button>`).join("")}
function pick(el){if(answered)return;answered=true;document.querySelectorAll(".opt").forEach(b=>b.disabled=true);let x=D[i];if(el.dataset.v===x.a){score++;sc.textContent=score;fb.textContent="✓ Correct!"}else fb.textContent="✗ Not quite. Correct answer: "+x.a;why.textContent=x.w;next.textContent=i===29?"See Result":"Next Question";next.style.display="inline-block"}
function nextQ(){if(i<29){i++;render()}else{q.textContent="Practice complete!";opts.innerHTML="";fb.textContent=`Your score: ${score}/30`;why.textContent=score>=25?"Excellent cumulative Number work.":score>=20?"Good work. Review the explanations for the skills you missed.":"Use the explanations to identify which Number skills need more practice.";next.style.display="none"}}render();</script></body></html>
