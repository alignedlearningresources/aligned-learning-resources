<script>
const DATA=[{"q":"864 ÷ 6 =","o":["145","143","154","144"],"a":"D"},{"q":"936 ÷ 8 =","o":["127","117","118","116"],"a":"B"},{"q":"735 ÷ 5 =","o":["148","146","157","147"],"a":"D"},{"q":"924 ÷ 7 =","o":["142","132","133","131"],"a":"B"},{"q":"816 ÷ 4 =","o":["204","205","203","214"],"a":"A"},{"q":"672 ÷ 3 =","o":["234","224","225","223"],"a":"B"},{"q":"945 ÷ 9 =","o":["105","106","104","115"],"a":"A"},{"q":"1248 ÷ 6 =","o":["218","208","209","207"],"a":"B"},{"q":"1536 ÷ 8 =","o":["193","191","202","192"],"a":"D"},{"q":"1715 ÷ 5 =","o":["344","342","353","343"],"a":"D"}];let i=0,score=0,answered=false;const num=document.getElementById('num'),total=document.getElementById('total'),scoreEl=document.getElementById('score'),bar=document.getElementById('bar'),q=document.getElementById('question'),opts=document.getElementById('options'),fb=document.getElementById('feedback'),next=document.getElementById('next');total.textContent=DATA.length;
