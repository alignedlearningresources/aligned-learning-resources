<body><a class="back" href="../index.html">← Back to Number</a><header><div class="brand">Canadian Math Practice</div><div class="meta">Alberta • Grade 6</div></header><div class="wrap"><div class="crumb">Grade 6 › Number › Divisibility Tests</div><h1>Divisibility Tests</h1><p class="lead">Use divisibility tests to identify factors and analyze natural numbers.</p><section class="card"><div class="top"><strong>Divisibility Tests Practice</strong><span>Question <b id="n">1</b>/10 • Score <b id="score">0</b></span></div><div class="progress"><div class="fill" id="fill"></div></div><div class="q" id="q"></div><div class="options" id="opts"></div><div class="feedback" id="fb"></div><div class="why" id="why"></div><button class="next" id="next" onclick="nextQ()" style="display:none">Next Question</button></section></div>
<script>
let i=0,score=0,answered=false;
const D=[{"q":"Which number is divisible by 2?","a":"146","o":["135","146","217","329"],"w":"A number divisible by 2 has an even ones digit."},{"q":"Which number is divisible by 5?","a":"375","o":["372","374","375","378"],"w":"Numbers divisible by 5 end in 0 or 5."},{"q":"Which number is divisible by 10?","a":"4,230","o":["4,203","4,213","4,230","4,235"],"w":"Numbers divisible by 10 end in 0."},{"q":"Which number is divisible by 3?","a":"624","o":["611","617","624","631"],"w":"6 + 2 + 4 = 12, and 12 is divisible by 3."},{"q":"Which number is divisible by 9?","a":"729","o":["718","724","729","734"],"w":"7 + 2 + 9 = 18, and 18 is divisible by 9."},{"q":"A teacher has 234 counters. Can they be shared equally among 3 groups?","a":"Yes","o":["Yes","No","Only if one counter is removed","Only if one counter is added"],"w":"2 + 3 + 4 = 9, and 9 is divisible by 3, so 234 is divisible by 3."},{"q":"Which number is divisible by both 2 and 5?","a":"470","o":["465","470","475","481"],"w":"A number divisible by both 2 and 5 must end in 0."},{"q":"Which number is divisible by 6?","a":"438","o":["425","432","438","445"],"w":"438 is even and its digit sum is 15, so it is divisible by both 2 and 3."},{"q":"Which statement is true about 3,240?","a":"It is divisible by 2, 3, 5, 6, 9, and 10.","o":["It is divisible only by 2 and 5.","It is divisible by 2, 3, 5, 6, 9, and 10.","It is not divisible by 9.","It is divisible by 10 but not by 5."],"w":"3,240 is even, ends in 0, and its digit sum is 9."},{"q":"A number is divisible by 3 and by 5. Which number could it be?","a":"345","o":["322","335","345","352"],"w":"345 ends in 5 and its digit sum is 12, so it is divisible by both 5 and 3."}];
const n=document.getElementById("n"),sc=document.getElementById("score"),fill=document.getElementById("fill"),q=document.getElementById("q"),opts=document.getElementById("opts"),fb=document.getElementById("fb"),why=document.getElementById("why"),next=document.getElementById("next");
function render(){answered=false;let x=D[i];n.textContent=i+1;sc.textContent=score;fill.style.width=((i+1)*10)+"%";q.textContent=x.q;fb.textContent="";why.textContent="";next.style.display="none";opts.innerHTML=[...x.o].sort(()=>Math.random()-.5).map(v=>`<button class="opt" data-v="${v}" onclick="pick(this)">${v}</button>`).join("")}
function pick(el){if(answered)return;answered=true;document.querySelectorAll(".opt").forEach(b=>b.disabled=true);let x=D[i];if(el.dataset.v===x.a){score++;sc.textContent=score;fb.textContent="✓ Correct!"}else fb.textContent="✗ Not quite. Correct answer: "+x.a;why.textContent=x.w;next.textContent=i===9?"See Result":"Next Question";next.style.display="inline-block"}
function nextQ(){if(i<9){i++;render()}else{q.textContent="Practice complete!";opts.innerHTML="";fb.textContent=`Your score: ${score}/10`;why.textContent=score>=8?"Strong divisibility reasoning.":"Review the divisibility tests and try again.";next.style.display="none"}}render();</script></body></html>
