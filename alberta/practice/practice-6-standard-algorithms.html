<script>const DATA=[{"q": "246,315 + 132,408 = ?", "o": ["368,723", "378,623", "378,723", "388,723"], "a": "C"}, {"q": "584,726 − 231,415 = ?", "o": ["353,311", "353,211", "363,311", "355,311"], "a": "A"}, {"q": "408,596 + 76,825 = ?", "o": ["475,421", "485,321", "485,421", "495,421"], "a": "C"}, {"q": "700,000 − 286,457 = ?", "o": ["413,543", "414,543", "423,543", "486,457"], "a": "A"}, {"q": "38.472 + 16.305 = ?", "o": ["44.777", "54.777", "54.877", "55.777"], "a": "B"}, {"q": "72.600 − 28.347 = ?", "o": ["43.253", "44.253", "44.353", "45.253"], "a": "B"}, {"q": "9.785 + 4.69 = ?", "o": ["13.475", "14.375", "14.475", "14.575"], "a": "C"}, {"q": "50 − 17.836 = ?", "o": ["32.164", "32.264", "33.164", "42.164"], "a": "A"}, {"q": "A student calculates 24.608 + 7.35 = 25.343. What is the most likely mistake?", "o": ["The decimal points were not aligned by place value.", "The student should have subtracted.", "Zero cannot be used as a placeholder.", "Decimals cannot be added using a standard algorithm."], "a": "A"}, {"q": "Which is the best estimate for 398,725 + 204,186?", "o": ["400,000", "500,000", "600,000", "700,000"], "a": "C"}, {"q": "Two fundraisers collected $18,475.65 and $9,826.40. How much did they collect altogether?", "o": ["$27,302.05", "$28,202.05", "$28,302.05", "$28,312.05"], "a": "C"}, {"q": "A warehouse had 425,600 items and shipped 178,945. How many remain?", "o": ["246,655", "247,655", "256,655", "604,545"], "a": "A"}, {"q": "A trail is 36.825 km long. A hiker has completed 18.947 km. How much remains?", "o": ["17.878 km", "17.978 km", "18.878 km", "55.772 km"], "a": "A"}, {"q": "Liam calculates 612,408 − 297,856 = 314,552. Which estimate supports the reasonableness of his answer?", "o": ["600,000 − 300,000 ≈ 300,000", "600,000 − 300,000 ≈ 900,000", "600,000 + 300,000 ≈ 300,000", "300,000 − 600,000 ≈ 300,000"], "a": "A"}, {"q": "A project has a budget of $125,000.00. It spends $48,735.60 and $27,489.85. How much remains?", "o": ["$47,774.55", "$48,774.55", "$48,775.45", "$49,774.55"], "a": "B"}];let i=0,score=0,answered=false;const num=document.getElementById('num'),total=document.getElementById('total'),scoreEl=document.getElementById('score'),bar=document.getElementById('bar'),q=document.getElementById('question'),opts=document.getElementById('options'),fb=document.getElementById('feedback'),next=document.getElementById('next');total.textContent=DATA.length;function render(){answered=false;const x=DATA[i];num.textContent=i+1;scoreEl.textContent=score;bar.style.width=((i+1)/DATA.length*100)+'%';q.textContent=x.q;fb.textContent='';next.style.display='none';opts.innerHTML='';x.o.forEach((v,j)=>{const L=String.fromCharCode(65+j),b=document.createElement('button');b.className='choice';b.dataset.letter=L;b.textContent=L+'. '+v;b.onclick=()=>pick(b,x);opts.appendChild(b)})}function pick(el,x){if(answered)return;answered=true;document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;if(b.dataset.letter===x.a)b.classList.add('correct')});if(el.dataset.letter===x.a){score++;scoreEl.textContent=score;fb.textContent='✓ Correct!'}else{el.classList.add('wrong');fb.textContent='Correct answer: '+x.a}next.textContent=i===DATA.length-1?'See Result':'Next Question';next.style.display='inline-block'}next.onclick=()=>{if(i<DATA.length-1){i++;render()}else{q.innerHTML='<h2>Practice complete!</h2><p>Your score: <strong>'+score+'/'+DATA.length+'</strong></p>';opts.innerHTML='';fb.textContent='';next.style.display='none';bar.style.width='100%'}};render();</script></body></html>
