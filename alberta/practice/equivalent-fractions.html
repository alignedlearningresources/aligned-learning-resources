<body><a class="back" href="../index.html">← Back to Number</a><header><div class="brand">Canadian Math Practice</div><div class="meta">Alberta • Grade 6</div></header><div class="wrap"><div class="crumb">Grade 6 › Number › Equivalent Fractions</div><h1>Equivalent Fractions</h1><p class="lead">Recognize, generate, and reason about fractions that represent the same amount.</p><section class="card"><div class="top"><strong>Equivalent Fractions Practice</strong><span>Question <b id="n">1</b>/10 • Score <b id="score">0</b></span></div><div class="progress"><div class="fill" id="fill"></div></div><div class="q" id="q"></div><div class="options" id="opts"></div><div class="feedback" id="fb"></div><div class="why" id="why"></div><button class="next" id="next" onclick="nextQ()" style="display:none">Next Question</button></section></div>
<script>
let i=0,score=0,answered=false;
const D=[
{q:"Which fraction is equivalent to 1/2?",a:"3/6",o:["2/3","3/6","4/10","5/12"],w:"Multiplying 1/2 by 3/3 gives 3/6."},
{q:"Complete the equivalent fraction: 2/3 = ___/12",a:"8",o:["6","8","9","10"],w:"The denominator was multiplied by 4, so multiply the numerator by 4: 2 × 4 = 8."},
{q:"Which fraction is NOT equivalent to 3/4?",a:"9/16",o:["6/8","9/12","12/16","9/16"],w:"3/4 × 4/4 = 12/16. But 9/16 is not equal to 3/4."},
{q:"Which pair of fractions is equivalent?",a:"5/6 and 20/24",o:["5/6 and 20/24","3/5 and 9/20","4/7 and 12/28","7/8 and 14/18"],w:"Multiplying 5/6 by 4/4 gives 20/24."},
{q:"What number makes the statement true? 7/9 = 35/___",a:"45",o:["36","40","45","54"],w:"7 was multiplied by 5 to get 35, so 9 must also be multiplied by 5: 9 × 5 = 45."},
{q:"Which fraction is equivalent to 18/24 and written in simplest form?",a:"3/4",o:["2/3","3/4","6/8","9/12"],w:"Divide both 18 and 24 by their greatest common factor, 6: 18/24 = 3/4."},
{q:"A student says 12/18 = 4/5 because both numbers were made smaller. What is the correct simplest form of 12/18?",a:"2/3",o:["2/3","3/4","4/5","6/9"],w:"Equivalent fractions require dividing numerator and denominator by the same factor. 12 ÷ 6 = 2 and 18 ÷ 6 = 3."},
{q:"Which fraction could replace the box? 4/5 = □/35",a:"28/35",o:["20/35","24/35","28/35","30/35"],w:"5 × 7 = 35, so 4 × 7 = 28."},
{q:"Lina drank 6/8 of a bottle of water. Noah drank 9/12 of an identical bottle. Which statement is true?",a:"They drank the same amount.",o:["Lina drank more.","Noah drank more.","They drank the same amount.","There is not enough information."],w:"6/8 and 9/12 both simplify to 3/4, so the amounts are equal."},
{q:"A fraction equivalent to 5/8 has a numerator of 35. What is its denominator?",a:"56",o:["40","48","56","64"],w:"5 × 7 = 35, so multiply the denominator by the same factor: 8 × 7 = 56."}
];
const n=document.getElementById("n"),sc=document.getElementById("score"),fill=document.getElementById("fill"),q=document.getElementById("q"),opts=document.getElementById("opts"),fb=document.getElementById("fb"),why=document.getElementById("why"),next=document.getElementById("next");
function render(){answered=false;let x=D[i];n.textContent=i+1;sc.textContent=score;fill.style.width=((i+1)*10)+"%";q.textContent=x.q;fb.textContent="";why.textContent="";next.style.display="none";opts.innerHTML=[...x.o].sort(()=>Math.random()-.5).map(v=>`<button class="opt" data-v="${v}" onclick="pick(this)">${v}</button>`).join("")}
function pick(el){if(answered)return;answered=true;document.querySelectorAll(".opt").forEach(b=>b.disabled=true);let x=D[i];if(el.dataset.v===x.a){score++;sc.textContent=score;fb.textContent="✓ Correct!"}else fb.textContent="✗ Not quite. Correct answer: "+x.a;why.textContent=x.w;next.textContent=i===9?"See Result":"Next Question";next.style.display="inline-block"}
function nextQ(){if(i<9){i++;render()}else{q.textContent="Practice complete!";opts.innerHTML="";fb.textContent=`Your score: ${score}/10`;why.textContent=score>=8?"Strong work with equivalent fractions.":"Try again: multiply or divide the numerator and denominator by the same non-zero number.";next.style.display="none"}}render();</script></body></html>
