<h1 style="font-size:40px;color:var(--navy);margin:18px 0 8px">Practice 28 — Ratios: Part-Part &amp; Part-Whole</h1><p style="color:var(--muted);font-size:17px;margin:0 0 24px">10-question Alberta Grade 6 Number practice with immediate feedback.</p>
<section class="quiz-card"><div class="quiz-meta"><strong>10 Questions</strong><span>Question <b id="num">1</b>/<b id="total"></b> · Score <b id="score">0</b></span></div><div class="progress"><div id="bar"></div></div><div class="question" id="question"></div><div class="options" id="options"></div><div class="feedback" id="feedback"></div><button class="next" id="next">Next Question</button></section></main>
<script>
const DATA=[{"q": "A basket has 3 red apples and 5 green apples. What is the ratio of red apples to green apples?", "o": ["3:5", "5:3", "3:8", "5:8"], "a": "A"}, {"q": "There are 4 blue markers and 6 black markers. What is the ratio of blue markers to all markers?", "o": ["4:6", "6:10", "4:10", "10:4"], "a": "C"}, {"q": "There are 7 cats and 3 dogs. What is the ratio of dogs to cats?", "o": ["7:3", "3:7", "3:10", "7:10"], "a": "B"}, {"q": "A bag contains 5 yellow counters and 8 purple counters. Which is a part-to-whole ratio?", "o": ["yellow : purple = 5:8", "purple : yellow = 8:5", "yellow : all = 5:13", "all : purple = 13:8"], "a": "C"}, {"q": "A class has 12 girls and 8 boys. What is the ratio of boys to the whole class?", "o": ["8:12", "12:20", "12:8", "8:20"], "a": "D"}, {"q": "The ratio of pencils to pens is 4:9. What does this mean?", "o": ["There are exactly 13 items in total.", "For every 4 pencils, there are 9 pens.", "For every 9 pencils, there are 4 pens.", "There are always exactly 5 more pens than pencils."], "a": "B"}, {"q": "A fruit bowl contains 6 oranges, 4 apples, and 2 pears. What is the ratio of apples to all fruit?", "o": ["4:8", "4:12", "6:12", "2:12"], "a": "B"}, {"q": "There are 9 soccer players and 6 basketball players. Which pair of ratios is correct?", "o": ["soccer:basketball = 6:9; soccer:total = 9:15", "soccer:basketball = 9:15; basketball:total = 6:9", "soccer:total = 6:15; basketball:total = 9:15", "soccer:basketball = 9:6; basketball:total = 6:15"], "a": "D"}, {"q": "A jar contains 5 red, 7 blue, and 3 white counters. What is the ratio of blue counters to counters that are not blue?", "o": ["7:8", "7:15", "8:7", "5:10"], "a": "A"}, {"q": "A student says that with 4 red and 6 blue counters, the ratio of red counters to all counters is 4:6. What is the student's mistake?", "o": ["The student reversed the order.", "Ratios cannot compare colours.", "The student should subtract 4 from 6.", "The student compared red to blue instead of red to the total."], "a": "D"}];let i=0,score=0,answered=false;const num=document.getElementById('num'),total=document.getElementById('total'),scoreEl=document.getElementById('score'),bar=document.getElementById('bar'),q=document.getElementById('question'),opts=document.getElementById('options'),fb=document.getElementById('feedback'),next=document.getElementById('next');total.textContent=DATA.length;
function render(){answered=false;const x=DATA[i];num.textContent=i+1;scoreEl.textContent=score;bar.style.width=((i+1)/DATA.length*100)+'%';q.textContent=x.q;fb.textContent='';next.style.display='none';opts.innerHTML='';x.o.forEach((v,j)=>{const L=String.fromCharCode(65+j),b=document.createElement('button');b.className='choice';b.dataset.letter=L;b.textContent=L+'. '+v;b.onclick=()=>pick(b,x);opts.appendChild(b)})}
function pick(el,x){if(answered)return;answered=true;document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;if(b.dataset.letter===x.a)b.classList.add('correct')});if(el.dataset.letter===x.a){score++;scoreEl.textContent=score;fb.textContent='✓ Correct!'}else{el.classList.add('wrong');fb.textContent='Correct answer: '+x.a}next.textContent=i===DATA.length-1?'See Result':'Next Question';next.style.display='inline-block'}
next.onclick=()=>{if(i<DATA.length-1){i++;render()}else{q.innerHTML='<h2>Practice complete!</h2><p>Your score: <strong>'+score+'/'+DATA.length+'</strong></p>';opts.innerHTML='';fb.textContent='';next.style.display='none';bar.style.width='100%'}};render();
</script></body></html>
