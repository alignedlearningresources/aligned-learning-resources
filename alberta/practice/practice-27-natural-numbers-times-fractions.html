<h1 style="font-size:40px;color:var(--navy);margin:18px 0 8px">Practice 27 — Natural Numbers × Fractions</h1><p style="color:var(--muted);font-size:17px;margin:0 0 24px">15-question Alberta Grade 6 Number practice with immediate feedback.</p>
<section class="quiz-card"><div class="quiz-meta"><strong>15 Questions</strong><span>Question <b id="num">1</b>/<b id="total"></b> · Score <b id="score">0</b></span></div><div class="progress"><div id="bar"></div></div><div class="question" id="question"></div><div class="options" id="options"></div><div class="feedback" id="feedback"></div><button class="next" id="next">Next Question</button></section></main>
<script>
const DATA=[{"q": "Which expression represents 1/4 + 1/4 + 1/4?", "o": ["1 × 3/4", "3 × 1/4", "4 × 1/3", "3 + 1/4"], "a": "B"}, {"q": "Calculate 4 × 1/5.", "o": ["4/5", "1/20", "5/4", "4/9"], "a": "A"}, {"q": "Calculate 3 × 2/7.", "o": ["5/7", "6/21", "6/7", "2/21"], "a": "C"}, {"q": "What is 1/4 of 20?", "o": ["4", "8", "16", "5"], "a": "D"}, {"q": "What is 3/5 of 20?", "o": ["8", "12", "10", "15"], "a": "B"}, {"q": "Which equation shows why 1/6 of 30 relates to division?", "o": ["30 × 6", "30 + 6", "30 ÷ 6 = 5", "30 − 6"], "a": "C"}, {"q": "Write 5 × 3/8 as a mixed number in simplest form.", "o": ["1 7/8", "1 3/8", "2 1/8", "1 5/8"], "a": "A"}, {"q": "A class has 24 students. 3/4 brought a library book. How many students brought a book?", "o": ["6", "12", "21", "18"], "a": "D"}, {"q": "One lap is 2/5 km. Maya runs 6 laps. What distance does she run?", "o": ["1 2/5 km", "2 2/5 km", "2 3/5 km", "3 1/5 km"], "a": "B"}, {"q": "Noah finds 2/3 of 18 by calculating 18 ÷ 3 and then multiplying by 2. Which statement is correct?", "o": ["His method is correct, but the answer is 6.", "He should divide by 2.", "He should add 2 + 3.", "His method is correct, and the answer is 12."], "a": "D"}, {"q": "Which situation is best represented by 7 × 3/4?", "o": ["A 7 m ribbon divided into 4 equal parts", "Seven pieces that are each 3/4 m long", "3 m divided among 4 people", "Seven pieces with a total length of 3/4 m"], "a": "B"}, {"q": "A gardener has 32 plants. 5/8 are planted in the front garden. How many plants is that?", "o": ["12", "16", "20", "24"], "a": "C"}, {"q": "A student calculates 4 × 2/3 = 8/12. What is the error?", "o": ["The student multiplied both the numerator and denominator by 4.", "The student should add 4 to the numerator.", "The student should divide the denominator by 4.", "The student should invert the fraction."], "a": "A"}, {"q": "A school has 45 notebooks and gives 4/5 of them to Grade 6 students. How many notebooks are given to Grade 6?", "o": ["32", "35", "36", "40"], "a": "C"}, {"q": "Which is a counterexample to the statement, \"A natural number multiplied by a fraction less than 1 is always less than 1\"?", "o": ["2 × 1/4 = 1/2", "3 × 1/5 = 3/5", "4 × 1/8 = 1/2", "5 × 2/3 = 3 1/3"], "a": "D"}];let i=0,score=0,answered=false;const num=document.getElementById('num'),total=document.getElementById('total'),scoreEl=document.getElementById('score'),bar=document.getElementById('bar'),q=document.getElementById('question'),opts=document.getElementById('options'),fb=document.getElementById('feedback'),next=document.getElementById('next');total.textContent=DATA.length;
function render(){answered=false;const x=DATA[i];num.textContent=i+1;scoreEl.textContent=score;bar.style.width=((i+1)/DATA.length*100)+'%';q.textContent=x.q;fb.textContent='';next.style.display='none';opts.innerHTML='';x.o.forEach((v,j)=>{const L=String.fromCharCode(65+j),b=document.createElement('button');b.className='choice';b.dataset.letter=L;b.textContent=L+'. '+v;b.onclick=()=>pick(b,x);opts.appendChild(b)})}
function pick(el,x){if(answered)return;answered=true;document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;if(b.dataset.letter===x.a)b.classList.add('correct')});if(el.dataset.letter===x.a){score++;scoreEl.textContent=score;fb.textContent='✓ Correct!'}else{el.classList.add('wrong');fb.textContent='Correct answer: '+x.a}next.textContent=i===DATA.length-1?'See Result':'Next Question';next.style.display='inline-block'}
next.onclick=()=>{if(i<DATA.length-1){i++;render()}else{q.innerHTML='<h2>Practice complete!</h2><p>Your score: <strong>'+score+'/'+DATA.length+'</strong></p>';opts.innerHTML='';fb.textContent='';next.style.display='none';bar.style.width='100%'}};render();
</script></body></html>
