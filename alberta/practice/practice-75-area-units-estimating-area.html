const DATA=[{"q":"A classroom floor is about 8 m by 6 m. Which unit is most appropriate for its area?","o":["m³","cm²","m","m²"],"a":"D"},{"q":"A postage stamp is about 3 cm by 2 cm. What is a reasonable area?","o":["60 m²","60 cm²","6 cm²","6 m²"],"a":"C"},{"q":"A rectangular mat is 5 units by 4 units. A student estimates its area as 9 square units. What error did the student make?","o":["Added the side lengths instead of multiplying.","Multiplied twice.","Used cubic units.","Subtracted the side lengths."],"a":"A"},{"q":"A notebook cover is 30 cm by 20 cm. Which area is reasonable?","o":["600 cm²","6 cm²","60 cm²","6,000 cm²"],"a":"A"},{"q":"A desktop is about 1.2 m by 0.6 m. Which estimate is closest to its area?","o":["720 m²","72 m²","0.72 m²","7.2 m²"],"a":"C"},{"q":"A square metre contains 10,000 square centimetres. Which statement explains why?","o":["100 cm + 100 cm = 200 cm²","100 cm × 100 cm = 10,000 cm²","Area uses cubic units","1 m = 10 cm"],"a":"B"},{"q":"A rectangular garden is 9 m by 4 m. Which value is its area, not its perimeter?","o":["72 m²","36 m²","13 m","26 m"],"a":"B"},{"q":"A label says a floor has an area of 48 m. What should be corrected?","o":["m should be m²","48 should be 4.8","m should be cm","Area should use m³"],"a":"A"},{"q":"Two rectangles are 7 cm by 3 cm and 6 cm by 4 cm. Which has the greater area?","o":["Cannot be determined.","They have equal area.","7 cm by 3 cm","6 cm by 4 cm"],"a":"D"},{"q":"A wall is 4 m high and 5 m wide. Paint covers 1 m² per unit. How many units are needed for one coat?","o":["9","20","18","40"],"a":"B"}];let i=0,score=0,answered=false;const num=document.getElementById('num'),total=document.getElementById('total'),scoreEl=document.getElementById('score'),bar=document.getElementById('bar'),q=document.getElementById('question'),visual=document.getElementById('visual'),opts=document.getElementById('options'),fb=document.getElementById('feedback'),next=document.getElementById('next');total.textContent=DATA.length;const countEl=document.getElementById('count');if(countEl)countEl.textContent=DATA.length;
function render(){answered=false;const x=DATA[i];num.textContent=i+1;scoreEl.textContent=score;bar.style.width=((i+1)/DATA.length*100)+'%';q.textContent=x.q;visual.innerHTML=MEAS_VISUAL(i);fb.textContent='';next.style.display='none';opts.innerHTML='';x.o.forEach((v,j)=>{const L=String.fromCharCode(65+j),b=document.createElement('button');b.className='choice';b.dataset.letter=L;b.textContent=L+'. '+v;b.onclick=()=>pick(b,x);opts.appendChild(b)})}
function pick(el,x){if(answered)return;answered=true;document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;if(b.dataset.letter===x.a)b.classList.add('correct')});if(el.dataset.letter===x.a){score++;scoreEl.textContent=score;fb.textContent='✓ Correct!'}else{el.classList.add('wrong');fb.textContent='Correct answer: '+x.a}next.textContent=i===DATA.length-1?'See Result':'Next Question';next.style.display='inline-block'}
next.onclick=()=>{if(i<DATA.length-1){i++;render()}else{q.innerHTML='<h2>Practice complete!</h2><p>Your score: <strong>'+score+'/'+DATA.length+'</strong></p>';opts.innerHTML='';fb.textContent='';next.style.display='none';bar.style.width='100%'}};render();
</script></body></html>
