<main class="quiz-shell"><div class="quiz-top"><a class="backlink" href="../index.html#number">← Back to Number</a><span class="eyebrow">NUMBER • PRACTICE 7</span></div><h1 style="font-size:40px;color:var(--navy);margin:18px 0 8px">Practice 7 — Estimating &amp; Assessing Sums and Differences</h1><p style="color:var(--muted);font-size:17px;margin:0 0 24px">15-question Alberta Grade 6 Number practice with immediate feedback.</p><section class="quiz-card"><div class="quiz-meta"><strong>15 Questions</strong><span>Question <b id="num">1</b>/<b id="total"></b> · Score <b id="score">0</b></span></div><div class="progress"><div id="bar"></div></div><div class="question" id="question"></div><div class="options" id="options"></div><div class="feedback" id="feedback"></div><button class="next" id="next">Next Question</button></section></main>
<script>const DATA=[{"q": "Estimate the sum by rounding each number to the nearest thousand. 47,382 + 31,746", "o": ["78,000", "79,000", "80,000", "89,000"], "a": "B"}, {"q": "Estimate the difference by rounding each number to the nearest ten thousand. 683,419 − 247,805", "o": ["420,000", "430,000", "440,000", "450,000"], "a": "B"}, {"q": "Which is the best estimate for 298,750 + 503,420?", "o": ["700,000", "800,000", "900,000", "1,000,000"], "a": "B"}, {"q": "Estimate by rounding each decimal to the nearest whole number. 46.782 + 18.349", "o": ["64", "65", "66", "75"], "a": "B"}, {"q": "Estimate by rounding each decimal to the nearest whole number. 83.614 − 27.892", "o": ["54", "55", "56", "57"], "a": "C"}, {"q": "A student calculates 392,814 + 205,367 = 598,181. Which estimate best shows that the answer is reasonable?", "o": ["400,000 + 200,000 ≈ 600,000", "300,000 + 200,000 ≈ 500,000", "400,000 − 200,000 ≈ 200,000", "400,000 + 300,000 ≈ 700,000"], "a": "A"}, {"q": "Noah calculates 714,286 − 298,615 = 615,671. Which statement is best?", "o": ["The answer is reasonable because 700,000 − 300,000 ≈ 400,000.", "The answer is not reasonable because the difference should be about 400,000.", "The answer is reasonable because both numbers are less than 1,000,000.", "The answer is not reasonable because subtraction always gives a negative number."], "a": "B"}, {"q": "A store sold $12,846.75 worth of products on Friday and $7,193.40 on Saturday. Which is the best estimate of the total sales?", "o": ["$10,000", "$15,000", "$20,000", "$25,000"], "a": "C"}, {"q": "A hiking route is 64.728 km long. A group has completed 29.184 km. Which is the best estimate of the distance remaining?", "o": ["25 km", "35 km", "45 km", "55 km"], "a": "B"}, {"q": "Four students checked their calculations using estimation. Which calculation should be checked again?", "o": ["248,630 + 151,925 = 400,555", "603,480 − 198,725 = 404,755", "376,840 + 222,315 = 599,155", "724,560 − 318,790 = 505,770"], "a": "D"}, {"q": "A school has a budget of $96,450. It plans to spend $38,725 on technology and $26,180 on furniture. About how much of the budget will remain?", "o": ["$20,000", "$30,000", "$40,000", "$60,000"], "a": "B"}, {"q": "A student estimates 68.492 + 24.731 as 68 + 25 = 93. Which statement best describes the estimate?", "o": ["It is reasonable because the numbers were rounded to nearby whole numbers.", "It is unreasonable because decimals cannot be estimated.", "It must equal the exact sum.", "Both numbers should always be rounded down."], "a": "A"}, {"q": "A calculator shows 487,625 − 193,804 = 293,821. Which estimate provides the strongest evidence that this result is reasonable?", "o": ["500,000 − 200,000 ≈ 300,000", "400,000 − 100,000 ≈ 300,000", "500,000 + 200,000 ≈ 700,000", "200,000 − 500,000 ≈ −300,000"], "a": "A"}, {"q": "Two students estimate 451,280 + 247,690. Mia: 450,000 + 250,000 = 700,000 Leo: 500,000 + 200,000 = 700,000 Which statement is correct?", "o": ["Only Mia's estimate is reasonable.", "Only Leo's estimate is reasonable.", "Both estimates are reasonable and give the same estimated sum.", "Neither estimate is reasonable because estimates must be exact."], "a": "C"}, {"q": "A community project has a budget of $250,000. So far, it has spent $98,750 and $74,620. A manager says approximately $175,000 has been spent, so about $75,000 remains. Which statement best evaluates the manager's reasoning?", "o": ["It is reasonable because $100,000 + $75,000 ≈ $175,000 and $250,000 − $175,000 ≈ $75,000.", "It is unreasonable because the amount remaining should be about $175,000.", "It is unreasonable because both expenses should be rounded to $100,000.", "It is reasonable only if the exact amount spent is $175,000."], "a": "A"}];let i=0,score=0,answered=false;const num=document.getElementById('num'),total=document.getElementById('total'),scoreEl=document.getElementById('score'),bar=document.getElementById('bar'),q=document.getElementById('question'),opts=document.getElementById('options'),fb=document.getElementById('feedback'),next=document.getElementById('next');total.textContent=DATA.length;function render(){answered=false;const x=DATA[i];num.textContent=i+1;scoreEl.textContent=score;bar.style.width=((i+1)/DATA.length*100)+'%';q.textContent=x.q;fb.textContent='';next.style.display='none';opts.innerHTML='';x.o.forEach((v,j)=>{const L=String.fromCharCode(65+j),b=document.createElement('button');b.className='choice';b.dataset.letter=L;b.textContent=L+'. '+v;b.onclick=()=>pick(b,x);opts.appendChild(b)})}function pick(el,x){if(answered)return;answered=true;document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;if(b.dataset.letter===x.a)b.classList.add('correct')});if(el.dataset.letter===x.a){score++;scoreEl.textContent=score;fb.textContent='✓ Correct!'}else{el.classList.add('wrong');fb.textContent='Correct answer: '+x.a}next.textContent=i===DATA.length-1?'See Result':'Next Question';next.style.display='inline-block'}next.onclick=()=>{if(i<DATA.length-1){i++;render()}else{q.innerHTML='<h2>Practice complete!</h2><p>Your score: <strong>'+score+'/'+DATA.length+'</strong></p>';opts.innerHTML='';fb.textContent='';next.style.display='none';bar.style.width='100%'}};render();</script></body></html>
