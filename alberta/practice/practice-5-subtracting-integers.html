<script>const DATA=[{"q": "Which expression is equivalent to 8 − 3?", "o": ["8 + 3", "8 + (−3)", "−8 + 3", "−8 + (−3)"], "a": "B"}, {"q": "Which expression is equivalent to 6 − (−4)?", "o": ["6 + 4", "6 + (−4)", "−6 + 4", "−6 + (−4)"], "a": "A"}, {"q": "Which expression is equivalent to −7 − 5?", "o": ["−7 + 5", "7 + (−5)", "−7 + (−5)", "7 + 5"], "a": "C"}, {"q": "To rewrite subtraction as addition, what should you do?", "o": ["Add the inverse of the first number.", "Add the additive inverse of the number being subtracted.", "Change both numbers to positive numbers.", "Change both numbers to their additive inverses."], "a": "B"}, {"q": "9 − 14 = ?", "o": ["−23", "−5", "5", "23"], "a": "B"}, {"q": "−8 − 6 = ?", "o": ["−14", "−2", "2", "14"], "a": "A"}, {"q": "−11 − (−7) = ?", "o": ["−18", "−4", "4", "18"], "a": "B"}, {"q": "5 − (−9) = ?", "o": ["−14", "−4", "4", "14"], "a": "D"}, {"q": "−6 − (−10) = ?", "o": ["−16", "−4", "4", "16"], "a": "C"}, {"q": "A student rewrites −12 − (−5) as −12 + (−5). What is the error?", "o": ["−12 should be changed to +12.", "The additive inverse of −5 is +5, so the expression should be −12 + 5.", "Both numbers should be positive.", "There is no error."], "a": "B"}, {"q": "Complete: −4 − □ = −13", "o": ["−17", "−9", "9", "17"], "a": "C"}, {"q": "At sunrise the temperature is −3°C. Overnight it had fallen 5°C. Which expression gives the earlier temperature, and what is its value?", "o": ["−3 − 5 = −8", "−3 − 5 = −2", "−3 + 5 = 2", "3 + 5 = 8"], "a": "A"}, {"q": "One submarine is at −15 m and another is at −6 m. Which expression subtracts the second submarine's position from the first?", "o": ["−15 − (−6)", "−15 + (−6)", "15 − (−6)", "15 + 6"], "a": "A"}, {"q": "A student says −9 − (−12) = −21. Which explanation corrects the error?", "o": ["Subtracting −12 is the same as adding +12, so the answer is 3.", "Subtracting −12 is the same as adding −12.", "Change −9 to +9.", "Two negative numbers always give a negative answer."], "a": "A"}, {"q": "Which sequence correctly evaluates −18 − (−11)?", "o": ["−18 + (−11) = −29", "−18 + 11 = −7", "18 + (−11) = 7", "18 + 11 = 29"], "a": "B"}];let i=0,score=0,answered=false;const num=document.getElementById('num'),total=document.getElementById('total'),scoreEl=document.getElementById('score'),bar=document.getElementById('bar'),q=document.getElementById('question'),opts=document.getElementById('options'),fb=document.getElementById('feedback'),next=document.getElementById('next');total.textContent=DATA.length;function render(){answered=false;const x=DATA[i];num.textContent=i+1;scoreEl.textContent=score;bar.style.width=((i+1)/DATA.length*100)+'%';q.textContent=x.q;fb.textContent='';next.style.display='none';opts.innerHTML='';x.o.forEach((v,j)=>{const L=String.fromCharCode(65+j),b=document.createElement('button');b.className='choice';b.dataset.letter=L;b.textContent=L+'. '+v;b.onclick=()=>pick(b,x);opts.appendChild(b)})}function pick(el,x){if(answered)return;answered=true;document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;if(b.dataset.letter===x.a)b.classList.add('correct')});if(el.dataset.letter===x.a){score++;scoreEl.textContent=score;fb.textContent='✓ Correct!'}else{el.classList.add('wrong');fb.textContent='Correct answer: '+x.a}next.textContent=i===DATA.length-1?'See Result':'Next Question';next.style.display='inline-block'}next.onclick=()=>{if(i<DATA.length-1){i++;render()}else{q.innerHTML='<h2>Practice complete!</h2><p>Your score: <strong>'+score+'/'+DATA.length+'</strong></p>';opts.innerHTML='';fb.textContent='';next.style.display='none';bar.style.width='100%'}};render();</script></body></html>
