<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Cumulative Geometry review: symmetry, transformations, tessellations and congruence.">
<title>Practice 95 — Geometry Mixed Practice | Aligned Learning Resources</title><link rel="canonical" href="https://alignedlearningresources.ca/alberta/practice/practice-95-geometry-mixed.html">
<link rel="stylesheet" href="../site.css">
<style>
.quiz-shell{max-width:900px;margin:0 auto;padding:34px 24px 80px}
.quiz-top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:18px}
.backlink{text-decoration:none;color:var(--blue);font-weight:800}
.quiz-card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:28px;box-shadow:0 8px 30px rgba(18,35,63,.06)}
.quiz-meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:14px;font-weight:700}
.progress{height:9px;background:#e9eef6;border-radius:999px;overflow:hidden;margin:18px 0 28px}
.progress>div{height:100%;background:linear-gradient(90deg,var(--blue),var(--teal));width:0}
.question{font-size:24px;line-height:1.45;font-weight:800;color:var(--navy);white-space:pre-line}
.options{display:grid;gap:11px;margin-top:22px}
.choice{width:100%;text-align:left;background:#fff;border:1.5px solid #cfd9e8;border-radius:12px;padding:14px 16px;font-size:16px;line-height:1.4;cursor:pointer}
.choice:hover{border-color:var(--blue);background:#f7faff}
.choice[disabled]{cursor:default}
.choice.correct{border-color:#0f9f67;background:#edfdf5}
.choice.wrong{border-color:#d14343;background:#fff3f3}
.feedback{margin-top:18px;font-weight:850;min-height:24px}
.next{margin-top:16px;border:0;border-radius:10px;padding:11px 16px;background:var(--navy);color:#fff;font-weight:850;cursor:pointer;display:none}
.result{text-align:center;padding:16px 0}
.result h2{font-size:32px;color:var(--navy)}
@media(max-width:650px){.quiz-shell{padding:22px 14px 60px}.quiz-card{padding:20px}.question{font-size:20px}}
</style>
</head>
<body>
<header class="site-header"><nav class="nav"><a class="brand" href="../../index.html">Aligned Learning Resources</a><div class="navlinks"><a href="../../index.html">Home</a><a href="../index.html">Alberta</a><a href="../../ontario/index.html">Ontario</a></div></nav></header>
<main class="quiz-shell">
<div class="quiz-top"><a class="backlink" href="../index.html">← Back to Alberta Grade 6</a><span class="eyebrow">GEOMETRY • PRACTICE 95</span></div>
<h1 style="font-size:40px;color:var(--navy);margin:8px 0 8px">Practice 95 — Geometry Mixed Practice</h1>
<p style="font-size:17px;color:var(--muted);line-height:1.6;margin:0 0 24px">Cumulative Geometry review: symmetry, transformations, tessellations and congruence.</p>
<section class="quiz-card">
<div class="quiz-meta"><strong>Practice</strong><span>Question <b id="num">1</b>/<b id="total"></b> · Score <b id="score">0</b></span></div>
<div class="progress"><div id="bar"></div></div>
<div class="question" id="question"></div>
<div class="options" id="options"></div>
<div class="feedback" id="feedback"></div>
<button class="next" id="next">Next Question</button>
</section>
</main>
<script>
const DATA=[{"q": "Which shape has exactly 2 lines of reflection symmetry?", "o": ["Square", "Non-square rectangle", "Equilateral triangle", "Regular hexagon"], "a": "B"}, {"q": "What divides a 3-D shape into matching reflected halves?", "o": ["Line", "Point", "Plane", "Vertex"], "a": "C"}, {"q": "What is the order of rotational symmetry of a regular hexagon?", "o": ["2", "3", "6", "12"], "a": "C"}, {"q": "Central symmetry maps a shape onto itself after which rotation?", "o": ["90°", "180°", "270°", "360° only"], "a": "B"}, {"q": "Point P and its image P′ are related by central symmetry about centre C. Which statement must be true?", "o": ["PP′ is perpendicular to the x-axis.", "The line through P and P′ passes through C.", "P and P′ must have the same coordinates.", "C must lie on the y-axis."], "a": "B"}, {"q": "Shape B is the mirror image of shape A across a vertical line. What relationship is shown?", "o": ["Reflection symmetry", "Rotation symmetry only", "Translation only", "No symmetry"], "a": "A"}, {"q": "A shape is first reflected across a horizontal line and then rotated 90° clockwise. Which sequence describes the transformations?", "o": ["Rotation → reflection", "Reflection → rotation", "Translation → rotation", "Reflection → translation"], "a": "B"}, {"q": "Which statement best defines a tessellation?", "o": ["Shapes overlap to make a design.", "Only regular polygons are used.", "Repeating shapes cover a plane with no gaps or overlaps.", "A shape has one line of symmetry."], "a": "C"}, {"q": "Which statement about a circle is correct?", "o": ["It has exactly 2 lines of symmetry.", "It has rotational symmetry of order 4.", "It has infinitely many reflection and rotational symmetries.", "It has no rotational symmetry."], "a": "C"}, {"q": "Two rectangles each measure 4 cm by 9 cm. One is turned 90°. Which statement is true?", "o": ["They are similar but not congruent.", "They are congruent because they have the same size and shape.", "They are not congruent because their orientations differ.", "They are reflection-symmetric only."], "a": "B"}, {"q": "A student says, “A regular pentagon has 5 sides, so it has 5 lines of reflection symmetry and rotational symmetry of order 5.” Which response is correct?", "o": ["The student is correct.", "Only the reflection statement is correct.", "Only the rotation statement is correct.", "Both statements are incorrect."], "a": "A"}, {"q": "Shape A is reflected across a line and maps exactly onto shape B. Which statement must be true?", "o": ["The shapes have different sizes.", "The shapes are congruent and related by reflection symmetry.", "The shapes must be regular polygons.", "The shapes must have central symmetry."], "a": "B"}, {"q": "Which statement is NOT always true?", "o": ["Congruent shapes have the same size and shape.", "Congruent shapes can have different orientations.", "Congruent shapes must be related by reflection or rotation symmetry.", "A rotated copy of a shape can be congruent to the original."], "a": "C"}, {"q": "A regular polygon has 8 lines of reflection symmetry. What can be concluded?", "o": ["It has 4 sides and rotational order 4.", "It has 8 sides and rotational order 8.", "It has 16 sides and rotational order 8.", "It must be a circle."], "a": "B"}, {"q": "Congruent tiles cover a plane with no gaps or overlaps, and neighbouring tiles are related by reflections or rotations. What is shown?", "o": ["A tessellation with symmetry relationships", "A non-repeating pattern", "Only central symmetry", "An irregular polygon with no symmetry"], "a": "A"}];
let i=0, score=0, answered=false;
const num=document.getElementById('num'), total=document.getElementById('total'), scoreEl=document.getElementById('score'),
bar=document.getElementById('bar'), q=document.getElementById('question'), opts=document.getElementById('options'),
fb=document.getElementById('feedback'), next=document.getElementById('next');
total.textContent=DATA.length;
function render(){
  answered=false; const x=DATA[i]; num.textContent=i+1; scoreEl.textContent=score;
  bar.style.width=((i+1)/DATA.length*100)+'%'; q.textContent=x.q; fb.textContent=''; next.style.display='none';
  opts.innerHTML='';
  x.o.forEach((v,idx)=>{
    const letter=String.fromCharCode(65+idx);
    const b=document.createElement('button'); b.className='choice'; b.dataset.letter=letter;
    b.textContent=letter+'. '+v; b.onclick=()=>pick(b,x); opts.appendChild(b);
  });
}
function pick(el,x){
  if(answered)return; answered=true;
  document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;if(b.dataset.letter===x.a)b.classList.add('correct')});
  if(el.dataset.letter===x.a){score++;scoreEl.textContent=score;fb.textContent='✓ Correct!';}
  else{el.classList.add('wrong');fb.textContent='Correct answer: '+x.a;}
  next.textContent=i===DATA.length-1?'See Result':'Next Question';next.style.display='inline-block';
}
next.onclick=()=>{if(i<DATA.length-1){i++;render()}else{
  q.innerHTML='<div class="result"><h2>Practice complete!</h2><p>Your score: <strong>'+score+'/'+DATA.length+'</strong></p></div>';
  opts.innerHTML='';fb.textContent='';next.style.display='none';bar.style.width='100%';
}};
render();
</script>
</body></html>
