<body><a class="back" href="../index.html">← Back to Number</a><header><div class="brand">Canadian Math Practice</div><div class="meta">Ontario • Grade 6</div></header><div class="wrap"><div class="crumb">Grade 6 › Number › Compare & Order Numbers in Combination</div><h1>Compare & Order Numbers in Combination</h1><p class="lead">Compare and order integers, decimal numbers, and fractions together in the same set.</p><section class="card"><div class="top"><strong>Integer Practice</strong><span>Question <b id="n">1</b>/10 • Score <b id="score">0</b></span></div><div class="progress"><div class="fill" id="fill"></div></div><div class="q" id="q"></div><div class="options" id="opts"></div><div class="feedback" id="fb"></div><div class="why" id="why"></div><button class="next" id="next" onclick="nextQ()" style="display:none">Next Question</button></section></div>
<script>
let i=0,score=0,answered=false;
const D=[{"q":"Which number is greatest?","a":"0.8","o":["3/4","0.8","-1","1/2"],"w":"3/4 = 0.75 and 1/2 = 0.5, so 0.8 is greatest."},{"q":"Which number is least?","a":"-3","o":["-3","-1/2","0.2","1/4"],"w":"Negative numbers are less than positive numbers, and -3 is less than -1/2."},{"q":"Choose the correct symbol: 3/5 ___ 0.6","a":"=","o":["<",">","="],"w":"3/5 = 0.6, so the values are equal."},{"q":"Choose the correct symbol: -2 ___ 1/4","a":"<","o":["<",">","="],"w":"Any negative number is less than a positive number."},{"q":"Order from least to greatest: -1, 0.25, 1/2, -3","a":"-3, -1, 0.25, 1/2","o":["-3, -1, 0.25, 1/2","-1, -3, 0.25, 1/2","-3, -1, 1/2, 0.25","0.25, 1/2, -1, -3"],"w":"The negatives come first; 0.25 = 1/4 and 1/2 = 0.5."},{"q":"Which number is between 0.6 and 0.8?","a":"3/4","o":["1/2","3/4","5/6","-3/4"],"w":"3/4 = 0.75, which lies between 0.6 and 0.8."},{"q":"Which list is ordered from greatest to least?","a":"1.2, 3/4, 0, -2","o":["1.2, 3/4, 0, -2","3/4, 1.2, 0, -2","1.2, 0, 3/4, -2","-2, 0, 3/4, 1.2"],"w":"1.2 > 0.75 > 0 > -2."},{"q":"A temperature is -1°C. Another temperature is 1/2°C. Which statement is true?","a":"-1°C < 1/2°C","o":["-1°C > 1/2°C","-1°C < 1/2°C","-1°C = 1/2°C","They cannot be compared."],"w":"-1 is negative and 1/2 is positive, so -1 < 1/2."},{"q":"Which value is closest to zero?","a":"0.1","o":["-2","1/4","0.1","-1/2"],"w":"Their distances from zero are 2, 0.25, 0.1, and 0.5. The smallest distance is 0.1."},{"q":"Four values are -1/2, 0.45, -1, and 2/5. Which is the second greatest?","a":"2/5","o":["-1","-1/2","2/5","0.45"],"w":"2/5 = 0.4, so the order is 0.45 > 0.4 > -0.5 > -1."}];
const n=document.getElementById("n"),sc=document.getElementById("score"),fill=document.getElementById("fill"),q=document.getElementById("q"),opts=document.getElementById("opts"),fb=document.getElementById("fb"),why=document.getElementById("why"),next=document.getElementById("next");
function render(){answered=false;let x=D[i];n.textContent=i+1;sc.textContent=score;fill.style.width=((i+1)*10)+"%";q.textContent=x.q;fb.textContent="";why.textContent="";next.style.display="none";opts.innerHTML=[...x.o].sort(()=>Math.random()-.5).map(v=>`<button class="opt" data-v="${v}" onclick="pick(this)">${v}</button>`).join("")}
function pick(el){if(answered)return;answered=true;document.querySelectorAll(".opt").forEach(b=>b.disabled=true);let x=D[i];if(el.dataset.v===x.a){score++;sc.textContent=score;fb.textContent="✓ Correct!"}else fb.textContent="✗ Not quite. Correct answer: "+x.a;why.textContent=x.w;next.textContent=i===9?"See Result":"Next Question";next.style.display="inline-block"}
function nextQ(){if(i<9){i++;render()}else{q.textContent="Practice complete!";opts.innerHTML="";fb.textContent=`Your score: ${score}/10`;why.textContent=score>=8?"Strong integer reasoning.":"Try again and use a number line: numbers farther right are greater, and numbers farther left are less.";next.style.display="none"}}render();</script></body></html>
