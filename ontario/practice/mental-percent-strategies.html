*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fa;color:#172033}.back{display:inline-block;margin:16px 5% 0;text-decoration:none;font-weight:700;color:#172033}header{padding:18px 5%;background:#fff;border-bottom:1px solid #e2e7ee;display:flex;justify-content:space-between}.brand{font-weight:800;font-size:22px}.meta{color:#667085}.wrap{max-width:1000px;margin:auto;padding:42px 5% 70px}.crumb{color:#667085;font-size:14px}h1{font-size:42px;margin:12px 0 8px}.lead{font-size:18px;color:#667085}.card{background:#fff;border:1px solid #e1e6ed;border-radius:16px;padding:28px;margin-top:28px}.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:#667085}.progress{height:8px;background:#e8ecf2;border-radius:99px;margin:15px 0 30px;overflow:hidden}.fill{height:100%;background:#172033}.q{font-size:27px;font-weight:800;line-height:1.45;margin:18px 0 22px}.options{display:grid;gap:10px;max-width:820px}.opt{background:#fff;border:1px solid #cfd6df;border-radius:10px;padding:14px;text-align:left;font-size:17px;font-weight:700;cursor:pointer;color:#172033}.feedback{font-weight:800;margin-top:18px}.why{color:#667085;line-height:1.55;margin-top:7px}.next{margin-top:18px;background:#172033;color:#fff;border:0;border-radius:9px;padding:11px 15px;font-weight:800;cursor:pointer}@media(max-width:600px){h1{font-size:34px}.q{font-size:22px}header{flex-direction:column;gap:5px}}</style></head>
<body><a class="back" href="../index.html">← Back to Number</a><header><div class="brand">Canadian Math Practice</div><div class="meta">Ontario • Grade 6</div></header><div class="wrap"><div class="crumb">Grade 6 › Number › Mental Percent Strategies</div><h1>Mental Percent Strategies</h1><p class="lead">Calculate 1%, 5%, 10%, 15%, 25%, and 50% of whole numbers using mental math.</p><section class="card"><div class="top"><strong>Integer Practice</strong><span>Question <b id="n">1</b>/10 • Score <b id="score">0</b></span></div><div class="progress"><div class="fill" id="fill"></div></div><div class="q" id="q"></div><div class="options" id="opts"></div><div class="feedback" id="fb"></div><div class="why" id="why"></div><button class="next" id="next" onclick="nextQ()" style="display:none">Next Question</button></section></div>
<script>
let i=0,score=0,answered=false;
const D=[{"q":"What is 10% of 240?","a":"24","o":["2.4","24","120","240"],"w":"10% is one tenth. 240 ÷ 10 = 24."},{"q":"What is 1% of 600?","a":"6","o":["0.6","6","60","600"],"w":"1% is one hundredth. 600 ÷ 100 = 6."},{"q":"What is 50% of 86?","a":"43","o":["36","43","50","172"],"w":"50% means one half. Half of 86 is 43."},{"q":"What is 25% of 120?","a":"30","o":["25","30","40","60"],"w":"25% is one quarter. 120 ÷ 4 = 30."},{"q":"What is 5% of 360?","a":"18","o":["5","18","36","72"],"w":"10% of 360 is 36, so 5% is half of 36: 18."},{"q":"What is 15% of 200?","a":"30","o":["15","20","30","40"],"w":"10% of 200 is 20 and 5% is 10; together they make 30."},{"q":"A $70 backpack is discounted by 10%. What is the discount?","a":"$7","o":["$6","$7","$10","$63"],"w":"10% of $70 is $7."},{"q":"There are 80 students. If 25% bring lunch from home, how many students is that?","a":"20","o":["15","20","25","40"],"w":"25% is one quarter, and 80 ÷ 4 = 20."},{"q":"Which strategy correctly finds 15% of 60?","a":"Find 10% (6) and 5% (3), then add to get 9.","o":["Find 10% (6) and 5% (3), then add to get 9.","Divide 60 by 15 to get 4.","Find 50% of 60 to get 30.","Add 15 to 60 to get 75."],"w":"15% = 10% + 5%, so 6 + 3 = 9."},{"q":"A class goal is 300 points. They have earned 50% of the goal. How many points have they earned?","a":"150","o":["50","100","150","250"],"w":"50% is one half, and half of 300 is 150."}];
const n=document.getElementById("n"),sc=document.getElementById("score"),fill=document.getElementById("fill"),q=document.getElementById("q"),opts=document.getElementById("opts"),fb=document.getElementById("fb"),why=document.getElementById("why"),next=document.getElementById("next");
function render(){answered=false;let x=D[i];n.textContent=i+1;sc.textContent=score;fill.style.width=((i+1)*10)+"%";q.textContent=x.q;fb.textContent="";why.textContent="";next.style.display="none";opts.innerHTML=[...x.o].sort(()=>Math.random()-.5).map(v=>`<button class="opt" data-v="${v}" onclick="pick(this)">${v}</button>`).join("")}
function pick(el){if(answered)return;answered=true;document.querySelectorAll(".opt").forEach(b=>b.disabled=true);let x=D[i];if(el.dataset.v===x.a){score++;sc.textContent=score;fb.textContent="✓ Correct!"}else fb.textContent="✗ Not quite. Correct answer: "+x.a;why.textContent=x.w;next.textContent=i===9?"See Result":"Next Question";next.style.display="inline-block"}
function nextQ(){if(i<9){i++;render()}else{q.textContent="Practice complete!";opts.innerHTML="";fb.textContent=`Your score: ${score}/10`;why.textContent=score>=8?"Strong integer reasoning.":"Try again and use a number line: numbers farther right are greater, and numbers farther left are less.";next.style.display="none"}}render();</script></body></html>
