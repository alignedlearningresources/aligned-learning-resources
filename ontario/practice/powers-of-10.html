<title>Powers of 10 Review | Ontario Grade 6 Math</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fa;color:#172033}.back{display:inline-block;margin:16px 5% 0;text-decoration:none;font-weight:700;color:#172033}header{padding:18px 5%;background:#fff;border-bottom:1px solid #e2e7ee;display:flex;justify-content:space-between}.brand{font-weight:800;font-size:22px}.meta{color:#667085}.wrap{max-width:1000px;margin:auto;padding:42px 5% 70px}.crumb{color:#667085;font-size:14px}h1{font-size:42px;margin:12px 0 8px}.lead{font-size:18px;color:#667085}.card{background:#fff;border:1px solid #e1e6ed;border-radius:16px;padding:28px;margin-top:28px}.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:#667085}.progress{height:8px;background:#e8ecf2;border-radius:99px;margin:15px 0 30px;overflow:hidden}.fill{height:100%;background:#172033}.q{font-size:28px;font-weight:800;line-height:1.4;margin:18px 0 22px}.options{display:grid;gap:10px;max-width:780px}.opt{background:#fff;border:1px solid #cfd6df;border-radius:10px;padding:14px;text-align:left;font-size:16px;font-weight:700;cursor:pointer;color:#172033}.feedback{font-weight:800;margin-top:18px}.why{color:#667085;line-height:1.5;margin-top:7px}.next{margin-top:18px;background:#172033;color:#fff;border:0;border-radius:9px;padding:11px 15px;font-weight:800;cursor:pointer}@media(max-width:600px){h1{font-size:34px}.q{font-size:23px}header{flex-direction:column;gap:5px}}</style></head>
<body><a class="back" href="../index.html">← Back to Number</a><header><div class="brand">Canadian Math Practice</div><div class="meta">Ontario • Grade 6</div></header><div class="wrap"><div class="crumb">Grade 6 › Number › Powers of 10 Review</div><h1>Powers of 10 Review</h1><p class="lead">Review powers-of-10 patterns that support place value and efficient calculation.</p><section class="card"><div class="top"><strong>Powers of 10 Practice</strong><span>Question <b id="n">1</b>/10 • Score <b id="score">0</b></span></div><div class="progress"><div class="fill" id="fill"></div></div><div class="q" id="q"></div><div class="options" id="opts"></div><div class="feedback" id="fb"></div><div class="why" id="why"></div><button class="next" id="next" onclick="nextQ()" style="display:none">Next Question</button></section></div>
<script>
let i=0,score=0,answered=false;
const D=[
{q:"What is 10²?",a:"100",o:["20","100","1,000","10,000"],w:"10² means 10 × 10, which equals 100."},
{q:"Which power of 10 equals 1,000?",a:"10³",o:["10²","10³","10⁴","10⁵"],w:"1,000 = 10 × 10 × 10 = 10³."},
{q:"What is 6 × 10?",a:"60",o:["6","16","60","600"],w:"Multiplying by 10 makes each digit's place value 10 times as great: 6 × 10 = 60."},
{q:"What is 43 × 100?",a:"4,300",o:["430","4,300","43,000","4.3"],w:"100 = 10², so 43 × 100 = 4,300."},
{q:"What is 52,000 ÷ 100?",a:"520",o:["52","520","5,200","520,000"],w:"Dividing by 100 makes each digit's place value one hundredth as great: 52,000 ÷ 100 = 520."},
{q:"Which expression is equal to 7,000?",a:"7 × 10³",o:["7 × 10²","7 × 10³","70 × 10³","7 + 10³"],w:"10³ = 1,000, and 7 × 1,000 = 7,000."},
{q:"What is 4.82 × 100?",a:"482",o:["0.0482","48.2","482","4,820"],w:"Multiplying by 100 makes each digit's place value 100 times as great: 4.82 × 100 = 482."},
{q:"What is 735 ÷ 10²?",a:"7.35",o:["0.735","7.35","73.5","73,500"],w:"10² = 100, so 735 ÷ 100 = 7.35."},
{q:"A number is multiplied by 10³ and becomes 84,000. What was the original number?",a:"84",o:["8.4","84","840","8,400"],w:"10³ = 1,000. Since 84 × 1,000 = 84,000, the original number was 84."},
{q:"Which statement is true?",a:"3.6 × 10³ = 3,600",o:["3.6 × 10² = 36","3.6 × 10³ = 3,600","360 ÷ 10² = 36","36 × 10³ = 3,600"],w:"10³ = 1,000, so 3.6 × 1,000 = 3,600. The other statements are false."}
];
const n=document.getElementById("n"),sc=document.getElementById("score"),fill=document.getElementById("fill"),q=document.getElementById("q"),opts=document.getElementById("opts"),fb=document.getElementById("fb"),why=document.getElementById("why"),next=document.getElementById("next");
function render(){answered=false;let x=D[i];n.textContent=i+1;sc.textContent=score;fill.style.width=((i+1)*10)+"%";q.textContent=x.q;fb.textContent="";why.textContent="";next.style.display="none";opts.innerHTML=[...x.o].sort(()=>Math.random()-.5).map(v=>`<button class="opt" data-v="${v}" onclick="pick(this)">${v}</button>`).join("")}
function pick(el){if(answered)return;answered=true;document.querySelectorAll(".opt").forEach(b=>b.disabled=true);let x=D[i];if(el.dataset.v===x.a){score++;sc.textContent=score;fb.textContent="✓ Correct!"}else fb.textContent="✗ Not quite. Correct answer: "+x.a;why.textContent=x.w;next.textContent=i===9?"See Result":"Next Question";next.style.display="inline-block"}
function nextQ(){if(i<9){i++;render()}else{q.textContent="Practice complete!";opts.innerHTML="";fb.textContent=`Your score: ${score}/10`;why.textContent=score>=8?"Strong work with powers of 10.":"Try again and connect each power of 10 to its place-value effect.";next.style.display="none"}}render();</script></body></html>
