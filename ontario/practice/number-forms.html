<div class="wrap"><div class="crumb">Grade 6 â€º Number â€º Number Forms</div><h1>Number Forms</h1>
<p class="lead">Standard form, word form, and expanded form â€” from simple numbers to Grade 6 mastery.</p>
<section class="card"><div class="top"><strong>Number Forms Practice</strong><span>Question <b id="n">1</b>/10 â€¢ Score <b id="score">0</b></span></div>
<div class="progress"><div class="fill" id="fill"></div></div><div class="q" id="q"></div><div class="prompt" id="prompt"></div><div class="options" id="opts"></div>
<div class="feedback" id="fb"></div><div class="why" id="why"></div><button class="next" id="next" onclick="nextQ()" style="display:none">Next Question</button></section></div>
<script>
let i=0,score=0,answered=false;
const data=[
{q:"Which is the word form of this number?",p:"42",a:"forty-two",o:["forty-two","fourteen-two","four hundred two","four thousand two"],w:"42 is written as forty-two."},
{q:"Which is the standard form?",p:"three hundred six",a:"306",o:["306","360","3,006","36"],w:"Three hundred six is 306."},
{q:"Which is the expanded form?",p:"584",a:"500 + 80 + 4",o:["500 + 80 + 4","50 + 80 + 4","500 + 8 + 4","500 + 84"],w:"584 = 500 + 80 + 4."},
{q:"Which is the standard form?",p:"four thousand seventy-two",a:"4,072",o:["4,072","4,702","4,720","40,072"],w:"Four thousand seventy-two is 4,072."},
{q:"Which is the expanded form?",p:"23,405",a:"20,000 + 3,000 + 400 + 5",o:["20,000 + 3,000 + 400 + 5","20,000 + 300 + 40 + 5","2,000 + 3,000 + 400 + 5","20,000 + 3,000 + 40 + 5"],w:"The non-zero place values are 20,000, 3,000, 400, and 5."},
{q:"Which is the word form?",p:"70,608",a:"seventy thousand six hundred eight",o:["seventy thousand six hundred eight","seven thousand six hundred eight","seventy thousand sixty-eight","seven hundred six thousand eight"],w:"70,608 is seventy thousand six hundred eight."},
{q:"Which number matches this expanded form?",p:"300,000 + 40,000 + 2,000 + 70 + 6",a:"342,076",o:["342,076","342,706","340,276","302,476"],w:"300,000 + 40,000 + 2,000 + 70 + 6 = 342,076."},
{q:"Which is the expanded form?",p:"506,090",a:"500,000 + 6,000 + 90",o:["500,000 + 6,000 + 90","500,000 + 60,000 + 90","500,000 + 6,000 + 900","50,000 + 6,000 + 90"],w:"Zero digits contribute no additional non-zero term: 506,090 = 500,000 + 6,000 + 90."},
{q:"Which is the standard form?",p:"nine hundred four thousand seventeen",a:"904,017",o:["904,017","940,017","904,170","900,417"],w:"Nine hundred four thousand seventeen is 904,017."},
{q:"Which representation is equal to 830,405?",p:"Choose one.",a:"800,000 + 30,000 + 400 + 5",o:["800,000 + 30,000 + 400 + 5","800,000 + 3,000 + 400 + 5","800,000 + 30,000 + 40 + 5","800,000 + 30,000 + 4,000 + 5"],w:"830,405 has 8 hundred-thousands, 3 ten-thousands, 4 hundreds, and 5 ones."}
];
function render(){answered=false;let x=data[i];n.textContent=i+1;scoreEl.textContent=score;fill.style.width=((i+1)*10)+"%";q.textContent=x.q;prompt.textContent=x.p;fb.textContent="";why.textContent="";next.style.display="none";let arr=[...x.o].sort(()=>Math.random()-.5);opts.innerHTML=arr.map(v=>`<button class="opt" data-v="${v.replace(/"/g,'&quot;')}" onclick="pick(this)">${v}</button>`).join("")}
const n=document.getElementById("n"),scoreEl=document.getElementById("score"),fill=document.getElementById("fill"),q=document.getElementById("q"),prompt=document.getElementById("prompt"),opts=document.getElementById("opts"),fb=document.getElementById("fb"),why=document.getElementById("why"),next=document.getElementById("next");
function pick(el){if(answered)return;answered=true;document.querySelectorAll(".opt").forEach(b=>b.disabled=true);let x=data[i];if(el.dataset.v===x.a){score++;scoreEl.textContent=score;fb.textContent="âœ“ Correct!"}else fb.textContent="âœ— Not quite. Correct answer: "+x.a;why.textContent=x.w;next.textContent=i===9?"See Result":"Next Question";next.style.display="inline-block"}
function nextQ(){if(i<9){i++;render()}else{q.textContent="Practice complete!";prompt.textContent=`Your score: ${score}/10`;opts.innerHTML="";fb.textContent=score>=8?"Great work!":"Try the practice again to strengthen your number-form skills.";why.textContent="";next.style.display="none"}}
render();
</script></body></html>
