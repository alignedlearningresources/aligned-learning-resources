<body><a class="back" href="../index.html">← Back to Number</a><header><div class="brand">Canadian Math Practice</div><div class="meta">Ontario • Grade 6</div></header><div class="wrap"><div class="crumb">Grade 6 › Number › Whole Numbers ÷ Proper Fractions</div><h1>Whole Numbers ÷ Proper Fractions</h1><p class="lead">Divide whole numbers by proper fractions when the quotient is a whole number.</p><section class="card"><div class="top"><strong>Integer Practice</strong><span>Question <b id="n">1</b>/10 • Score <b id="score">0</b></span></div><div class="progress"><div class="fill" id="fill"></div></div><div class="q" id="q"></div><div class="options" id="opts"></div><div class="feedback" id="fb"></div><div class="why" id="why"></div><button class="next" id="next" onclick="nextQ()" style="display:none">Next Question</button></section></div>
<script>
let i=0,score=0,answered=false;
const D=[{"q":"What is 3 ÷ 1/2?","a":"6","o":["1 1/2","3","5","6"],"w":"There are 6 halves in 3."},{"q":"What is 4 ÷ 1/4?","a":"16","o":["1","8","12","16"],"w":"Four wholes contain 16 fourths."},{"q":"What is 6 ÷ 2/3?","a":"9","o":["4","8","9","12"],"w":"Six wholes contain 18 thirds; 18 ÷ 2 = 9."},{"q":"What is 5 ÷ 5/6?","a":"6","o":["5","6","10","30"],"w":"Five wholes contain 30 sixths; 30 ÷ 5 = 6."},{"q":"How many 1/3-m pieces can be cut from 4 m?","a":"12","o":["7","8","12","16"],"w":"4 ÷ 1/3 = 12."},{"q":"A 6-L container is filled using a 3/4-L scoop. How many scoops?","a":"8","o":["4","6","8","10"],"w":"6 ÷ 3/4 = 8."},{"q":"Which expression finds how many 2/5-km sections fit into 8 km?","a":"8 ÷ 2/5","o":["8 × 2/5","8 ÷ 2/5","2/5 ÷ 8","8 − 2/5"],"w":"Use division to find how many equal groups fit."},{"q":"What is 9 ÷ 3/5?","a":"15","o":["5","12","15","27"],"w":"Nine wholes contain 45 fifths; 45 ÷ 3 = 15."},{"q":"10 kg of flour is used in 2/5-kg batches. How many batches?","a":"25","o":["4","20","25","50"],"w":"10 ÷ 2/5 = 25."},{"q":"Maya says 7 ÷ 1/7 = 1. Which is correct?","a":"Maya is incorrect; the answer is 49.","o":["Maya is correct.","Maya is incorrect; the answer is 7.","Maya is incorrect; the answer is 14.","Maya is incorrect; the answer is 49."],"w":"Seven wholes contain 49 sevenths."}];
const n=document.getElementById("n"),sc=document.getElementById("score"),fill=document.getElementById("fill"),q=document.getElementById("q"),opts=document.getElementById("opts"),fb=document.getElementById("fb"),why=document.getElementById("why"),next=document.getElementById("next");
function render(){answered=false;let x=D[i];n.textContent=i+1;sc.textContent=score;fill.style.width=((i+1)*10)+"%";q.textContent=x.q;fb.textContent="";why.textContent="";next.style.display="none";opts.innerHTML=[...x.o].sort(()=>Math.random()-.5).map(v=>`<button class="opt" data-v="${v}" onclick="pick(this)">${v}</button>`).join("")}
function pick(el){if(answered)return;answered=true;document.querySelectorAll(".opt").forEach(b=>b.disabled=true);let x=D[i];if(el.dataset.v===x.a){score++;sc.textContent=score;fb.textContent="✓ Correct!"}else fb.textContent="✗ Not quite. Correct answer: "+x.a;why.textContent=x.w;next.textContent=i===9?"See Result":"Next Question";next.style.display="inline-block"}
function nextQ(){if(i<9){i++;render()}else{q.textContent="Practice complete!";opts.innerHTML="";fb.textContent=`Your score: ${score}/10`;why.textContent=score>=8?"Strong integer reasoning.":"Try again and use a number line: numbers farther right are greater, and numbers farther left are less.";next.style.display="none"}}render();</script></body></html>
