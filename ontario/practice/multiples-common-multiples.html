*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fa;color:#172033}.back{display:inline-block;margin:16px 5% 0;text-decoration:none;font-weight:700;color:#172033}header{padding:18px 5%;background:#fff;border-bottom:1px solid #e2e7ee;display:flex;justify-content:space-between}.brand{font-weight:800;font-size:22px}.meta{color:#667085}.wrap{max-width:1000px;margin:auto;padding:42px 5% 70px}.crumb{color:#667085;font-size:14px}h1{font-size:42px;margin:12px 0 8px}.lead{font-size:18px;color:#667085}.card{background:#fff;border:1px solid #e1e6ed;border-radius:16px;padding:28px;margin-top:28px}.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:#667085}.progress{height:8px;background:#e8ecf2;border-radius:99px;margin:15px 0 30px;overflow:hidden}.fill{height:100%;background:#172033}.q{font-size:28px;font-weight:800;line-height:1.4;margin:18px 0 22px}.options{display:grid;gap:10px;max-width:800px}.opt{background:#fff;border:1px solid #cfd6df;border-radius:10px;padding:14px;text-align:left;font-size:16px;font-weight:700;cursor:pointer;color:#172033}.feedback{font-weight:800;margin-top:18px}.why{color:#667085;line-height:1.5;margin-top:7px}.next{margin-top:18px;background:#172033;color:#fff;border:0;border-radius:9px;padding:11px 15px;font-weight:800;cursor:pointer}@media(max-width:600px){h1{font-size:34px}.q{font-size:23px}header{flex-direction:column;gap:5px}}</style></head>
<body><a class="back" href="../index.html">← Back to Number</a><header><div class="brand">Canadian Math Practice</div><div class="meta">Ontario • Grade 6</div></header><div class="wrap"><div class="crumb">Grade 6 › Number › Multiples & Common Multiples Review</div><h1>Multiples & Common Multiples Review</h1><p class="lead">Review multiples and common multiples as supporting number sense.</p><section class="card"><div class="top"><strong>Multiples Practice</strong><span>Question <b id="n">1</b>/10 • Score <b id="score">0</b></span></div><div class="progress"><div class="fill" id="fill"></div></div><div class="q" id="q"></div><div class="options" id="opts"></div><div class="feedback" id="fb"></div><div class="why" id="why"></div><button class="next" id="next" onclick="nextQ()" style="display:none">Next Question</button></section></div>
<script>
let i=0,score=0,answered=false;
const D=[
{q:"Which number is a multiple of 4?",a:"20",o:["14","18","20","22"],w:"20 = 4 × 5, so 20 is a multiple of 4."},
{q:"What is the next multiple of 6 after 24?",a:"30",o:["26","28","30","36"],w:"The multiples of 6 include 6, 12, 18, 24, 30, so the next one is 30."},
{q:"Which list contains only multiples of 5?",a:"15, 25, 40",o:["15, 25, 40","10, 22, 35","5, 16, 30","20, 31, 45"],w:"15, 25, and 40 are all divisible by 5."},
{q:"Which number is a common multiple of 3 and 4?",a:"24",o:["9","16","18","24"],w:"24 is divisible by both 3 and 4."},
{q:"Which list shows the first three positive common multiples of 4 and 6?",a:"12, 24, 36",o:["10, 20, 30","12, 24, 36","6, 12, 18","24, 48, 72"],w:"The common multiples begin 12, 24, 36, 48, ..."},
{q:"Which number is NOT a common multiple of 6 and 8?",a:"40",o:["24","40","48","72"],w:"40 is a multiple of 8, but it is not divisible by 6."},
{q:"A number is a multiple of both 5 and 7. Which number could it be?",a:"70",o:["45","50","63","70"],w:"70 = 5 × 14 and 70 = 7 × 10, so it is a multiple of both."},
{q:"Two lights flash every 8 seconds and every 12 seconds. If they flash together now, after how many seconds will they next flash together?",a:"24 seconds",o:["12 seconds","20 seconds","24 seconds","48 seconds"],w:"The first positive common multiple of 8 and 12 is 24."},
{q:"Which statement is true about every common multiple of 6 and 9?",a:"It is a multiple of 18.",o:["It is a multiple of 18.","It must be odd.","It is always less than 100.","It cannot be a multiple of 3."],w:"The least common multiple of 6 and 9 is 18, so every common multiple is a multiple of 18."},
{q:"A number greater than 110 and less than 140 is a multiple of both 8 and 12. What is the number?",a:"120",o:["112","120","128","136"],w:"Common multiples of 8 and 12 are multiples of 24. The only multiple of 24 between 110 and 140 is 120."}
];
const n=document.getElementById("n"),sc=document.getElementById("score"),fill=document.getElementById("fill"),q=document.getElementById("q"),opts=document.getElementById("opts"),fb=document.getElementById("fb"),why=document.getElementById("why"),next=document.getElementById("next");
function render(){answered=false;let x=D[i];n.textContent=i+1;sc.textContent=score;fill.style.width=((i+1)*10)+"%";q.textContent=x.q;fb.textContent="";why.textContent="";next.style.display="none";opts.innerHTML=[...x.o].sort(()=>Math.random()-.5).map(v=>`<button class="opt" data-v="${v}" onclick="pick(this)">${v}</button>`).join("")}
function pick(el){if(answered)return;answered=true;document.querySelectorAll(".opt").forEach(b=>b.disabled=true);let x=D[i];if(el.dataset.v===x.a){score++;sc.textContent=score;fb.textContent="✓ Correct!"}else fb.textContent="✗ Not quite. Correct answer: "+x.a;why.textContent=x.w;next.textContent=i===9?"See Result":"Next Question";next.style.display="inline-block"}
function nextQ(){if(i<9){i++;render()}else{q.textContent="Practice complete!";opts.innerHTML="";fb.textContent=`Your score: ${score}/10`;why.textContent=score>=8?"Strong work with multiples.":"Try again and list multiples systematically when looking for common multiples.";next.style.display="none"}}render();</script></body></html>
