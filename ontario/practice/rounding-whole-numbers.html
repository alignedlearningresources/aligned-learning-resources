<div class="wrap"><div class="crumb">Grade 6 â€º Number â€º Whole Number Rounding Review</div><h1>Whole Number Rounding Review</h1>
<p class="lead">Review whole-number rounding to support estimation and reasonableness.</p>
<section class="card"><div class="top"><strong>Rounding Practice</strong><span>Question <b id="n">1</b>/10 â€¢ Score <b id="score">0</b></span></div><div class="progress"><div class="fill" id="fill"></div></div>
<div class="q" id="q"></div><div class="options" id="opts"></div><div class="feedback" id="fb"></div><div class="why" id="why"></div><button class="next" id="next" onclick="nextQ()" style="display:none">Next Question</button></section></div>
<script>
let i=0,score=0,answered=false;
const D=[
{q:"Round 47 to the nearest ten.",a:"50",o:["40","50","47","60"],w:"The ones digit is 7, so round up: 47 rounds to 50."},
{q:"Round 263 to the nearest ten.",a:"260",o:["250","260","270","300"],w:"The ones digit is 3, so 263 rounds to 260."},
{q:"Round 684 to the nearest hundred.",a:"700",o:["600","680","700","800"],w:"The tens digit is 8, so 684 rounds to 700."},
{q:"Round 3,451 to the nearest hundred.",a:"3,500",o:["3,400","3,450","3,500","4,000"],w:"The tens digit is 5, so 3,451 rounds up to 3,500."},
{q:"Round 18,249 to the nearest thousand.",a:"18,000",o:["18,000","18,200","18,300","19,000"],w:"The hundreds digit is 2, so 18,249 rounds to 18,000."},
{q:"Round 56,782 to the nearest ten thousand.",a:"60,000",o:["50,000","56,000","57,000","60,000"],w:"The thousands digit is 6, so 56,782 rounds to 60,000."},
{q:"Round 204,649 to the nearest thousand.",a:"205,000",o:["204,000","204,600","205,000","210,000"],w:"The hundreds digit is 6, so 204,649 rounds up to 205,000."},
{q:"Round 450,120 to the nearest hundred thousand.",a:"500,000",o:["400,000","450,000","500,000","600,000"],w:"The ten-thousands digit is 5, so 450,120 rounds to 500,000."},
{q:"Which number rounds to 390,000 when rounded to the nearest ten thousand?",a:"386,420",o:["384,999","386,420","395,010","404,999"],w:"Numbers from 385,000 through 394,999 round to 390,000. Only 386,420 is in that interval."},
{q:"A town has 748,650 people. About how many people is that to the nearest hundred thousand?",a:"700,000",o:["700,000","740,000","750,000","800,000"],w:"The ten-thousands digit is 4, so 748,650 rounds down to 700,000."}
];
const n=document.getElementById("n"),sc=document.getElementById("score"),fill=document.getElementById("fill"),q=document.getElementById("q"),opts=document.getElementById("opts"),fb=document.getElementById("fb"),why=document.getElementById("why"),next=document.getElementById("next");
function render(){answered=false;let x=D[i];n.textContent=i+1;sc.textContent=score;fill.style.width=((i+1)*10)+"%";q.textContent=x.q;fb.textContent="";why.textContent="";next.style.display="none";opts.innerHTML=[...x.o].sort(()=>Math.random()-.5).map(v=>`<button class="opt" data-v="${v}" onclick="pick(this)">${v}</button>`).join("")}
function pick(el){if(answered)return;answered=true;document.querySelectorAll(".opt").forEach(b=>b.disabled=true);let x=D[i];if(el.dataset.v===x.a){score++;sc.textContent=score;fb.textContent="âœ“ Correct!"}else fb.textContent="âœ— Not quite. Correct answer: "+x.a;why.textContent=x.w;next.textContent=i===9?"See Result":"Next Question";next.style.display="inline-block"}
function nextQ(){if(i<9){i++;render()}else{q.textContent="Practice complete!";opts.innerHTML="";fb.textContent=`Your score: ${score}/10`;why.textContent=score>=8?"Strong work.":"Try again and focus on the digit immediately to the right of the rounding place.";next.style.display="none"}}
render();</script></body></html>
