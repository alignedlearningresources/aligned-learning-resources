<div class="wrap"><div class="crumb">Grade 6 â€º Number â€º Comparing & Ordering</div><h1>Comparing & Ordering</h1><p class="lead">10 questions that progress from smaller whole numbers to six-digit comparison and ordering.</p>
<section class="card"><div class="top"><strong>Comparing & Ordering Practice</strong><span>Question <b id="n">1</b>/10 â€¢ Score <b id="score">0</b></span></div><div class="progress"><div class="fill" id="fill"></div></div>
<div class="q" id="q"></div><div class="options" id="opts"></div><div class="feedback" id="fb"></div><div class="why" id="why"></div><button class="next" id="next" onclick="nextQ()" style="display:none">Next Question</button></section></div>
<script>
let i=0,score=0,answered=false;
const D=[
{q:"Choose the correct symbol: 47 ___ 52",a:"<",o:["<",">","="],w:"47 is less than 52, so 47 < 52."},
{q:"Which number is greatest?",a:"318",o:["281","318","183","308"],w:"318 has 3 hundreds, and among the numbers with 3 hundreds it has the greatest tens digit."},
{q:"Order from least to greatest: 625, 562, 652",a:"562, 625, 652",o:["562, 625, 652","652, 625, 562","625, 562, 652","562, 652, 625"],w:"562 < 625 < 652."},
{q:"Choose the correct symbol: 4,072 ___ 4,207",a:"<",o:["<",">","="],w:"Both have 4 thousands. Compare the hundreds digits: 0 < 2, so 4,072 < 4,207."},
{q:"Which number is least?",a:"18,905",o:["19,085","18,950","18,905","19,005"],w:"18,905 is the only choice below 18,950 and below all numbers beginning with 19 thousand."},
{q:"Order from greatest to least: 63,420; 63,204; 64,032; 62,430",a:"64,032; 63,420; 63,204; 62,430",o:["64,032; 63,420; 63,204; 62,430","62,430; 63,204; 63,420; 64,032","64,032; 63,204; 63,420; 62,430","63,420; 64,032; 63,204; 62,430"],w:"Compare the ten-thousands first, then move right when the leading digits match."},
{q:"Choose the correct symbol: 105,090 ___ 99,999",a:">",o:["<",">","="],w:"105,090 is a six-digit number greater than 99,999."},
{q:"Which number is greatest?",a:"507,042",o:["507,024","507,042","506,942","507,004"],w:"The first three digits tie for several choices. Comparing the remaining place values shows 507,042 is greatest."},
{q:"Order from least to greatest: 405,700; 405,070; 450,007; 405,007",a:"405,007; 405,070; 405,700; 450,007",o:["405,007; 405,070; 405,700; 450,007","405,070; 405,007; 405,700; 450,007","450,007; 405,700; 405,070; 405,007","405,007; 405,700; 405,070; 450,007"],w:"Compare from the hundred-thousands place to the ones place. Zeros make the place values especially important."},
{q:"A number is greater than 698,950 but less than 699,010. Which number could it be?",a:"698,999",o:["698,905","698,999","699,015","699,100"],w:"698,999 lies strictly between 698,950 and 699,010. The other choices fall outside the interval."}
];
const n=document.getElementById("n"),sc=document.getElementById("score"),fill=document.getElementById("fill"),q=document.getElementById("q"),opts=document.getElementById("opts"),fb=document.getElementById("fb"),why=document.getElementById("why"),next=document.getElementById("next");
function render(){answered=false;let x=D[i];n.textContent=i+1;sc.textContent=score;fill.style.width=((i+1)*10)+"%";q.textContent=x.q;fb.textContent="";why.textContent="";next.style.display="none";opts.innerHTML=[...x.o].sort(()=>Math.random()-.5).map(v=>`<button class="opt" data-v="${v}" onclick="pick(this)">${v}</button>`).join("")}
function pick(el){if(answered)return;answered=true;document.querySelectorAll(".opt").forEach(b=>b.disabled=true);let x=D[i];if(el.dataset.v===x.a){score++;sc.textContent=score;fb.textContent="âœ“ Correct!"}else fb.textContent="âœ— Not quite. Correct answer: "+x.a;why.textContent=x.w;next.textContent=i===9?"See Result":"Next Question";next.style.display="inline-block"}
function nextQ(){if(i<9){i++;render()}else{q.textContent="Practice complete!";opts.innerHTML="";fb.textContent=`Your score: ${score}/10`;why.textContent=score>=8?"Strong work.":"Try again and use place value to compare from left to right.";next.style.display="none"}}
render();</script></body></html>
